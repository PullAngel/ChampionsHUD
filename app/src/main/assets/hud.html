<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HUD</title>
<style>
/* Paleta tomada del UI de Champions: carmesí para el rival, azul real para lo
   tuyo, verde ácido para lo seleccionado, texto crema.
   Layout pensado para HORIZONTAL: el panel es más ancho que alto, así que la
   navegación va en un riel lateral y el alto se reserva para datos. */
:root{
  --ink:#140B1E;
  --foe:#7E1D42; --foe-2:#5A0F2E; --foe-pill:#D6437A; --foe-row:#E0678F;
  --ally:#2F3AA8; --ally-2:#1E2578; --ally-pill:#4E5AD8;
  --pick:#C7F03F; --cream:#FFF6E6; --dim:#C9A8B8; --faint:#8E7A92;
  --hp1:#9BE04A; --hp2:#DCF03C; --warn:#FFB03A; --sure:#5BE8C4; --bad:#FF6B7A;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:transparent;color:var(--cream);
  font-family:system-ui,-apple-system,"Roboto",sans-serif;font-size:11.5px;line-height:1.28;
  font-weight:600;overflow:hidden;display:flex}
::-webkit-scrollbar{width:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ── riel lateral: no roba alto, que es lo escaso en horizontal ── */
.rail{width:46px;flex:0 0 46px;display:flex;flex-direction:column;gap:3px;
  padding:6px 5px calc(6px + env(safe-area-inset-bottom)) 6px}
.rail .tab{flex:1;border-radius:12px;background:color-mix(in srgb,var(--ally-2) 90%,transparent);color:var(--cream);
  font-size:7.5px;font-weight:800;letter-spacing:.04em;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;min-height:0}
.rail .tab i{font-style:normal;font-size:13px;line-height:1}
.rail .tab[data-on="1"]{background:var(--pick);color:var(--ink)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:4px;padding:6px 8px 4px;flex:0 0 auto}
.mark{font-size:8px;font-weight:800;letter-spacing:.16em;color:var(--pick)}
.grow{flex:1}
.ico{width:25px;height:25px;border-radius:999px;background:color-mix(in srgb,var(--ally-2) 90%,transparent);
  color:var(--cream);font-size:12px;display:grid;place-items:center}
.ico:active{background:var(--pick);color:var(--ink)}
.ico[data-on="1"]{background:var(--pick);color:var(--ink)}

.body{flex:1;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
/* dos columnas: el ancho sobra en horizontal */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:start}

.card{border-radius:15px;padding:8px;border:1px solid rgba(255,255,255,.12);
  background:color-mix(in srgb,var(--ally) 92%,transparent);
  box-shadow:0 2px 10px rgba(0,0,0,.45)}
.card.f{background:color-mix(in srgb,var(--foe) 92%,transparent)}
.card.d{background:color-mix(in srgb,var(--ally-2) 92%,transparent)}
.hd{display:inline-block;background:var(--ally-pill);color:var(--cream);
  font-size:8px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  padding:3px 10px;border-radius:999px;margin-bottom:6px}
.card.f .hd{background:var(--foe-pill)}
.hd em{font-style:normal;opacity:.75;letter-spacing:.02em;text-transform:none;margin-left:4px}

.row{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);
  border-radius:999px;padding:5px 9px;margin-bottom:3px}
.row:nth-child(even){background:rgba(255,255,255,.05)}
.row:last-child{margin-bottom:0}
.row b{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row b s{display:block;text-decoration:none;font-size:8.5px;font-weight:600;color:var(--dim)}
.row u{text-decoration:none;font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.row u s{display:block;text-decoration:none;font-size:8.5px;font-weight:600;color:var(--dim);text-align:right}
.k{color:var(--warn)} .ok{color:var(--pick)} .no{color:var(--faint)}
.cf{color:var(--sure)} .bd{color:var(--bad)}

/* Interruptores "qué pasaría si" de velocidad (Previa) — pedido de Angel,
   2026-08-05: probar Pañuelo/Viento Afín/fases sin tocar el objeto o la
   habilidad real de ningún Pokémon. Viven en SPD_WHATIF, nunca en B/MY, así
   que save() nunca los persiste — son de esta pantalla, se pierden con un
   equipo nuevo a propósito. */
.wc{display:flex;gap:2px;align-items:center;flex:0 0 auto}
.wtog{width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.1);color:var(--dim);
  font-size:7px;font-weight:800;display:grid;place-items:center;line-height:1}
.wtog[data-on="1"]{background:var(--pick);color:var(--ink)}
.wstep{display:flex;align-items:center;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden}
.wstep button{width:14px;height:16px;font-size:8px;font-weight:800;color:var(--dim);line-height:1}
.wstep span{font-size:7px;font-weight:800;min-width:13px;text-align:center;color:var(--cream)}

/* Vista "Detallada" de velocidad (decisión #25, sprint 3.2) — eje horizontal
   compartido, los 6 propios como chips (uno por línea, sin repetir), franjas
   de densidad real por rival. Diseñada en 3 rondas de mockup con Angel antes
   de escribir esto. */
.spdseg{display:flex;gap:6px;margin-bottom:6px}
.spdseg button{flex:1;font-size:9px;font-weight:800;padding:5px 0;border-radius:999px;
  background:rgba(255,255,255,.08);color:var(--dim)}
.spdseg button[data-on="1"]{background:var(--pick);color:var(--ink)}
.spdaxis{position:relative;height:12px;margin:2px 6px 0}
.spdaxis span{position:absolute;top:0;font-size:8px;color:var(--faint);transform:translateX(-50%)}
.spdchips{position:relative;margin:0 6px}
.spdchip{position:absolute;transform:translateX(-50%);display:inline-flex;align-items:center;gap:1px;
  background:rgba(0,0,0,.3);border:1px solid color-mix(in srgb,var(--pick) 55%,transparent);
  border-radius:999px;padding:2px 4px;white-space:nowrap;font-size:8px;font-weight:800}
.spdchip b{color:var(--pick)}
.spdchip u{color:var(--cream);margin-left:3px}
.spdchip s{color:var(--sure);margin-left:3px;text-decoration:none}
.spdrow{display:flex;align-items:center;gap:6px;margin-top:5px}
.spdrow .nm{flex:0 0 30%;max-width:120px;font-weight:800;color:var(--foe-row);font-size:9.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spdrow .area{flex:1;position:relative;height:12px;background:rgba(0,0,0,.35);border-radius:4px;min-width:0}
.spdrow .seg{position:absolute;top:0;bottom:0;background:var(--foe-row);border-radius:4px}
.spdrow .spike{position:absolute;top:0;bottom:0;width:2px;background:var(--foe-row)}
.spdrow .megaband{position:absolute;top:1px;bottom:1px;border:1px dashed var(--sure);border-radius:4px}
.spdrow .dlab{font-size:7.5px;color:var(--dim);margin-top:1px;margin-left:calc(30% + 6px)}

.track{position:relative;height:5px;background:rgba(0,0,0,.42);border-radius:4px;
  overflow:hidden;margin-top:3px}
.track::after{content:"";position:absolute;top:0;bottom:0;right:0;width:2px;background:#fff;opacity:.55}
.tick{position:absolute;top:1px;bottom:1px;width:2px;border-radius:2px;background:var(--pick)}
.tick.x{background:var(--warn)}

/* ── barras de PS ── */
.hpbox{margin-bottom:6px}.hpbox:last-child{margin-bottom:0}
.hplab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.hplab b{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hplab u{text-decoration:none;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.hpwrap{position:relative;height:24px}
.hpbg{position:absolute;inset:0;background:rgba(0,0,0,.42);border-radius:999px;overflow:hidden}
.hpfill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;
  background:linear-gradient(90deg,var(--hp1),var(--hp2))}
.hpbox.low .hpfill{background:linear-gradient(90deg,#FF9A3C,#FFD03C)}
.hpbox.crit .hpfill{background:linear-gradient(90deg,#FF4A5E,#FF8A3C)}
.hpwrap input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;
  -webkit-appearance:none;appearance:none;background:none}
.hpwrap input::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px}
.knob{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;
  background:var(--cream);box-shadow:0 1px 4px rgba(0,0,0,.5);pointer-events:none}

/* ── etapas: stepper compacto ── */
.bo{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.bo b{width:30px;font-size:8.5px;font-weight:800;color:var(--dim)}
.bo .st{flex:1;display:flex;align-items:center;gap:3px}
.bo .st button{width:22px;height:22px;border-radius:999px;background:rgba(0,0,0,.30);
  font-size:13px;font-weight:800;line-height:1}
.bo .st button:active{background:var(--pick);color:var(--ink)}
.bo .st u{flex:1;text-decoration:none;text-align:center;font-size:11px;font-weight:800;
  font-variant-numeric:tabular-nums}
.bo .st u.up{color:var(--pick)} .bo .st u.dn{color:var(--bad)}

.pills{display:flex;flex-wrap:wrap;gap:3px}
.p{font-size:9px;font-weight:700;padding:5px 9px;border-radius:999px;
  background:rgba(0,0,0,.28);color:var(--cream)}
.p[data-on="1"]{background:var(--pick);color:var(--ink)}
.p em{font-style:normal;opacity:.65;margin-left:3px}

.team{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-bottom:6px}
.mon{background:var(--foe-2);border:2px solid transparent;border-radius:11px;padding:5px 2px;
  text-align:center;position:relative;min-width:0}
.mon[data-on="1"]{border-color:var(--pick)}
.mon[data-out="1"]{opacity:.32}
.mon b{display:block;font-size:8.5px;font-weight:800;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.mon s{display:block;text-decoration:none;font-size:8px;color:var(--dim);margin-top:1px}
.mon .fg{position:absolute;top:2px;right:3px;font-size:7px}

input[type=text]{width:100%;background:rgba(0,0,0,.30);color:var(--cream);border:none;
  border-radius:999px;padding:6px 10px;font-size:10.5px;font-family:inherit;font-weight:700}
/* Selector propio: un <select> nativo necesita foco de ventana para abrir su
   popup, y esta ventana es NOT_FOCUSABLE a proposito (si tuviera foco le
   robaria el teclado y el boton atras al juego). Por eso la lista se dibuja
   dentro del panel. */
.sel{display:flex;align-items:center;gap:4px;width:100%;background:rgba(0,0,0,.30);
  color:var(--cream);border-radius:999px;padding:6px 10px;font-size:10.5px;font-weight:700;
  text-align:left}
.sel b{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel i{font-style:normal;font-size:8px;opacity:.6}
.sel:active{background:var(--pick);color:var(--ink)}
.sheet{position:fixed;inset:0;background:rgba(6,4,12,.94);z-index:99;display:flex;
  flex-direction:column;padding:8px}
.sheet .sh{display:flex;align-items:center;gap:6px;padding:2px 4px 7px}
.sheet .sh b{flex:1;font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim)}
.sheet .list{flex:1;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:5px;
  align-content:start;padding-bottom:6px}
.sheet .op{display:flex;align-items:center;gap:6px;background:var(--ally-2);
  border:2px solid transparent;border-radius:11px;padding:8px 9px;min-height:38px;
  font-size:11px;font-weight:700;text-align:left;overflow:hidden}
/* min-width:0 en el hijo es lo que impide que los nombres largos empujen la
   celda y se pisen con la de al lado. */
.sheet .op n{flex:1;min-width:0;font-style:normal;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;line-height:1.15}
.sheet .op n em{display:block;font-style:normal;font-size:8.5px;font-weight:600;
  color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.sheet .op q{quotes:none;width:5px;align-self:stretch;border-radius:3px;flex:0 0 5px}
.sheet .op[data-on="1"]{background:var(--pick);color:var(--ink);border-color:var(--pick)}
.sheet .op[data-on="1"] n em{color:rgba(20,11,30,.65)}
.sheet .grp{grid-column:1/-1;font-size:8.5px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);padding:6px 4px 1px}
.abc{display:flex;flex-wrap:wrap;gap:2px;padding:0 2px 6px}
.abc button{min-width:20px;height:20px;border-radius:6px;background:rgba(0,0,0,.35);
  color:var(--dim);font-size:9px;font-weight:800}
.abc button:active{background:var(--pick);color:var(--ink)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
/* CALC (docs/calc.md): chips de selección rápida de los 12 de la partida —
   "todo lo que el HUD ya sabe, se toca, no se tipea". */
.qprow{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.qp{font-size:8px;font-weight:800;padding:3px 7px;border-radius:999px;
  background:rgba(255,255,255,.09);color:var(--dim)}
.qp[data-on="1"]{background:var(--pick);color:var(--ink)}
.cswap{width:22px;height:22px;border-radius:999px;background:rgba(255,255,255,.12);
  color:var(--cream);font-size:12px;float:right}
.cap{font-size:8px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim);margin:0 0 2px 4px}
.btn{width:100%;padding:9px;border-radius:999px;background:var(--ally-pill);
  font-size:10.5px;font-weight:800;color:var(--cream)}
.btn:active,.btn.g{background:var(--pick);color:var(--ink)}
.msg{font-size:9.5px;font-weight:600;color:var(--dim);line-height:1.4}
.msg.w{color:var(--warn)}
/* ── marca de confianza: símbolo + palabra, siempre las dos (decisión #24) ──
   Angel corrigió la propuesta original, que dejaba solo el símbolo: la marca
   sola se lee más rápido pero hay que aprenderla primero, y esto existe justo
   para el que todavía no la aprendió. Los niveles son los de `inference.md`
   §1, que el motor ya distingue desde el sprint 2.2 — acá solo se pintan. */
.cf3{display:inline-flex;align-items:center;gap:3px;font-size:7.5px;font-weight:800;
  letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;
  white-space:nowrap;vertical-align:middle}
.cf3 i{font-style:normal;font-size:8px;line-height:1}
.cf3.v{background:rgba(91,232,196,.16);color:var(--sure)}
.cf3.d{background:rgba(155,197,255,.16);color:#9BC5FF}
.cf3.p{background:rgba(255,255,255,.09);color:var(--faint)}
.cf3.q{background:rgba(255,255,255,.05);color:var(--faint);opacity:.8}
/* dentro de un título de tarjeta la marca no lleva fondo: el pill ya lo da */
.hd .cf3{background:none;padding:2px 0 2px 6px}
/* ── bloque técnico de error (decisión #24, temporal — ver future.md) ──
   El mensaje humano va arriba; esto es el detalle para diagnosticar. Se
   mantiene visible a propósito mientras el proyecto está en desarrollo. */
.dbg{margin-top:6px;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.10)}
.dbg b{display:block;font-size:7.5px;font-weight:800;letter-spacing:.11em;
  text-transform:uppercase;color:var(--warn);margin-bottom:3px}
.dbg code{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5px;
  font-weight:600;color:var(--dim);line-height:1.45;word-break:break-word;white-space:pre-wrap}

/* ── predicción ── */
.pl{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);
  border-radius:999px;padding:5px 9px;margin-bottom:3px}
.pl i{font-style:normal;width:34px;font-size:7.5px;font-weight:800;letter-spacing:.06em;
  color:var(--ink);background:var(--pick);border-radius:999px;text-align:center;padding:2px 0}
.pl i.b{background:rgba(0,0,0,.3);color:var(--dim)}
.pl b{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl b s{display:block;text-decoration:none;font-size:8.5px;font-weight:600;color:var(--dim)}
.pl u{text-decoration:none;font-size:10px;font-weight:800;font-variant-numeric:tabular-nums}
.note{display:flex;gap:5px;font-size:9.5px;color:var(--cream);padding:4px 0;line-height:1.35}
.note::before{content:"▸";color:var(--pick);font-weight:800}
.sp{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.sp b{width:32px;font-size:8.5px;font-weight:800;color:var(--dim)}
.sp .bar{position:relative;flex:1;height:19px}
.sp .bg{position:absolute;inset:0;background:rgba(0,0,0,.34);border-radius:999px;overflow:hidden}
.sp .fl{position:absolute;left:0;top:0;bottom:0;background:var(--ally-pill);border-radius:999px}
.sp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;
  -webkit-appearance:none;appearance:none}
.sp u{text-decoration:none;width:42px;text-align:right;font-size:10px;font-weight:800;
  font-variant-numeric:tabular-nums}
.hide{display:none}
</style>
</head>
<body>

<!-- Íconos: formas con significado, no adornos geométricos (decisión #24).
     ▲/▼ siguen la convención del propio juego — el rival arriba, vos abajo —
     así que se aprenden solas y ya no son dos rombos casi iguales como antes.
     "MÍO" pasó a "TUYO": el HUD te habla de vos ("marcá", "tu equipo"), así
     que la pestaña se nombra desde su voz, no desde la del jugador.
     Unicode a propósito por ahora: liviano y sin problema de licencia — el
     set propio con revisión legal está anotado en `future.md`. -->
<nav class="rail">
  <button class="tab" data-tab="pre"><i>⚑</i>PREVIA</button>
  <button class="tab" data-tab="field" data-on="1"><i>⬢</i>CAMPO</button>
  <button class="tab" data-tab="foe"><i>▲</i>RIVAL</button>
  <button class="tab" data-tab="mine"><i>▼</i>TUYO</button>
  <button class="tab" data-tab="calc"><i>÷</i>CALC</button>
  <button class="tab" data-tab="set"><i>⚙</i></button>
</nav>

<div class="main">
  <div class="top">
    <div class="mark">HUD/CHAMPIONS</div>
    <div class="grow"></div>
    <button class="ico" id="bZip">◱</button>
    <button class="ico" id="bTurn" title="Siguiente turno">▸</button>
    <button class="ico" id="bPin">⇱</button>
    <button class="ico" id="bScan">↻</button>
    <button class="ico" id="bShut">×</button>
  </div>
  <div class="body" id="body"></div>
</div>

<script>
"use strict";
/* ═════ REGLAS DE CHAMPIONS ═════
   Sin IVs: todos cuentan como 31. Los EVs son Reparto de puntos: 66 en total, tope 32
   por stat, 1 SP = +1 punto de stat a nivel 50, sumado ANTES de la alineación.
   Verificado contra la pantalla de stats del juego: Gholdengo AtqEsp base 133
   con 32 SP y alineación que sube da 203 = floor((153+32)*1.1). Si fuera después
   daría 200. Confirmado con 10 stats de 6 Pokémon distintos. */
const LVL=50, IV=31, SP_MAX=32, SP_POOL=66, SP_AFTER_NAT=false;
const STN=["PS","Atq","Def","AtqEsp","DefEsp","Vel"];
const BON=["Atq","Def","AtqEsp","DefEsp","Vel"];   // etapas: sin PS

const hpOf=(b,sp)=>Math.floor((2*b+IV)*LVL/100)+LVL+10+sp;
const stOf=(b,sp,nat)=>SP_AFTER_NAT
  ? Math.floor((Math.floor((2*b+IV)*LVL/100)+5)*nat)+sp
  : Math.floor((Math.floor((2*b+IV)*LVL/100)+5+sp)*nat);
/** up/dn son índices de stat (1–5; la naturaleza nunca toca PS). **0 = sin
    naturaleza**: se usa cuando de verdad no la sabemos — por ejemplo cuando
    la captura no pudo determinarla, ya que el juego la indica con flechas de
    color y no con texto. Neutro (×1) es el estimador honesto en ese caso;
    inventar una naturaleza sesga todos los cálculos en silencio. */
const natMul=(i,up,dn)=> (up&&i===up)?1.1 : (dn&&i===dn)?0.9 : 1;

/* ═════ DATOS BASE ═════ */
/* Colores por tipo. decoMove() y decoItem() dependen de esto: sin el mapa
   lanzaban ReferenceError, el render moría antes de enganchar los eventos y la
   interfaz entera quedaba congelada al abrir cualquier selector. */

const stg=(s,crit,side)=>{
  if(crit&&((side>0&&s<0)||(side<0&&s>0)))s=0;
  return s>=0?(2+s)/2:2/(2-s);
};
function calc(o){
  const A=S(o.atk),D=S(o.def),m=mv(o.move);
  if(!A||!D||!m)return null;
  const phys=m.c==="F";
  // etapas por stat: física usa Atq/Def, especial usa AtqEsp/DefEsp
  const aB=(o.aBo||[0,0,0,0,0])[phys?0:2];
  const dB=(o.dBo||[0,0,0,0,0])[phys?1:3];
  const aRaw=o.aStat?(phys?o.aStat[1]:o.aStat[3])
    :stOf(phys?A.s[1]:A.s[3],o.aSP??SP_MAX,o.aNat??1.1);
  const dRaw=o.dStat?(phys?o.dStat[2]:o.dStat[4])
    :stOf(phys?D.s[2]:D.s[4],o.dSP??0,o.dNat??1);
  let a=aRaw*stg(aB,o.crit,1);
  let d=dRaw*stg(dB,o.crit,-1);
  if(o.dAb==="marvelscale"&&!phys)d*=1.5;
  // Champions no tiene Cinta ni Anteojos Elección: los multiplicadores de
  // objeto son más chicos y van todos en post.
  const maxHP=o.dStat?o.dStat[0]:hpOf(D.s[0],o.dHP??0);
  let base=Math.floor(Math.floor(Math.floor(22*m.p*a/d)/50)+2);
  let pre=1;
  if(o.doubles&&m.sp)pre*=.75;
  if(o.weather==="sol")pre*= m.t==="FIR"?1.5:m.t==="WAT"?.5:1;
  if(o.weather==="lluvia")pre*= m.t==="WAT"?1.5:m.t==="FIR"?.5:1;
  if(o.crit)pre*=1.5;
  // ── habilidades del atacante ──
  let mType=m.t;
  if(o.aAb==="pixilate"&&mType==="NOR")mType="FAI";
  const stab=A.t.includes(mType)?(o.aAb==="adaptability"?2:1.5)
    :(o.aAb==="pixilate"&&m.t==="NOR"?1.2:1);
  let e=EFF(mType,D.t);
  // ── inmunidades por habilidad del defensor ──
  if(o.dAb==="levitate"&&mType==="GRO")e=0;
  if(o.dAb==="flashfire"&&mType==="FIR")e=0;
  if(o.dAb==="marvelscale"&&!phys)e=e;   // sube DefEsp: se refleja abajo
  if(o.dAb==="waterabsorb"&&mType==="WAT")e=0;
  if((o.dAb==="lightningrod"||o.dAb==="motordrive")&&mType==="ELE")e=0;
  let post=1;
  if(o.screen&&!o.crit)post*= o.doubles?(2/3):.5;
  // objetos del atacante
  if(o.aItem==="Vidasfera")post*=1.3;
  if(o.aItem==="Cinta Fuerte"&&phys)post*=1.1;
  if(o.aItem==="Lentes Especiales"&&!phys)post*=1.1;
  if(o.aItem==="Cinturón de Experto"&&e>1)post*=1.2;
  if(TYPE_ITEM[o.aItem]===mType)post*=1.2;
  // objetos del defensor
  if(RES_BERRY[o.dItem]===mType&&e>1)post*=.5;
  if(o.aSta==="quemado"&&phys&&o.aAb!=="guts")post*=.5;   // la quemadura baja SOLO el daño físico
  // atacante
  if(o.aAb==="solarpower"&&!phys&&o.weather==="sol")post*=1.5;
  if(o.aAb==="waterbubble"&&mType==="WAT")post*=2;
  if(o.aAb==="guts"&&phys&&o.aSta&&o.aSta!=="—")post*=1.5;
  // habilidades de apuro: se activan por debajo de un tercio de PS
  const pinch={torrent:"WAT",blaze:"FIR",overgrow:"GRA",swarm:"BUG"}[o.aAb];
  if(pinch&&mType===pinch&&(o.aHp??100)<=33)post*=1.5;
  // defensor
  if(o.dAb==="multiscale"&&(o.dHp??100)>=100)post*=.5;
  if((o.dAb==="filter"||o.dAb==="solidrock"||o.dAb==="prismarmor")&&e>1)post*=.75;
  const fly=D.t.includes("FLY");
  if(o.terrain==="eléctrico"&&m.t==="ELE"&&!fly)post*=1.3;
  if(o.terrain==="psíquico"&&m.t==="PSY"&&!fly)post*=1.3;
  if(o.terrain==="hierba"&&m.t==="GRA"&&!fly)post*=1.3;
  if(o.terrain==="hierba"&&m.t==="GRO"&&m.sp)post*=.5;
  /* audit.md §7 punto 8: el código tenía `if(o.dAb==="sturdy"&&e>1)post*=.75`
     acá — una reducción de daño del 25% que no es ningún efecto real de
     Robustez (esa cifra es la de Filtro/Roca Sólida/Coraza Prisma, arriba).
     Robustez real no reduce daño: a PS llenos, sobrevive con 1 PS cualquier
     golpe que la dejaría en 0 (ver ABIL_DESC.sturdy). Se modela acá, no
     arriba con el resto de habilidades del defensor, porque no es un
     multiplicador sobre el daño — es un tope sobre el resultado final,
     aplicado después de calcular cada tirada. */
  const sturdyFull=o.dAb==="sturdy"&&(o.dHp??100)>=100;
  const R=[];
  for(let r=85;r<=100;r++){
    let x=Math.floor(base*pre);x=Math.floor(x*r/100);
    x=Math.floor(x*stab);x=Math.floor(x*e);
    let dmg=Math.max(e>0?1:0,Math.floor(x*post));
    if(sturdyFull)dmg=Math.min(dmg,maxHP-1);
    R.push(dmg);
  }
  return {R,maxHP,e,move:o.move};
}
/** Mejor golpe del atacante contra el defensor, dentro de `pool`.
    `pool` sin definir = "cualquier movimiento del juego" (consulta explícita,
    la usa la calculadora libre). `pool` como lista vacía = "no sabemos qué
    movimientos tiene" y devuelve null — NO cae a la lista global.
    Esa caída silenciosa era un bug real: sin datos del rival, la amenaza que
    se mostraba era el movimiento más fuerte del juego entero (Electro Shot en
    todos los rivales por igual, incluso en especies que no lo aprenden). */
function best(atk,def,ctx,pool){
  if(pool&&!pool.length)return null;
  let win=null;
  for(const k of (pool?pool.filter(x=>MV[x]&&MV[x][2]!=='E'&&MV[x][0]>0):DMG)){
    const r=calc({...ctx,atk,def,move:k});
    if(r&&(!win||r.R[15]>win.R[15]))win=r;
  }
  return win;
}
const verdict=(r,cur)=>{
  if(!r)return{txt:"—",cls:"no",pct:""};
  if(r.e===0)return{txt:"Inmune",cls:"no",pct:"×0"};
  const hp=cur??r.maxHP, ko=r.R.filter(x=>x>=hp).length;
  return {txt: ko===16?"KO":ko?`${Math.round(ko/16*100)}%`:`${Math.ceil(hp/r.R[15])}HKO`,
    cls: ko?"k":"ok",
    pct:`${Math.round(r.R[0]/r.maxHP*100)}–${Math.round(r.R[15]/r.maxHP*100)}% ×${r.e}`, ko};
};
/** "Duplicar cálculo" (calc.md §5, pedido de Angel 2026-08-11): una foto
    congelada de un resultado de CALC, para comparar variantes ("¿con Vida
    Sana o con Pañuelo?") sin perder el cálculo anterior. Angel especificó
    "temporal, no como los equipos" — vive en `CALC_HISTORY` (declarado
    junto a `vCalc()`, nunca en `B`/`MY`, nunca tocado por `save()`), así

    vez de guardar la configuración para recalcular después: es una FOTO
    del resultado en ese momento, no un cálculo vivo que se siga moviendo
    si cambia el campo mientras se lo compara. */
function calcSnapshot(atk,def,move,r,cur){
  return {id:Date.now()+Math.random(), atk, def, move, v:verdict(r,cur)};
}

/* ═════ INFERENCIA ═════ */
function spdRange(f){
  const sp=S(f.dex); if(!sp)return{min:0,max:0,rawMax:0};
  const raw={min:stOf(sp.s[5],0,0.9),max:stOf(sp.s[5],SP_MAX,1.1)};
  const mul=f.item==="Pañuelo Elección"?1.5:1;
  return {min:Math.max(f.spdMin||0,Math.floor(raw.min*mul)),
          max:Math.min(f.spdMax||9999,Math.floor(raw.max*mul)), rawMax:raw.max};
}
/** Habilidades que duplican Velocidad bajo su clima — mecánica real del
    juego, no una tabla inventada. `sol`/`lluvia` son los únicos climas que
    hoy tiene un botón en CAMPO (`vChips()`); arena/granizo quedan en la
    tabla igual, listas para el día que se agreguen esos chips, sin que haga
    falta tocar esta función de nuevo. */
const WEATHER_SPD_ABIL={swiftswim:"lluvia",chlorophyll:"sol",sandrush:"arena",slushrush:"granizo"};
/** Velocidad efectiva: la habilidad bajo su clima duplica, Tailwind duplica
    de nuevo, la parálisis parte al medio.
    `abil` es opcional a propósito (pedido de Angel, 2026-08-05): del lado
    propio siempre se sabe (es tu equipo), pero del rival solo se pasa cuando
    ya está CONFIRMADA (`f.abil`, visto) — mostrar el doble sin esa
    confirmación sería inventar una certeza que no hay, mismo criterio que el
    resto del sistema de confianza (decisión #24). */
const effSpd=(v,side,sta,abil)=>{
  let x=v;
  if(abil&&WEATHER_SPD_ABIL[abil]===B.weather)x=Math.floor(x*2);
  if(B.tw[side]>0)x=Math.floor(x*2);
  if(sta==="paralizado")x=Math.floor(x*.5);
  if(B.tr>0)x=-x;                      // en Espacio Raro el orden se invierte
  return x;
};
const shown=v=>Math.abs(v);
function observeOrder(f,myEff,faster){
  const twMul=B.tw.them>0?2:1;
  const need=Math.ceil(Math.abs(myEff)/twMul);
  if(faster) f.spdMin=Math.max(f.spdMin||0,need+1);
  else       f.spdMax=Math.min(f.spdMax||9999,Math.max(1,need-1));
  const r=spdRange(f);
  if(!f.item&&f.spdMin>r.rawMax){f.item="Pañuelo Elección";f.itemSure=true}
  if(f.spdMin>=stOf(S(f.dex).s[5],SP_MAX,1.1))f.spdSure=true;
}
function solveBulk(atk,def,move,obsPct,ctx){
  const out=[],tol=3.2;
  for(let hp=0;hp<=SP_MAX;hp+=2)for(let df=0;df<=SP_MAX;df+=2){
    if(hp+df>SP_POOL)continue;
    for(const nat of [0.9,1,1.1]){
      const r=calc({...ctx,atk,def,move,dHP:hp,dSP:df,dNat:nat});
      if(!r)continue;
      const lo=r.R[0]/r.maxHP*100, hi=r.R[15]/r.maxHP*100;
      if(obsPct>=lo-tol&&obsPct<=hi+tol)out.push({hp,df});
    }
  }
  if(!out.length)return{ok:false};
  return {ok:true,n:out.length,
    hp:[Math.min(...out.map(o=>o.hp)),Math.max(...out.map(o=>o.hp))],
    df:[Math.min(...out.map(o=>o.df)),Math.max(...out.map(o=>o.df))]};
}

   Si no existe, la app sigue andando con las tablas embebidas.
   Va antes que PREDICCIÓN porque PREDICCIÓN usa learnable(), definida acá
   (audit.md §5.4 — el orden de lectura ahora coincide con el de dependencia). */
let DEX=null, LEARN=null;
/** Habilidad REAL de cada forma mega (bug real, 2026-08-05, mismo patrón que
    el de Kingambit/910 de la vuelta anterior: un número curado a mano sin
    sincronizar con la fuente real). `SPD`/`MEGA` usan números fijos para las
    megas clásicas (901261 para Mega Swampert, por ejemplo — ver audit.md
    §5.11) para no chocar con los que genera `loadDex()`, pero esos números
    nunca tuvieron su propia entrada en `ABIL`: `abilsOf()` caía al fallback
    "especie base" (Swampert: Damp/Torrent) y la habilidad real de la mega
    (Nado Rápido) no aparecía como opción elegible en ningún lado — Angel no
    podía marcarla ni aunque quisiera.
    Se resuelve por NOMBRE contra dex.json (mismo criterio que build_meta.py
    ya usa: nunca por coincidencia numérica) — Showdown nombra la forma
    "<base>mega"/"megax"/"megay", patrón verificado contra las 80 megas
    reales que trae dex.json hoy. Función aparte (no inline en loadDex()) para
    poder testearla sin necesitar el puente de Android. */
function applyMegaAbilities(d){
  for(const item in MEGA){
    const [megaKey,baseDex]=MEGA[item];
    const baseName=SPD[baseDex]&&SPD[baseDex][0]; if(!baseName)continue;
    const suf=/ X$/.test(item)?"megax":/ Y$/.test(item)?"megay":"mega";
    const sp=d.species[slugify(baseName)+suf];
    if(sp&&sp.a&&sp.a.length)ABIL[megaKey]=sp.a.map(slugify);
  }
}
function loadDex(){
  if(!has)return false;
  const raw=IO.loadDex();
  if(!raw||raw.length<100)return false;
  let d; try{d=JSON.parse(raw)}catch(e){return false}
  if(!d.species||!d.moves)return false;

  // especies: clave numérica igual que antes, para no romper nada
  const byNum={};
  for(const k in d.species){
    const sp=d.species[k];
    // la forma base gana el número limpio; las alternativas van a 9xxxxx
    const key = byNum[sp.num] ? 900000+sp.num*10+(Object.keys(byNum).length%10) : sp.num;
    byNum[key]=1;
    SPD[key]=[sp.n,...sp.s,...sp.t];
    ABIL[key]=sp.a.length?sp.a.map(slugify):["—"];
    SLUG[key]=k;
  }
  applyMegaAbilities(d);
  // movimientos
  for(const k in d.moves){
    const m=d.moves[k];
    MV[m.n]=[m.p,m.t,m.c,m.r,m.pr,m.ac,m.d,m.n,m.pp||0];
    MVKEY[k]=m.n;
  }
  LEARN=d.learnsets; DEX=d;
  return true;
}
const SLUG={}, MVKEY={};
/** Movimientos que ESTA especie puede aprender. Vacío = no sabemos, mostrar todos. */
function learnable(dex){
  if(!LEARN)return null;
  const k=SLUG[dex]; if(!k||!LEARN[k])return null;
  const out=LEARN[k].map(x=>MVKEY[x]).filter(x=>x&&MV[x]);
  return out.length?out:null;
}

/* ═════ PREDICCIÓN DE TEAM PREVIEW ═════
   Razona como se razona en la previa: primero los ejes de partida (control de
   velocidad, clima, megas), después el intercambio de daño. */
function rolesFoe(f){
  const m=metaOf(f.dex),R=new Set();
  (m?.moves||[]).forEach(([k])=>{const r=roleOfMove(k); if(r)R.add(r)});
  if(f.abil){ if(ROLE_AB[f.abil])R.add(ROLE_AB[f.abil]) }
  else (m?.abilities||[]).forEach(([k])=>{if(ROLE_AB[k])R.add(ROLE_AB[k])});
  if((m?.items||[]).some(([i])=>isMega(i)))R.add("mega");
  return R;
}
function rolesMine(m){
  const R=new Set();
  (m.moves||[]).forEach(k=>{const r=roleOfMove(k); if(r)R.add(r)});
  if(isMega(m.item))R.add("mega");
  return R;
}
const roleScore=R=>{
  let s=0;
  if(R.has("tailwind")||R.has("trickroom"))s+=26;
  if(R.has("sol")||R.has("lluvia")||R.has("arena"))s+=20;
  if(R.has("intimida"))s+=12;
  if(R.has("prioridad"))s+=12;
  if(R.has("pantallas"))s+=10;
  if(R.has("estado"))s+=9;
  if(R.has("bromista"))s+=8;
  return s;
};

/* ── Predicción de team preview con datos reales (Fase 2, sprint 2.8) ──
   Reemplaza el puntaje ajustado a mano de `predict()` (`off*.40 + def*.26 +
   role*.22 + use*1.2`, cuatro pesos sin evidencia citable por número — el
   error que `future.md` ya había marcado y Angel confirmó en uso real).
   Acá NINGÚN número sale de una ponderación inventada: cada uno se puede
   señalar contra un campo concreto de `meta.json`, y `whyBring()` lo dice
   con la cita puesta.
   Describe al RIVAL, no elige nada propio — misma categoría que
   `topThreats()`, sin conflicto con `decisions.md` #19/#21. */
/** Los cores (pares que de verdad aparecieron juntos en equipos de torneo)
    que vinculan a dos de las especies que estamos viendo. No es "parecidos"
    ni "sinergia" estimada: es un conteo real sobre `sourceCounts.teams`. */
function coresAmong(dexList){
  const set=new Set(dexList);
  return (META.cores||[]).filter(c=>set.has(c.pair[0])&&set.has(c.pair[1])&&c.pair[0]!==c.pair[1]);
}
/** Los 6 del rival, ordenados por qué tan atado está cada uno a la estructura
    de ESTE equipo en particular.
    `support` = suma de los % de core que lo unen con otro de los 6. Es una
    medida de centralidad estructural, no una probabilidad — por eso se
    muestra siempre con sus componentes al lado (`linked`), nunca como un
    número suelto que habría que creer.
    Desempates, en orden: cuántos de los otros 5 aparecen entre sus
    compañeros frecuentes según Champions Battle Data (`cbdTeammates`, sin %
    porque la fuente no lo publica — mismo cuidado del sprint 2.7: no se
    inventa un porcentaje que no existe), y después el uso general.
    **No se parte en "leads" y "back"**: ninguna fuente relevada publica
    quién lideró, y dividir 4 en 2+2 sin ese dato sería exactamente la
    invención que el proyecto no se permite (el `predict()` viejo lo hacía).
    El daño tampoco entra acá — "quién te pega más fuerte" ya lo contesta
    `topThreats()` con su propio cálculo; meterlo en este orden sería
    duplicarlo y volver a mezclar unidades distintas en un solo puntaje. */
function foeBringOrder(){
  const foes=B.team.filter(f=>f.dex&&S(f.dex));
  if(!foes.length)return [];
  const cores=coresAmong(foes.map(f=>f.dex));
  return foes.map(f=>{
    const linked=cores.filter(c=>c.pair.includes(f.dex))
      .map(c=>({dex:c.pair.find(d=>d!==f.dex),pct:c.pct,count:c.count}))
      .sort((a,b)=>b.pct-a.pct);
    const m=metaOf(f.dex);
    const others=new Set(foes.filter(x=>x!==f).map(x=>x.dex));
    const cbdLinks=(m?.cbdTeammates||[]).filter(d=>others.has(d));
    return {f,linked,cbdLinks,
      support:Math.round(linked.reduce((s,x)=>s+x.pct,0)*10)/10,
      usage:m?.usage??null, role:m?.roleInCore||null,
      speedCtl:m?.speedControlMajority||null};
  }).sort((a,b)=> b.support-a.support
    || b.cbdLinks.length-a.cbdLinks.length
    || (b.usage??0)-(a.usage??0));
}
/** Matriz de matchup para Previa (sprint 2.9). Reemplaza al "Sacá vos"
    viejo (ranking LEAD/BACK por puntaje), que elegía la jugada por el
    jugador — `decisions.md` #21 lo prohíbe sin excepción, sin importar qué
    tan buenos sean los datos detrás del puntaje. Angel eligió esta salida
    (2026-08-04) entre tres opciones: sacar el panel, convertirlo en matriz
    descriptiva, o abrir un ADR nuevo que ampliara #21.
    Por cada uno de tus 6, qué le hacés y qué te hace cada uno de los 4
    rivales más probables (`foeBringOrder()`, sprint 2.8) — mismo cálculo
    que ya usa la "Matriz de daño" de Campo (`best()`+`verdict()` par a par),
    sin boosts ni estado porque en team preview todavía no existen.
    Filas y columnas van en el orden en que ya vienen (equipo propio tal
    cual está cargado; rivales por `foeBringOrder()`) — nunca reordenadas
    por qué tan bueno es el matchup, para que no se cuele un "el mejor
    primero" disfrazado de tabla. */
function previewMatrix(){
  const mine=MY.filter(m=>m.dex&&S(m.dex));
  const foes=foeBringOrder().slice(0,4).map(x=>x.f);
  if(!mine.length||!foes.length)return null;
  return {mine,foes};
}
/** "¿Por qué me mostrás esto?" contestado con la cita concreta, no con un
    puntaje. Cuando no hay ningún dato real que citar lo dice con todas las
    letras en vez de devolver vacío: un texto en blanco deja al que llama
    mostrando nada, que es justo la degradación silenciosa que `vision.md`
    prohíbe. "No sabemos" es una respuesta válida; "" no.
    Devuelve texto PLANO — quien lo interpole en HTML lo pasa por `esc()`,
    misma convención que el resto del archivo (escapar en el punto de uso,
    no adentro del que genera el dato). */
function whyBring(x){
  const n=META.sourceCounts?.teams;
  if(x.linked.length){
    const t=x.linked.slice(0,2).map(l=>`${nm(l.dex)} (${l.pct}%${
      n?`, ${l.count} de ${n}`:""})`).join(" y ");
    return `Suele ir con ${t}`;
  }
  if(x.cbdLinks.length)
    return `Suele acompañar a ${x.cbdLinks.slice(0,2).map(d=>nm(d)).join(" y ")}, sin porcentaje medido`;
  if(x.usage!=null)
    return `No suele ir con el resto de su equipo · ${x.usage}% de uso general`;
  return "Sin datos de esta especie";
}
/** Pedido de Angel (2026-08-06): "Probable que traiga" solo decía CON QUIÉN
    suele ir cada rival, no CON QUÉ — para eso había que ir a Rival y abrir
    "Repartos habituales" aparte. Con team preview recién leído, antes de
    marcar nada, esto ya está disponible: `metaOf(dex).moves` es el mismo uso
    real por movimiento que ya cita "Repartos habituales" (sprint 2.7), solo
    que acá se muestra junto a la predicción de quién entra, en vez de tener
    que cambiar de pestaña para verlo. No es información nueva — es la misma
    evidencia, puesta donde hace falta para decidir. */
function probableMoves(dex,n){
  const raw=metaOf(dex)?.moves||[];
  const mv=raw.map(x=>({k:findMove(x[0]),pct:x[1]})).filter(x=>x.k);
  if(!mv.length)return null;
  return mv.sort((a,b)=>b.pct-a.pct).slice(0,n||4);
}

function predict(){
  const foes=B.team.filter(f=>f.dex&&S(f.dex));
  const mine=MY.filter(m=>m.dex&&S(m.dex));
  if(foes.length<2||mine.length<2)return null;

  const fR=foes.map(rolesFoe), mR=mine.map(rolesMine);
  const notes=[];
  const ctx={doubles:B.doubles};

  // ── ejes de partida ──
  const fTR=fR.filter(r=>r.has("trickroom")).length;
  const fTW=fR.filter(r=>r.has("tailwind")).length;
  const mTR=mR.filter(r=>r.has("trickroom")).length;
  const mTW=mR.filter(r=>r.has("tailwind")).length;
  // Estas notas describen la posición; ninguna dice qué hacer (`decisions.md`
  // #21). Varias estaban escritas como imperativos ("no lo traigas",
  // "traelo", "es tu mejor eje") desde antes de que #21 existiera — se
  // reescribieron en el sprint 2.9 conservando la misma información.
  if(fTR>=2)notes.push("Trae "+fTR+" opciones de Espacio Raro: es su plan A. Tu Tailwind pierde casi todo el valor.");
  else if(fTR===1)notes.push("Tiene una opción de Espacio Raro: mientras esté en el equipo, el orden de velocidad puede darse vuelta un turno.");
  if(fTW>=1&&fTR===0)notes.push("Va por Tailwind. La carrera de velocidad se define en los dos primeros turnos.");
  if(mTW>0&&fTR>=2)notes.push("Con Espacio Raro del otro lado, tu Tailwind acelera en contra: los dos efectos se pisan.");
  if(mTR>0&&fTW>0)notes.push("Tu Espacio Raro invierte justo el orden que su Tailwind busca: los dos ejes se anulan entre sí.");

  const weather=fR.map((r,i)=>["sol","lluvia","arena"].find(w=>r.has(w))?foes[i]:null).filter(Boolean);
  if(weather.length)notes.push("Clima propio con "+weather.map(f=>nm(f.dex)).join(" y ")+": lo va a querer instalar sí o sí.");

  const megas=foes.filter((f,i)=>fR[i].has("mega"));
  if(megas.length>1)notes.push(megas.length+" megas ("+megas.map(f=>nm(f.dex)).join(", ")+") pero solo puede megaevolucionar una: entre todas ocupan un solo cupo de mega, no "+megas.length+".");

  // Bromista vs Siniestro: el estado de prioridad no pasa
  const myPrank=mine.filter((m,i)=>mR[i].has("bromista"));
  const foeDark=foes.filter(f=>S(f.dex).t.includes("DAR"));
  if(myPrank.length&&foeDark.length)
    notes.push("Tiene "+foeDark.map(f=>nm(f.dex)).join(" y ")+" tipo siniestro: los movimientos de estado de tu Bromista no le entran.");
  const foePrank=foes.filter((f,i)=>fR[i].has("bromista"));
  const myDark=mine.filter(m=>S(m.dex).t.includes("DAR"));
  if(foePrank.length&&myDark.length)
    notes.push("Su "+foePrank.map(f=>nm(f.dex)).join(" y ")+" usa Bromista: tus tipo siniestro son inmunes a ese estado con prioridad.");

  // ── puntaje de cada rival ──
  const sc=foes.map((f,i)=>{
    const pool=foeMoves(f);
    let off=0,def=100;
    for(const m of mine){
      const st=statsOf(m);
      const r=best(f.dex,myDex(m),{...ctx,aItem:f.item,aAb:f.abil,dStat:st,dAb:m.abil},pool);
      if(r)off=Math.max(off,r.R[15]/r.maxHP*100);
      const back=best(myDex(m),f.dex,{...ctx,aStat:st,aItem:m.item==="—"?null:m.item,aAb:m.abil,dHP:0,dSP:0},myMoves(m));
      if(back)def=Math.min(def,100-Math.min(100,back.R[15]/back.maxHP*100));
    }
    const use=metaOf(f.dex)?.usage||1;
    return {f,i,off:Math.min(off,150),def,role:roleScore(fR[i]),use,
      score:Math.min(off,150)*.40 + def*.26 + roleScore(fR[i])*.22 + use*1.2};
  });
  // una sola mega ocupa cupo
  let megaSeen=false;
  sc.sort((a,b)=>b.score-a.score).forEach(x=>{
    if(fR[x.i].has("mega")){ if(megaSeen)x.score*=.45; megaSeen=true }
  });
  sc.sort((a,b)=>b.score-a.score);
  const theirs=sc.slice(0,4);
  // sus leads: quien define el turno 1 (velocidad, clima, presión)
  const theirLeads=[...theirs].sort((a,b)=>(b.role+b.off*.35)-(a.role+a.off*.35)).slice(0,2);
  const theirBack=theirs.filter(x=>!theirLeads.includes(x));

  // ── tu recomendación contra esos 4 ──
  const my=mine.map((m,i)=>{
    const st=statsOf(m),pool=myMoves(m);
    let off=0,surv=100;
    for(const t of theirs){
      const r=best(myDex(m),t.f.dex,{...ctx,aStat:st,aItem:m.item==="—"?null:m.item,aAb:m.abil,dHP:0,dSP:0},pool);
      if(r)off=Math.max(off,r.R[15]/r.maxHP*100);
      const inc=best(t.f.dex,myDex(m),{...ctx,aItem:t.f.item,aAb:t.f.abil,dStat:st,dAb:m.abil},foeMoves(t.f));
      if(inc)surv=Math.min(surv,100-Math.min(100,inc.R[15]/inc.maxHP*100));
    }
    let role=roleScore(mR[i]);
    if(fTR>=2&&mR[i].has("tailwind"))role-=24;      // Tailwind muere contra hard TR
    if(fTW>=1&&mR[i].has("trickroom"))role+=14;
    return {m,i,off:Math.min(off,150),surv,role,
      score:Math.min(off,150)*.42 + surv*.26 + role*.22};
  });
  my.sort((a,b)=>b.score-a.score);
  const bring=my.slice(0,4);
  const leads=[...bring].sort((a,b)=>(b.role+b.off*.4+b.surv*.2)-(a.role+a.off*.4+a.surv*.2)).slice(0,2);
  const back=bring.filter(x=>!leads.includes(x));

  return {theirLeads,theirBack,leads,back,notes};
}

/* ═════ RECOMENDADOR DE MOVIMIENTO ═════
   Evalúa cada movimiento tuyo contra cada objetivo y explica el porqué.
   La explicación importa más que el número: la idea es que aprendas a leer la
   posición, no que obedezcas una flecha. */
/* Devuelve el resultado calculado de cada movimiento propio contra cada
   rival en campo — información (daño, KO o no), nunca una jerarquía: no se
   ordena ni se recorta por puntaje, y no hay ningún "mejor". Cada entrada
   lleva `slot`, la posición real del movimiento en el set, para poder
   mostrar un identificador neutral en vez de un ranking (decisions.md #19,
   matiza la #1: mostrar el resultado no es recomendar, elegir por vos sí). */
function suggest(mi,ai,mine,foes){
  const m=MY[mi],st=statsOf(m),am=B.act["m"+ai]||actNew();
  const pool=myMoves(m); if(!pool.length)return [];
  const out=[];
  pool.forEach((k,slot)=>{
    const M=mv(k); if(!M)return;
    // ── movimientos de estado: valor situacional, no daño ──
    if(M.c==="E"){
      let v=0,why="";
      if(k==="Protección"){v=34;why="scoutea el turno; no lo repitas dos veces seguidas"}
      else if(k==="Viento Afín"){v=B.tw.me>0?4:(B.tr>0?8:78);
        why=B.tw.me>0?"ya está activo":B.tr>0?"no sirve con Espacio Raro":"das vuelta la carrera de velocidad"}
      else if(k==="Espacio Raro"){v=B.tr>0?4:(myStat(m,5)<90?76:30);
        why=B.tr>0?"ya está activo":myStat(m,5)<90?"tu equipo es lento: es tu eje":"tu Pokémon es rápido, te perjudica"}
      else if(k==="Reflejo"||k==="Pantalla de Luz"){v=B.screen.me>0?5:58;
        why=B.screen.me>0?"ya tenés pantalla":"reduce el daño 4 turnos"}
      else if(/Espora|Onda Trueno|Paralizador|Bostezo/.test(k)){v=62;why="saca del turno a una amenaza sin gastar PS"}
      else if(/Rage Powder|Follow Me/.test(k)){v=56;why="protegés a tu compañero absorbiendo los ataques"}
      else if(k==="Wide Guard"){v=44;why="anula ataques de área"}
      else if(k==="Danza Espada"||k==="Danza Aleteo"){v=40;why="ganás potencia si aguantás el turno"}
      else if(k==="Rugido de Guerra"){v=52;why="baja el Ataque de los dos rivales"}
      else{v=30;why=M.note||"movimiento de apoyo"}
      out.push({k,slot,v,why,tgt:"",dmg:null});
      return;
    }
    // ── movimientos de daño: contra cada rival en campo ──
    for(const [di,fi] of foes.entries()){
      const f=B.team[fi],df=B.act["f"+di]||actNew();
      const r=calc({...ctxFor("me"),atk:myDex(m),def:f.dex,move:k,aStat:st,
        aItem:m.item==="—"?null:m.item,aAb:m.abil,aHp:B.hp["m"+ai]??100,aBo:am.bo,aSta:am.sta,
        dHP:0,dSP:0,dItem:f.item,dAb:f.abil,dBo:df.bo});
      if(!r||r.e===0)continue;
      const cur=Math.floor(r.maxHP*(B.hp["f"+di]??100)/100);
      const kos=r.R.filter(x=>x>=cur).length;
      const pct=r.R[15]/cur*100;
      let v=Math.min(100,pct)*0.9;
      let why=[];
      if(kos===16){v=140;why.push("KO seguro")}
      else if(kos>0){v=100+kos*2;why.push(`${Math.round(kos/16*100)}% de KO`)}
      else why.push(`le deja ${Math.max(0,Math.round(100-pct))}%`);
      if(r.e>1)why.push(`superefectivo ×${r.e}`);
      if(M.sp&&B.doubles){v*=1.12;why.push("pega a los dos")}
      if(M.pri>0){v*=1.10;why.push("prioridad")}
      if(M.acc<90){v*=M.acc/100;why.push(`solo ${M.acc}% de precisión`)}
      // ¿te matan a vos primero? entonces el KO vale mucho más
      const inc=best(f.dex,myDex(m),{...ctxFor("them"),aItem:f.item,aAb:f.abil,
        dStat:st,dAb:m.abil,dBo:am.bo},foeMoves(f));
      const myHp=Math.floor(st[0]*(B.hp["m"+ai]??100)/100);
      if(inc&&inc.R[0]>=myHp){
        const mySpd=effSpd(Math.floor(myStat(m,5)*(m.item==="Pañuelo Elección"?1.5:1)),"me",am.sta,m.abil);
        const hisSpd=effSpd(spdRange(f).max,"them",(B.act["f"+di]||actNew()).sta,f.abil);
        if(mySpd>hisSpd&&kos===16){v+=45;why.push("y salís primero: lo matás antes de que te mate")}
        else why.push("ojo: te mata a vos");
      }
      out.push({k,slot,v,why:why.join(" · "),tgt:nm(f.dex),dmg:r,cur});
    }
  });
  return out;
}

  obs:{a:0,m:"Terremoto",p:50},log:[]});

/* ═════ EVENT LOG (Fase 2, sprint 2.1) ═════
   Registro append-only de los HECHOS OBSERVADOS que producen o corrigen una
   inferencia sobre el rival. No registra el estado de campo (clima, PS,
   etapas): eso sigue viviendo en B — ver `inference.md` §2.1 para por qué el
   alcance es ese y no "todo B derivado del log".

   Un evento nunca se edita ni se borra. Corregir es agregar otro evento.
   Eso es lo que después permite responder "¿por qué creés esto?", deshacer
   una inferencia sin resetear el combate, y arrastrar al juego 2 de un Bo3
   solo lo confirmado (`inference.md` §9).

   Vive dentro de B, así que se guarda y se restaura con el mismo mecanismo
   de siempre, sin tocar Kotlin. */
const logOf=()=>Array.isArray(B.log)?B.log:(B.log=[]);
/** id monotónico derivado del propio log — sobrevive al guardado/restaurado
    sin necesidad de un contador global que mantener en sincronía. */
const nextEventId=()=>logOf().reduce((m,e)=>Math.max(m,e.id||0),0)+1;
function logEvent(kind,data){
  const ev=Object.assign({id:nextEventId(),turn:B.turn,kind},data||{});
  logOf().push(ev);
  return ev;
}
/** Eventos de un rival concreto, por índice en B.team. */
const eventsOfFoe=i=>logOf().filter(e=>e.foe===i);
/** Un evento en texto legible. Es dominio, no presentación: el mismo texto
    lo va a reusar la cadena de evidencia del sprint 2.2 para contestar
    "¿por qué creés esto?" — por eso vive acá y no dentro de la vista.
    Tolera eventos incompletos (un guardado viejo, un tipo que todavía no
    conoce) devolviendo algo legible en vez de romper el render. */
function describeEvent(e){
  if(!e||!e.kind)return "—";
  const mv=k=>esc(mvName(k)), it=k=>esc(itName(k)), ab=k=>esc(abilName(k));
  const pre=e.carried?"(partida anterior) ":"";
  let txt;
  switch(e.kind){
    case "teamPreview":     txt=`Team preview: ${(e.team||[]).length} leídos`;break;
    case "brought":         txt="Confirmado en la partida";break;
    case "broughtCleared":  txt="Desmarcado de la partida";break;
    case "moveSeen":        txt=`Usó ${mv(e.move)}`;break;
    case "moveCleared":     txt=`Se desmarcó ${mv(e.move)}`;break;
    case "itemRevealed":    txt=`Objeto revelado: ${it(e.item)}`;break;
    case "itemCleared":     txt=`Se quitó el objeto ${it(e.item)}`;break;
    case "abilityRevealed": txt=`Habilidad revelada: ${ab(e.ability)}`;break;
    case "abilityCleared":  txt=`Se quitó la habilidad ${ab(e.ability)}`;break;
    case "order":           txt=`Se movió ${e.faster?"antes":"después"} que ${
                              esc(nm(e.vs&&e.vs.dex))} (velocidad ${e.vs&&e.vs.eff})`;break;
    case "damage":          txt=e.ok
                              ? `${mv(e.move)} le hizo ${e.pct}% — quedan ${e.n} repartos posibles`
                              : `${mv(e.move)} le hizo ${e.pct}% — ningún reparto normal da ese número`;break;
    case "ko":              txt="Debilitado";break;
    case "revived":         txt="Marcado como no debilitado";break;
    case "abilityNoTrigger":txt=`Bajó el Ataque con ${ab(e.trigger)} — descarta las habilidades que lo bloquean`;break;
    case "speciesCorrected":txt=`Especie corregida a mano (era ${esc(nm(e.was))})`;break;
    default:                txt=esc(e.kind);
  }
  return pre+txt;
}
/* ── Hipótesis derivadas del log (Fase 2, sprint 2.2) ──
   `inference.md` §3: cada dimensión se deriva del event log en el momento
   de mostrarla, no se mantiene como estado paralelo que se pueda
   desincronizar. Deliberadamente NO reemplazan las mutaciones directas que
   ya hacían observeOrder()/solveBulk() sobre f.item/f.spdMin/f.bulk — esas
   siguen intactas, sin cambiar su lógica (así lo pide el sprint), y son las
   que de verdad alimentan el resto de la app (calc(), spdRange()...). Estas
   funciones son una lectura adicional, de solo lectura, que existe para
   poder contestar "¿por qué?" citando el evento exacto — el mismo dato,
   interpretado una vez más, no una segunda fuente de verdad.
   No hay una dimensión `speed`/`bulk` enumerada (`inference.md` §3.2): se
   citan como rango + el/los eventos que lo acotaron, igual que ya hacía el
   código antes de este sprint. */
function itemHypothesis(i){
  let confirmed=null;
  for(const e of visibleEvents(i)){
    if(e.kind==="itemRevealed")confirmed={value:e.item,byEvent:e.id};
    else if(e.kind==="itemCleared")confirmed=null;
  }
  if(confirmed)return{level:"confirmed",...confirmed};
  const orders=visibleEvents(i).filter(e=>e.kind==="order"&&e.item);
  if(orders.length){const l=orders[orders.length-1];
    return{level:"deduced",value:l.item,byEvent:l.id,rule:"speedFloor"}}
  return{level:"unknown"};
}
function abilityHypothesis(i){
  let confirmed=null;
  for(const e of visibleEvents(i)){
    if(e.kind==="abilityRevealed")confirmed={value:e.ability,byEvent:e.id};
    else if(e.kind==="abilityCleared")confirmed=null;
  }
  return confirmed?{level:"confirmed",...confirmed}:{level:"unknown"};
}
/** R4 (`inference.md` §5, roadmap Sprint 2.5): "descarta una habilidad que
    debería haberse activado y no lo hizo" — el caso que quedó pendiente por
    necesitar una fuente verificada, no adivinada. Lista sacada del código
    fuente real de Pokémon Showdown (`data/abilities.ts`, revisado el
    2026-08-04): solo entran acá las habilidades que BLOQUEAN a Intimidación
    por completo y en silencio (`onTryBoost` borra el `boost.atk` sin dejar
    ningún otro rastro). Deliberadamente NO incluye:
      - `guarddog` (Perro Guardián): también bloquea la bajada, pero además
        sube +1 Ataque con su propio mensaje de activación — se delata sola,
        no hace falta esta regla para confirmarla por descarte.
      - `mirrorarmor` (Armadura Espejo): no bloquea, REBOTA la bajada hacia
        quien usó Intimidación — el efecto visible es distinto (mi propio
        Pokémon baja de Ataque), un caso que esta regla no cubre todavía.
      - `rattled`/`defiant`/`competitive`: la bajada de Ataque SÍ se ve
        igual, solo agregan una reacción aparte — no aplica a "no trigger".
    Lista cerrada a propósito: agregar un trigger nuevo acá exige la misma
    verificación línea por línea contra el código fuente, no una suposición
    de mecánica "parecida". */
const ABILITY_NO_TRIGGER={
  intimidate:["clearbody","whitesmoke","fullmetalbody","hypercutter",
    "innerfocus","oblivious","owntempo","scrappy"],
};
function abilitiesRuledOut(i){
  const evs=visibleEvents(i).filter(e=>e.kind==="abilityNoTrigger"&&ABILITY_NO_TRIGGER[e.trigger]);
  return {value:[...new Set(evs.flatMap(e=>ABILITY_NO_TRIGGER[e.trigger]))],
          byEvent:evs.map(e=>e.id)};
}
function speedHypothesis(i){
  const orders=visibleEvents(i).filter(e=>e.kind==="order");
  if(!orders.length)return{level:"unknown",byEvent:[]};
  const l=orders[orders.length-1];
  return{level:"deduced",min:l.spdMin,max:l.spdMax,byEvent:orders.map(e=>e.id)};
}
function bulkHypothesis(i){
  const dmgs=visibleEvents(i).filter(e=>e.kind==="damage");
  if(!dmgs.length)return{level:"unknown"};
  const l=dmgs[dmgs.length-1];
  return l.ok?{level:"deduced",hp:l.hp,df:l.df,n:l.n,byEvent:l.id}
             :{level:"contradiction",move:l.move,pct:l.pct,byEvent:l.id};
}
/** Fase 4 (inference.md §9): en un Bo3 el rival vuelve con el mismo
    plantel — el team preview no cambia entre juegos — así que lo
    CONFIRMADO en un juego sigue siendo cierto en el siguiente. Lo
    meramente deducido NO se arrastra: un Pañuelo Elección deducido por
    piso de velocidad (observeOrder(), más arriba) puede no repetirse en
    el próximo juego, así que se descarta a propósito — por eso se usa
    itemHypothesis()/abilityHypothesis() (ya distinguen "confirmado por
    revelación" de "deducido") y no los campos mutables f.item/f.itemSure
    directo, que también quedan en `true` por esa deducción.
    Hay que llamarla ANTES de reemplazar B: lee itemHypothesis()/
    abilityHypothesis()/eventsOfFoe() del combate que está terminando.
    Muta `newTeam` en el lugar con los mismos campos que ya alimentan el
    resto del HUD (mismo patrón dual de lectura+mutación del sprint 2.2:
    la mutación es lo que de verdad maneja `vFoe()`, el log es la cita
    inspeccionable de por qué). Devuelve los eventos para sembrar en el
    log nuevo, marcados `carried:true` para que `describeEvent()` avise
    de dónde salieron. */
function carryToNextGame(oldTeam,newTeam){
  const events=[];
  oldTeam.forEach((of,i)=>{
    const nf=newTeam[i];if(!nf)return;
    const ih=itemHypothesis(i);
    if(ih.level==="confirmed"){
      nf.item=ih.value;nf.itemSure=true;
      events.push({kind:"itemRevealed",foe:i,dex:nf.dex,item:ih.value,carried:true})}
    const ah=abilityHypothesis(i);
    if(ah.level==="confirmed"){
      nf.abil=ah.value;
      events.push({kind:"abilityRevealed",foe:i,dex:nf.dex,ability:ah.value,carried:true})}
    (of.moves||[]).forEach(mvv=>{
      nf.moves.push(mvv);
      events.push({kind:"moveSeen",foe:i,dex:nf.dex,move:mvv,carried:true})});
    eventsOfFoe(i).filter(e=>e.kind==="abilityNoTrigger").forEach(e=>
      events.push({kind:"abilityNoTrigger",foe:i,dex:nf.dex,trigger:e.trigger,carried:true}));
  });
  return events;
}
/* ── Cómo se muestra la confianza (decisión #24) ──
   Un solo vocabulario para todo el HUD. Antes cada tarjeta inventaba el suyo
   ("✔ visto", "○ común en meta", "◇ solo posible", "(deducido)", "○ estimado,
   no confirmado"), así que la misma idea se decía de cinco formas distintas.
   Los cuatro niveles mapean 1:1 con lo que el motor ya distingue:
     visto     — hecho observado, pasó en pantalla (`inference.md` §1)
     deducido  — se descartó el resto (R1/R2/R4)
     probable  — prior de meta, datos de torneo
     posible   — solo sabemos que puede aprenderlo (learnset); no dice nada
                 sobre qué tan probable es, y por eso es el más apagado. */
const CONF={visto:["●","visto","v"],deducido:["◐","deducido","d"],
  probable:["○","probable","p"],posible:["◇","posible","q"]};
/** Marca de confianza: símbolo Y palabra, siempre las dos juntas. Angel
    corrigió la propuesta que dejaba solo el símbolo — la marca sola se lee
    más rápido pero hay que aprenderla primero. */
const confTag=k=>{const c=CONF[k];
  return c?`<span class="cf3 ${c[2]}"><i>${c[0]}</i>${c[1]}</span>`:""};
/** Detalle técnico de un fallo, para poder arreglarlo rápido. Va SIEMPRE
    debajo de un mensaje humano que explique qué pasó y qué hacer — este
    bloque es el "por si querés el detalle", no la explicación.
    Es deliberadamente verboso mientras el proyecto está en desarrollo
    (pedido explícito de Angel); la pasada de limpieza para la versión final
    está anotada en `future.md`. El código corto (`OCR-02`) es lo que hace
    que un reporte sea buscable en el código. */
const dbg=(code,detail)=>!detail?"":`<div class="dbg"><b>Detalle · ${esc(code)}</b>
  <code>${esc(String(detail).slice(0,400))}</code></div>`;
/** Qué filas de "por qué" están desplegadas — vive fuera de B a propósito:
    es un detalle de cómo se está mirando la pantalla ahora, no un hecho del
    combate, así que no tiene sentido guardarlo (mismo criterio que PICK/REG
    más abajo, en la sección VISTAS). */
let WHY_OPEN={};
/** Fila de dato con confianza + "por qué" desplegable en un tap
    (`vision.md`, "explicable en un tap"). Sin evento que citar, es una fila
    normal — no todo dato viene de una inferencia con evidencia puntual. */
/** `extra` es texto informativo estático (ej. la descripción de una
    habilidad) que no viene de un evento — se muestra junto al "por qué"
    cuando la fila se abre, con la misma interacción de un tap, en vez de
    sumar una segunda forma de expandir en la misma fila. */
function whyRow(key,label,valueHtml,cls,byEvent,extra){
  const hasEv=byEvent&&(Array.isArray(byEvent)?byEvent.length:true);
  const has=hasEv||extra;
  const open=has&&WHY_OPEN[key];
  return `<div class="row"${has?` data-why="${key}" style="cursor:pointer"`:""}>
    <b>${label}${has?`<s>${open?"ocultar":"tocá para más info"}</s>`:""}</b>
    <u class="${cls}">${valueHtml}</u></div>
    ${open?`<div class="msg" style="margin:-3px 0 5px">${
      [hasEv?esc(whyText(byEvent)):"",extra?esc(extra):""].filter(Boolean).join(" — ")
    }</div>`:""}`;
}
/** Texto de "por qué", a partir del/los evento(s) citados por una hipótesis.
    Reusa describeEvent() — una sola fuente para el texto de un evento, la
    use el registro crudo o esta explicación puntual. */
function whyText(byEvent){
  const ids=Array.isArray(byEvent)?byEvent:[byEvent];
  const evs=ids.map(id=>logOf().find(e=>e.id===id)).filter(Boolean);
  if(!evs.length)return"";
  return evs.map(e=>`T${e.turn}: ${describeEvent(e)}`).join(" · ");
}

/* ── Deshacer un evento (Fase 2, sprint 2.2) ──
   El log nunca se edita ni se borra (`inference.md` §2): deshacer agrega un
   evento "undone" que referencia al original, en vez de eliminarlo — el
   registro crudo sigue completo para quien lo quiera auditar. Las hipótesis
   de arriba ya ignoran los eventos deshechos (visibleEvents()).
   Además revierte el campo mutable que ese evento había cambiado, para que
   el resto de la app (que sigue leyendo f.item/f.spdMin/etc. directo, sin
   pasar por el log) quede consistente con lo que ahora dice el registro. */
const isUndone=id=>logOf().some(e=>e.kind==="undone"&&e.ref===id);
const visibleEvents=i=>eventsOfFoe(i).filter(e=>e.kind!=="undone"&&!isUndone(e.id));
/** Recalcula spdMin/spdMax/item/itemSure desde cero, reproduciendo los
    eventos "order" que sigan vigentes en orden — es la única dimensión
    acumulativa (cada observación acota más el rango anterior), así que
    deshacer una necesita rehacer las que quedan, no solo borrar la última.
    Limitación conocida y documentada (`inference.md` §2.1): el multiplicador
    de Tailwind se toma del B.tw ACTUAL, no del que regía cuando pasó cada
    evento — el estado de campo no vive en el log. En la práctica el efecto
    es chico: Tailwind rara vez sigue activo turnos después. */
function recomputeFoeSpeed(i){
  const f=B.team[i];if(!f)return;
  f.spdMin=0;f.spdMax=9999;f.spdSure=false;
  const confirmedItem=itemHypothesisFromEvents(visibleEvents(i).filter(e=>e.kind!=="order"));
  if(!confirmedItem&&f.item==="Pañuelo Elección"){f.item=null;f.itemSure=false}
  for(const e of visibleEvents(i))if(e.kind==="order")observeOrder(f,e.vs&&e.vs.eff,e.faster);
}
/** Extraída de itemHypothesis() para poder consultar "¿hay un ítem
    CONFIRMADO (no deducido)?" sin los eventos order — la necesita
    recomputeFoeSpeed() para no borrar un objeto que el usuario reveló a
    mano solo porque también coincide con lo que la velocidad deducía. */
function itemHypothesisFromEvents(evs){
  let confirmed=null;
  for(const e of evs){
    if(e.kind==="itemRevealed")confirmed=e.item;
    else if(e.kind==="itemCleared")confirmed=null;
  }
  return confirmed;
}
function undoEvent(id){
  const ev=logOf().find(e=>e.id===id);
  if(!ev||ev.kind==="undone"||isUndone(id))return;
  const i=ev.foe;
  logEvent("undone",{ref:id});
  const f=i!==undefined?B.team[i]:null;
  if(f)switch(ev.kind){
    case "itemRevealed":
      if(f.item===ev.item&&!itemHypothesisFromEvents(visibleEvents(i))){f.item=null;f.itemSure=false}
      recomputeFoeSpeed(i);break;  // por si la velocidad ya lo había deducido
    case "abilityRevealed":
      if(f.abil===ev.ability)f.abil=null;break;
    case "moveSeen":{
      const p=f.moves.indexOf(ev.move);if(p>=0)f.moves.splice(p,1);break}
    case "order": recomputeFoeSpeed(i);break;
    case "damage":
      if(f.bulk&&f.bulk.byEvent===id)f.bulk=null;break;
    case "ko": f.out=false;syncFoe();break;
    case "revived": f.out=true;syncFoe();break;
    case "brought": f.brought=false;syncActiveFoe();break;
    case "broughtCleared": f.brought=true;syncActiveFoe();break;
  }
  save();
}
/** Tipos de evento con un revertidor real en undoEvent() — ver ahí. El resto
    (teamPreview, speciesCorrected, los *Cleared) no ofrece "deshacer": no
    hay un campo mutable puntual que restituir, y un botón que no visiblemente
    hace nada es peor que no tenerlo. */
/** `abilityNoTrigger` entra acá aunque no tenga un `case` propio en el switch
    de arriba: no muta ningún campo `f.*` (es una lectura derivada, igual que
    `abilitiesRuledOut()`), así que marcar el evento como `undone` alcanza —
    `visibleEvents()` ya lo excluye solo, el efecto visible (la lista de
    descartadas se achica) pasa sin necesitar un revertidor puntual. */
const UNDOABLE=new Set(["itemRevealed","abilityRevealed","moveSeen","order","damage","ko","revived","brought","broughtCleared","abilityNoTrigger"]);

const mkFoe=(dex,c,sh)=>({dex,confidence:c,shiny:!!sh,item:null,itemSure:false,abil:null,
  moves:[],spdMin:0,spdMax:9999,spdSure:false,out:false,seen:0,brought:false,ppUsed:{}});
/** Los 4 (o menos) rivales confirmados en esta partida — hasta que no se
    marcan, todavía no sabemos quién entró de verdad, más allá de team
    preview (que muestra los 6). */
const broughtFoes=()=>B.team.map((f,i)=>i).filter(i=>B.team[i]?.brought);

/** Al marcar quién entró (Campo), los selectores "Tus activos"/"Rivales" se
    quedaban en el default (índices 0/1) aunque el usuario ya hubiera
    marcado otros — Angel lo reportó tras probar el HUD real: marcar los 2
    rivales y los 4 propios no cambiaba "los pokémon que hay en campo".
    Estas dos funciones completan, sin pisar, cualquier slot activo que
    todavía no apunte a alguien ya confirmado — así el primer toque deja
    listo el campo, pero un cambio de activo posterior en pleno combate
    (con más de needed ya confirmados) no se revierte solo. */
function syncActiveFoe(){
  const need=B.doubles?2:1;
  for(let k=0;k<need;k++){
    if(!B.team[B.foe[k]]?.brought){
      const free=broughtFoes().find(i=>!B.foe.slice(0,need).includes(i));
      if(free!==undefined)B.foe[k]=free;
    }
  }
}
function syncActiveMine(){
  const need=B.doubles?2:1;
  for(let k=0;k<need;k++){
    if(!B.myBrought.includes(B.mine[k])){
      const free=B.myBrought.find(i=>!B.mine.slice(0,need).includes(i));
      if(free!==undefined)B.mine[k]=free;
    }
  }
}
