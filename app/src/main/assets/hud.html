/* ── PREVIA: qué va a sacar y qué sacar vos ── */
/* 12 Pokémon (6 propios + 6 rivales) por velocidad base, sin modificadores de
   turno (Tailwind/Espacio Raro todavía no están activos antes del turno 1).
   Los propios tienen velocidad exacta; los rivales, un rango — nunca se
   muestra un solo número para el rival, sería fingir una precisión que no
   hay (vision.md, "confianza calibrada"). Se ordena por el máximo del rango:
   la lectura conservadora es asumir que puede ser tan rápido como el rango
   permite. */
/** Velocidad que tendría m si mega-evolucionara, aunque todavía no lo haya
    hecho (m.mega en false) — null si no lleva piedra o ya está megaevolucionado
    (ahí myStat() ya refleja el cambio solo, vía myDex()). */
const megaSpeed=m=>{
  if(m.mega)return null;
  const md=canMega(m); if(!md)return null;
  return stOf(S(md).s[5],m.sp[5],natMul(5,m.up,m.dn));
};
/** Análogo a megaSpeed() para el RIVAL (pedido de Angel, 2026-08-05): "sé qué
    especies pueden megaevolucionar, quiero saber qué velocidad tendrían".
    A diferencia de megaSpeed() no depende de que el ítem esté confirmado —
    casi nunca lo está antes de que el rival megaevolucione de verdad, y para
    esta pregunta ("¿qué pasa SI mega evoluciona?") no hace falta: alcanza con
    que la especie TENGA una forma mega conocida. Null si no tiene ninguna, o
    si ya está mega evolucionado de verdad (ahí spdRange() ya usa el dex mega
    vía la misma lógica que myDex() del lado propio). */
function megaSpeedFoeRange(f){
  if(!f||!f.dex)return null;
  const entry=Object.values(MEGA).find(g=>g[1]===f.dex);
  if(!entry)return null;
  const sp=S(entry[0]); if(!sp)return null;
  return {min:stOf(sp.s[5],0,0.9),max:stOf(sp.s[5],SP_MAX,1.1)};
}
/** Multiplicador de una fase de estadística (-6..+6), fórmula real del juego:
    positiva = (2+n)/2, negativa = 2/(2-n). n=0 (sin fase) da ×1. */
const stageMul=n=>n>=0?(2+n)/2:2/(2-n);
/** Aplica el estado "qué pasaría si" (SPD_WHATIF) a una velocidad ya
    calculada: fase primero (multiplica la base), después Pañuelo Elección,
    después Viento Afín — mismo orden que usa el juego de verdad. */
const applyWhatIf=(v,t)=>{
  if(!t)return v;
  let x=Math.floor(v*stageMul(t.stage||0));
  if(t.scarf)x=Math.floor(x*1.5);
  if(t.tw)x=Math.floor(x*2);
  return x;
};
/** Capa de exploración de "Quién pega primero" (pedido de Angel, 2026-08-05):
    probar Pañuelo/Viento Afín/fases por Pokémon SIN tocar `m.item`/`f.item`
    reales ni el B.tw de verdad. Vive fuera de B y MY a propósito — save()
    serializa B, saveMy() serializa MY, y SPD_WHATIF no es ninguno de los
    dos, así que nunca se guarda ni sobrevive a un equipo nuevo (ver
    resetSpdWhatIf(), llamada en window.onScan y en el botón de reset). Del
    lado propio solo tiene sentido Viento Afín y fases (el ítem real ya está
    reflejado); del lado rival se agrega Pañuelo porque ahí sí es una
    hipótesis genuina ("¿y si lo trae?"). */
let SPD_WHATIF={mine:{},foe:{}};
const whatIfMine=i=>SPD_WHATIF.mine[i]||(SPD_WHATIF.mine[i]={tw:false,stage:0});
const whatIfFoe=i=>SPD_WHATIF.foe[i]||(SPD_WHATIF.foe[i]={scarf:false,tw:false,stage:0});
const resetSpdWhatIf=()=>{SPD_WHATIF={mine:{},foe:{}}};
/** Vista "Detallada" de velocidad (decisión #25, sprint 3.1 de roadmap.md):
    en vez de min–máx teórico, pesa cada franja de velocidad por los spreads
    y naturalezas REALES de esa especie (`topEvSpreads`×`topNatures` de
    meta.json — mismos datos que ya se muestran en "Repartos habituales" de
    Rival, sprint 2.7). `spread` y `naturaleza` son medidos por separado en
    la fuente, no como pares — por eso se cruzan como independientes
    (`pct1×pct2`), no se buscan combinaciones ya emparejadas.
    Si la especie no tiene esos datos todavía, degrada a `uniform:true` — la
    vista tiene que poder distinguir "no sabemos, es parejo" de "sabemos que
    es parejo", nunca inventar una distribución con aire de medida real
    (`vision.md`, confianza calibrada). */
function speedWeights(dex,wt){
  const sp=S(dex); if(!sp)return null;
  const base=sp.s[5];
  const min=applyWhatIf(stOf(base,0,0.9),wt), max=applyWhatIf(stOf(base,SP_MAX,1.1),wt);
  const meta=metaOf(dex);
  const spreads=meta?.topEvSpreads||[], nats=meta?.topNatures||[];
  if(!spreads.length||!nats.length)return {min,max,uniform:true,buckets:null,dominant:null};
  // Spread dominante (pedido de Angel, 2026-08-06): con >=40% de uso, una
  // franja difusa es MENOS precisa que mostrar el valor exacto de ESE
  // spread — se muestra aparte, con la naturaleza más común como referencia
  // (no se pondera, es solo la etiqueta del punto).
  const top=spreads[0];
  const natTop=nats[0];
  const dominant=(top&&top.pct>=40)?{pct:top.pct,
    v:applyWhatIf(stOf(base,top.sp[5],natTop?(natTop.statUp==="Speed"?1.1:natTop.statDown==="Speed"?0.9:1):1),wt),
    nature:natTop?natTop.name:null}:null;
  const N=5,buckets=new Array(N).fill(0);
  let total=0;
  for(const s of spreads)for(const n of nats){
    const nm2=n.statUp==="Speed"?1.1:n.statDown==="Speed"?0.9:1;
    const v=applyWhatIf(stOf(base,s.sp[5],nm2),wt);
    const w=(s.pct||0)*(n.pct||0);
    total+=w;
    const idx=Math.min(N-1,Math.max(0,Math.floor((v-min)/((max-min)||1)*N)));
    buckets[idx]+=w;
  }
  return {min,max,uniform:false,dominant,
    buckets:total>0?buckets.map(w=>w/total*100):buckets};
}
function fullSpeedOrder(){
  // Bug real reportado por Angel (2026-08-05): esta función usaba myStat(m,5)
  // en crudo. myStat() es DELIBERADAMENTE la stat sin objeto (mismo criterio
  // que calc(), que aplica ítems por separado vía aItem) — el resto del
  // archivo lo sabe y multiplica al llamar (vCompact, vSpeed, suggest()...),
  // pero acá faltaba. Un Gholdengo con Pañuelo Elección confirmado (136 base)
  // se mostraba sin sus ×1.5 (204), y por eso aparecía más lento que rivales
  // con solo el rango teórico.
  const mine=MY.map((m,mi)=>({m,mi})).filter(x=>x.m.dex&&S(x.m.dex)).map(({m,mi})=>{
    const base=Math.floor(myStat(m,5)*(m.item==="Pañuelo Elección"?1.5:1));
    const wt=whatIfMine(mi), mg=megaSpeed(m);
    return {me:1,mi,dex:myDex(m),n:nm(myDex(m)),v:applyWhatIf(base,wt),lo:null,hi:null,
      megaV:mg==null?null:applyWhatIf(mg,{...wt,scarf:false}),wt};
  });
  const foes=B.team.map((f,fi)=>({f,fi})).filter(x=>x.f.dex&&S(x.f.dex)).map(({f,fi})=>{
    const r=spdRange(f),wt=whatIfFoe(fi),mg=megaSpeedFoeRange(f);
    return {me:0,fi,dex:f.dex,n:nm(f.dex),v:applyWhatIf(r.max,wt),lo:applyWhatIf(r.min,wt),hi:applyWhatIf(r.max,wt),
      megaV:mg==null?null:{min:applyWhatIf(mg.min,{...wt,scarf:false}),max:applyWhatIf(mg.max,{...wt,scarf:false})},wt};
  });
  return [...mine,...foes].sort((a,b)=>b.v-a.v);
}

/* Para cada rival (los 6, no solo los que se estima que va a sacar), su
   mejor golpe posible contra el propio que peor lo resiste. Es información
   sobre el rival — qué tan peligroso es cada uno — no una recomendación de
   qué hacer con esa información: no viola decisions.md #1/#19, mismo
   principio que ya usa "Te hacen" en Glance. */
function topThreats(){
  const mine=MY.filter(m=>m.dex&&S(m.dex));
  const foes=B.team.filter(f=>f.dex&&S(f.dex));
  if(!mine.length||!foes.length)return [];
  return foes.map(f=>{
    const pool=foeMovePool(f);
    let worst=null;
    for(const m of mine){
      const r=best(f.dex,myDex(m),{doubles:B.doubles,aItem:f.item,aAb:f.abil,
        dStat:statsOf(m),dAb:m.abil},pool.moves);
      if(r&&r.e>0&&(!worst||r.R[15]/r.maxHP>worst.r.R[15]/worst.r.maxHP))worst={r,m};
    }
    return worst&&{f,m:worst.m,r:worst.r,src:pool.src};
  }).filter(Boolean).sort((a,b)=>(b.r.R[15]/b.r.maxHP)-(a.r.R[15]/a.r.maxHP)).slice(0,4);
}

/** Sprint 2.6 (`inference.md` §10, `decisions.md` #21 parte 2): "si cambia a
    X, tu Y queda expuesto". Entre los rivales que NO están en campo ahora
    mismo (banca — no confirmados afuera, no el activo actual) cuál pegaría
    más fuerte contra el propio enfocado si el rival lo manda. No predice que
    vaya a pasar — describe la peor consecuencia posible de un cambio, con la
    misma marca de fuente (visto/meta/posible) que ya usa "Mayores amenazas"
    en Previa, para que sea inspeccionable igual que el resto.
    Mismo criterio que ya usa `vField()` (`foesBrought=broughtFoes().length?
    broughtFoes():foes`): si el jugador ya marcó quién entró de verdad, los
    2 que quedaron en banca de la team preview NO son candidatos — no pueden
    entrar a esta partida, y tratarlos como amenaza real sería inventar una
    amenaza que no existe. Antes de marcar nada (broughtFoes() vacío), se
    sigue considerando el equipo completo, igual que Previa. */
function benchThreat(mine,foes,fi){
  const mi=mine[fi]; if(mi===undefined)return null;
  const m=MY[mi]; if(!m)return null;
  const activeSet=new Set(foes);
  const brought=broughtFoes();
  const eligible=brought.length?new Set(brought):null;
  let worst=null;
  B.team.forEach((f,fIdx)=>{
    if(!f||!f.dex||!S(f.dex)||activeSet.has(fIdx)||f.out)return;
    if(eligible&&!eligible.has(fIdx))return;
    const pool=foeMovePool(f);
    const r=best(f.dex,myDex(m),{doubles:B.doubles,aItem:f.item,aAb:f.abil,
      dStat:statsOf(m),dAb:m.abil},pool.moves);
    if(r&&r.e>0&&(!worst||r.R[15]/r.maxHP>worst.r.R[15]/worst.r.maxHP))
      worst={f,r,src:pool.src};
  });
  return worst;
}
/* ── Motor de prioridad (Fase 2, sprint 2.4, `inference.md` §10) ──
   Qué información es más probable que cambie la decisión de ESTE turno.
   relevancia = pesoBase(tipo) × multiplicadorDeUmbral. Deliberadamente dos
   factores simples e inspeccionables, sin pesos finos ajustados a mano —
   ese error ya se cometió con `predict()` (ver `future.md`).
   Jerarquiza SEÑALES para decidir qué sube a Glance, nunca opciones de
   ataque: `decisions.md` #19 sigue vigente, cero ranking de movimientos
   propios. El orden de peso base salió de la sesión de asesoría VGC
   (`decisions.md` #20): velocidad crítica > rango de KO > amenaza entrante >
   amenaza de banca (sprint 2.6). */
const PRIORITY_WEIGHTS={speed:100,ko:90,threat:80,back:70};
/** ¿La velocidad exacta del propio enfocado cae DENTRO del rango incierto
    de algún rival activo? Si sí, todavía no se sabe quién pega primero —
    cruza la frontera de decisión más básica de todas.
    Simplificación deliberada y documentada: compara el stat base sin
    etapas/estado/Tailwind — esos modifican ambos lados por igual, así que
    si hay incertidumbre a nivel de reparto, en general sigue habiéndola con
    los modificadores puestos. No es una prueba exacta, es la señal barata
    que alcanza para decidir si vale la pena mostrarla en Glance. */
function speedCriticalPair(mine,foes,fi){
  const mi=mine[fi]; if(mi===undefined)return null;
  const m=MY[mi]; if(!m)return null;
  const myV=myStat(m,5);
  for(const fIdx of foes){
    const f=B.team[fIdx]; if(!f)continue;
    const r=spdRange(f);
    if(myV>=r.min&&myV<=r.max)return f;
  }
  return null;
}
/** `S1` (de `suggest()`), `worst`/`wv` (la amenaza calculada) ya vienen
    computados por quien llama — esta función no recalcula daño, solo
    decide cuál de las señales ya disponibles vale más la pena mostrar
    primero. Devuelve `null` si ninguna cruza una frontera real.
    `myHp` es el HP ACTUAL del propio enfocado (no el máximo) — lo necesita
    la señal `back` para juzgar si un cambio del rival lo mataría de verdad
    ahora mismo, no en un hipotético a full vida. Si no se pasa (compatible
    con llamadas viejas), se asume vida completa. */
function priorityAlert(mine,foes,fi,S1,worst,wv,myHp){
  const candidatos=[];
  const spdFoe=speedCriticalPair(mine,foes,fi);
  if(spdFoe)candidatos.push({tipo:"speed",peso:PRIORITY_WEIGHTS.speed,
    texto:`Velocidad sin definir contra ${esc(nm(spdFoe.dex))}: según su reparto, puede ir antes o después.`});
  // x.dmg es el resultado crudo de calc() (trae R/maxHP/e, no .ko todavía) —
  // .ko lo calcula verdict(), como ya hace el resto del HUD para mostrar el
  // resultado. Mismo dato, no una segunda fuente de verdad.
  for(const x of (S1||[])){
    if(!x.dmg)continue;
    const vd=verdict(x.dmg,x.cur);
    if(typeof vd.ko==="number"&&vd.ko>0&&vd.ko<16){
      candidatos.push({tipo:"ko",peso:PRIORITY_WEIGHTS.ko,
        texto:`${esc(mvName(x.k))}: no todas las tiradas matan (${esc(vd.txt)}).`});
      break;
    }
  }
  if(worst&&wv&&typeof wv.ko==="number"&&wv.ko>0&&wv.ko<16)
    candidatos.push({tipo:"threat",peso:PRIORITY_WEIGHTS.threat,
      texto:`${esc(nm(worst.f.dex))} con ${esc(mvName(worst.r.move))}: no todas las tiradas te matan (${esc(wv.txt)}).`});
  // Sprint 2.6 (`decisions.md` #21 parte 2): "si cambia a X, tu Y queda
  // expuesto" — describe la consecuencia de un cambio posible, no lo elige
  // ni predice que vaya a pasar. Cualquier chance real de KO (mixto o
  // garantizado) es información nueva que el resto de las señales de arriba
  // no cubre, porque esas solo miran el matchup activo ahora mismo.
  const mi=mine[fi],m=mi!==undefined?MY[mi]:null;
  const bench=m?benchThreat(mine,foes,fi):null;
  if(bench){
    const vdBench=verdict(bench.r,myHp??bench.r.maxHP);
    if(typeof vdBench.ko==="number"&&vdBench.ko>0){
      const marca={visto:"ya se lo vimos usar",meta:"común en el meta",posible:"solo por learnset"}[bench.src]||"";
      candidatos.push({tipo:"back",peso:PRIORITY_WEIGHTS.back,
        texto:`Si el rival cambia a ${esc(nm(bench.f.dex))}, ${esc(nm(myDex(m)))} queda expuesto a ${esc(mvName(bench.r.move))} (${esc(vdBench.txt)}${marca?`, ${marca}`:""}).`});
    }
  }
  if(!candidatos.length)return null;
  candidatos.sort((a,b)=>b.peso-a.peso);
  return candidatos[0];
}

/** Controles "qué pasaría si" de una fila (decisión #25) — compartidos entre
    Simple y Detallada, mismos data-attributes, mismo wire(). */
function wcOf(x){
  const side=x.me?"m":"f", idx=x.me?x.mi:x.fi, t=x.wt;
  return `<div class="wc">
    ${x.me?"":`<button class="wtog" data-wsc="${idx}" data-on="${t.scarf?1:0}">Scarf</button>`}
    <button class="wtog" data-wtw="${side}:${idx}" data-on="${t.tw?1:0}">TW</button>
    <div class="wstep">
      <button data-wst="${side}:${idx}:-1">▾</button><span>${t.stage>0?"+":""}${t.stage}</span>
      <button data-wst="${side}:${idx}:1">▴</button>
    </div></div>`;
}
function vSpeedSimple(so){
  return so.map((x,i)=>{
    // La velocidad mega vivía como subtexto tenue bajo el NOMBRE — Angel
    // reportó que "queda un poco escondida" (2026-08-05). Ahora va junto
    // al número, que es lo primero que se mira, con su propio color para
    // no confundirla con el valor real de ahora mismo.
    const mega=x.megaV==null?"":typeof x.megaV==="number"
      ?`<s style="color:var(--sure)">◆ mega ${x.megaV}</s>`
      :`<s style="color:var(--sure)">◆ mega ${x.megaV.min}–${x.megaV.max}</s>`;
    return `<div class="row" style="padding:4px 8px">
    <b style="color:${x.me?"var(--pick)":"var(--foe-row)"}">${i+1}. ${esc(x.n)}</b>
    <u>${x.me?x.v:x.lo+"–"+x.hi}${mega}</u>${wcOf(x)}</div>`;
  }).join("");
}
/** Vista "Detallada" (sprint 3.2): eje horizontal compartido + los 6 propios
    como chips (una vez cada uno, con línea guía implícita en su propia
    posición X) + franjas de densidad real por rival. Diseñada con Angel en 3
    rondas de mockup (2026-08-05/06) antes de escribir esto — ver decisions.md
    #25 y roadmap.md "vista Detallada de velocidad". */
function vSpeedDetail(so){
  const mine=so.filter(x=>x.me), foes=so.filter(x=>!x.me);
  if(!mine.length||!foes.length)
    return `<div class="msg">Hace falta tu equipo y al menos un rival visto para esta vista.</div>`;
  const nums=n=>Array.isArray(n)?n:[n];
  const scaleMax=Math.max(50,...so.flatMap(x=>[
    x.v,x.hi||x.v,
    ...(typeof x.megaV==="number"?[x.megaV]:x.megaV?[x.megaV.min,x.megaV.max]:[]),
  ]))*1.08;
  const px=v=>Math.min(100,Math.max(0,v/scaleMax*100));

  // Los 6 propios como chips, ordenados por velocidad, apilados en el
  // mínimo de "pisos" que hace falta para no superponerse — se estima el
  // ancho por longitud de texto porque esto arma un string en el servidor,
  // no hay layout real del navegador todavía para medir (a diferencia de
  // los mockups, que sí podían leer getBoundingClientRect()).
  const CONT_W=640; // ancho de referencia del área del eje, en px
  const chips=mine.slice().sort((a,b)=>a.v-b.v).map(x=>{
    const label=`${x.n} ${x.v}`;
    const w=20+label.length*5.4+(x.megaV!=null?26:0);
    return {x,w,leftPct:px(x.v)};
  });
  const tierEdge=[];
  for(const c of chips){
    const leftPx=c.leftPct/100*CONT_W;
    let tier=0;
    while(tierEdge[tier]!==undefined&&leftPx<tierEdge[tier])tier++;
    tierEdge[tier]=leftPx+c.w;
    c.tier=tier;
  }
  const nTiers=Math.max(1,...chips.map(c=>c.tier+1));
  const chipsHtml=chips.map(c=>{
    const x=c.x;
    const mega=x.megaV!=null?`<s>◆${typeof x.megaV==="number"?x.megaV:x.megaV.min+"–"+x.megaV.max}</s>`:"";
    return `<div class="spdchip" style="left:${c.leftPct}%;top:${c.tier*16}px">
      <b>${esc(x.n)}</b><u>${x.v}</u>${mega}</div>`;
  }).join("");

  const ticks=[0,0.25,0.5,0.75,1].map(f=>Math.round(scaleMax*f));
  const axisHtml=ticks.map(v=>`<span style="left:${px(v)}%">${v}</span>`).join("");

  const rowsHtml=foes.map(x=>{
    const w=speedWeights(x.dex,x.wt);
    let bars="",lab="";
    if(!w||w.uniform){
      bars=`<div class="seg" style="left:${px(x.lo)}%;width:${px(x.hi)-px(x.lo)}%;opacity:.55"></div>`;
      lab=w?"sin datos de spread/naturaleza — rango teórico":"sin datos de meta";
    }else if(w.dominant){
      bars=`<div class="seg" style="left:${px(w.min)}%;width:${px(w.max)-px(w.min)}%;opacity:.10"></div>
        <div class="spike" style="left:${px(w.dominant.v)}%"></div>`;
      lab=`${w.dominant.pct}% con ${esc(w.dominant.nature||"su reparto más usado")} (${w.dominant.v})`;
    }else{
      const bw=(w.max-w.min)/5;
      bars=w.buckets.map((pct,i)=>{
        const l=w.min+bw*i;
        return `<div class="seg" style="left:${px(l)}%;width:${px(l+bw)-px(l)}%;opacity:${Math.min(.95,.08+pct/100*1.6)}"></div>`;
      }).join("");
      lab="peso de spreads/naturalezas reales (Champions Battle Data)";
    }
    const megaBand=x.megaV?`<div class="megaband" style="left:${px(x.megaV.min)}%;width:${px(x.megaV.max)-px(x.megaV.min)}%"></div>`:"";
    return `<div class="spdrow">
      <b class="nm">${esc(x.n)}</b>
      <div class="area">${bars}${megaBand}</div>
      <u style="font-size:9.5px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--cream)">${x.lo}–${x.hi}</u>
      ${wcOf(x)}</div>
    <div class="dlab">${esc(lab)}${x.megaV?" · ◆ mega si evoluciona":""}</div>`;
  }).join("");

  return `<div class="spdaxis">${axisHtml}</div>
    <div class="spdchips" style="height:${nTiers*16+14}px">${chipsHtml}</div>
    ${rowsHtml}`;
}
/** ¿Este dex es uno de los 12 de la partida? Si es un propio, objeto/
    habilidad vienen de lo que ya está cargado; si es un rival, solo lo que
    ya está CONFIRMADO (nunca la estimación de meta — acá no hay marca de
    confianza para mostrar de dónde salió el dato, así que mostrar algo no
    confirmado sería fingir una certeza que no hay, decisión #24).
    Ver docs/calc.md — "todo lo que el HUD ya sabe, lo completa solo". */
function calcTeamMatch(dex){
  const mine=MY.find(m=>m.dex&&myDex(m)===dex);
  if(mine)return {item:mine.item&&mine.item!=="—"?mine.item:null,
    abil:mine.abil&&mine.abil!=="—"?mine.abil:null,side:"mine"};
  const foe=B.team.find(f=>f.dex===dex);
  if(foe)return {item:foe.itemSure&&foe.item?foe.item:null,
    abil:foe.abil||null,side:"foe"};
  return null;
}
/** El estado alterado SOLO se conoce si ese Pokémon está ACTIVO ahora mismo
    (m0/m1/f0/f1, `B.act`) — un Pokémon en banca no tiene estado, se curó al
    salir. calc() ya sabe aplicar quemadura al daño físico (`o.aSta`), pero
    CALC nunca lo exponía: este es el mismo hallazgo de objeto/habilidad
    (docs/calc.md) — el motor sabía, la UI no preguntaba. */
/** ── CALC FUERA DE COMBATE (pedido de Angel, 2026-08-06) ──
    CALC tiene que servir para dos cosas distintas: consultar en medio de una
    partida (donde heredar el clima/terreno/pantallas actuales es justo lo que
    se quiere) y hacer cuentas armando equipo (donde ese mismo estado, si
    quedó de una partida anterior, envenena el resultado en silencio).
    Medido antes de escribir esto, con una lluvia sobrante de un combate
    previo: un Acua Jet pasaba de 36 a 54 de daño (+50%). Y CALC no mostraba
    nada de eso — el número cambiaba sin explicación, que es exactamente la
    degradación silenciosa que `vision.md` prohíbe.
    `field:"battle"` (default) mantiene el comportamiento de siempre;
    `"neutral"` limpia SOLO lo transitorio. El formato (dobles/individual) no
    se toca: es una preferencia de Ajustes, no un residuo de combate. */
const calcFieldCtx=c=>c&&c.field==="neutral"
  ? {doubles:B.doubles,weather:null,terrain:null,screen:false}
  : {...ctxFor("me"),doubles:B.doubles};
/** Qué efectos de campo hay activos ahora mismo, en texto. "sin efectos"
    cuando no hay ninguno — nunca vacío: que el jugador pueda confirmar de un
    vistazo que el número no trae nada escondido. */
function calcFieldLabel(){
  const p=[];
  if(B.weather)p.push(B.weather);
  if(B.terrain)p.push("campo "+B.terrain);
  if(B.screen.them>0)p.push("pantalla rival");
  return p.length?p.join(" · "):"sin efectos";
}
function calcActiveStatus(dex){
  if(MY[B.mine[0]]&&myDex(MY[B.mine[0]])===dex)return B.act.m0?.sta||null;
  if(MY[B.mine[1]]&&myDex(MY[B.mine[1]])===dex)return B.act.m1?.sta||null;
  if(B.team[B.foe[0]]&&B.team[B.foe[0]].dex===dex)return B.act.f0?.sta||null;
  if(B.team[B.foe[1]]&&B.team[B.foe[1]].dex===dex)return B.act.f1?.sta||null;
  return null;
}
/** Resuelve un estado de `window.__c` (CALC) al `{r,cur}` que de verdad se
    muestra — autocompletado de objeto/habilidad/estado incluido. Un único
    lugar para esta cadena: `vCalc()` la usa para pintar el resultado, y el
    botón "Duplicar" (calcSnapshot(), decisión de Angel 2026-08-11: temporal,
    no como los equipos) la reusa para congelar EXACTAMENTE el mismo número
    que está en pantalla — sin esto, cada uno recalcularía por su cuenta y un
    cambio futuro a la cadena de autocompletado los desincronizaría en silencio. */
function calcResolve(c){
  const aMatch=calcTeamMatch(c.atk), dMatch=calcTeamMatch(c.def);
  const aItem=c.aItemOv!==null?c.aItemOv:(aMatch?.item||"—");
  const dItem=c.dItemOv!==null?c.dItemOv:(dMatch?.item||"—");
  const aAb=c.aAbOv!==null?c.aAbOv:(aMatch?.abil||abilsOf(c.atk)[0]);
  const dAb=c.dAbOv!==null?c.dAbOv:(dMatch?.abil||abilsOf(c.def)[0]);
  const aStaAuto=calcActiveStatus(c.atk);
  const aStaSel=c.aStaOv!==null?c.aStaOv:(aStaAuto||"—");
  const aSta=aStaSel==="—"?null:aStaSel;
  const r=calc({...c,aItem,dItem,aAb,dAb,aSta,...calcFieldCtx(c)});
  const cur=r?Math.floor(r.maxHP*c.cur/100):0;
  return {r,cur,aMatch,dMatch,aItem,dItem,aAb,dAb,aStaAuto,aStaSel,aSta};
}
function vPre(){
  const so=fullSpeedOrder(), th=topThreats();
  if(!so.length&&!th.length)
    return `<div class="card"><div class="msg">Escaneá al rival con ↻ y cargá tu equipo en MÍO.</div></div>`;

  let h=`<div class="card"><span class="hd">Quién pega primero<em>los 12, sin efectos de campo todavía</em></span>
    <div class="spdseg">
      <button data-spdview="simple" data-on="${SPD_VIEW==="simple"?1:0}">Simple</button>
      <button data-spdview="detail" data-on="${SPD_VIEW==="detail"?1:0}">Detallada</button>
    </div>
    ${SPD_VIEW==="detail"?vSpeedDetail(so):vSpeedSimple(so)}</div>`;
  h+=`
  <div class="card f"><span class="hd">Lo que más te puede doler<em>su mejor golpe contra tu peor respuesta</em></span>
    ${th.length?th.map(t=>{const vd=verdict(t.r,t.r.maxHP);
      // De dónde salió el movimiento. Sin esta marca los tres niveles se leían
      // igual y "posible" parecía una amenaza confirmada.
      const marca=confTag({visto:"visto",meta:"probable",posible:"posible"}[t.src]);
      return `<div class="row"><b>${esc(nm(t.f.dex))}<s>a ${esc(nm(myDex(t.m)))} · ${esc(mvName(t.r.move))}</s></b>
        ${marca}<u class="${vd.cls}">${vd.txt}</u></div>`}).join("")
      :`<div class="msg">Todavía no hay con qué calcular. Tocá ↻ para leer al rival y cargá tu equipo en TUYO.</div>`}</div>`;

  // Predicción de team preview (quién va a sacar cada uno): por ahora el
  // algoritmo no acierta lo suficiente como para ser útil (feedback real de
  // Angel) — queda al fondo, sin estorbar, hasta un rediseño (future.md).
  // "Va a sacar" (sprint 2.9): ya no es el puntaje opaco del `predict()`
  // viejo — cada fila cita cuántas veces esa especie apareció junto a otra
  // de las que estamos viendo, sobre equipos de torneo reales. Sigue siendo
  // información sobre el RIVAL, no una elección propia.
  const bring=foeBringOrder();
  if(bring.length){
    const n=META.sourceCounts?.teams;
    h+=`<div class="card f" style="margin-top:10px"><span class="hd">Probable que traiga${confTag("probable")}</span>
      ${bring.map((x,i)=>{
        // Pedido de Angel (2026-08-06): mientras está team preview abierto,
        // ver de una con quién suele ir CADA rival y con qué movimientos
        // suele venir, sin tener que ir a Rival a buscarlo aparte. Mismo dato
        // que ya cita "Repartos habituales" (metaOf().moves), puesto donde
        // ayuda a decidir. Con learnset apenas, degrada solo (probableMoves
        // devuelve null y no se muestra la línea) — nunca inventa un "top 4"
        // sin uso real detrás.
        const mv=probableMoves(x.f.dex,4);
        return `<div class="row"><b>${i+1}. ${esc(nm(x.f.dex))}<s>${esc(whyBring(x))}</s>${
          mv?`<s>${mv.map(m=>`${esc(mvName(m.k))} ${m.pct}%`).join(" · ")}</s>`:""}</b>
        <u>${x.linked.length?x.linked[0].pct+"%":(x.usage!=null?x.usage+"%":"—")}</u></div>`;
      }).join("")}
      <div class="msg" style="margin-top:5px">Ordenado por cuánto suele aparecer junto a los otros que ya viste${
        n?`, sobre ${n} equipos de torneo`:""}. Cuáles dos lideran no se puede saber: no hay datos de eso.</div></div>`;
  }

  // "Sacá vos" (sprint 2.9): ya no rankea ni arma LEAD/BACK — ver
  // previewMatrix() para la decisión y por qué. Los "ejes de partida" de
  // predict() (Tailwind/Espacio Raro/mega/Bromista) siguen siendo texto
  // puramente descriptivo, así que se reusan tal cual para "Por qué".
  const mtx=previewMatrix();
  if(mtx){
    h+=`<div class="card"><span class="hd">Cómo te va contra cada uno<em>tu equipo, contra los ${mtx.foes.length} más probables</em></span>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:9.5px">
      <tr><td></td>${mtx.foes.map(f=>`<td style="text-align:center;padding:3px;font-weight:800;color:var(--foe-row)">${esc(nm(f.dex))}</td>`).join("")}</tr>
      ${mtx.mine.map(m=>{
        const pool=myMoves(m),st=statsOf(m);
        return `<tr><td style="font-weight:800;padding:3px;color:var(--pick)">${esc(nm(myDex(m)))}</td>${
          mtx.foes.map(f=>{
            const toThem=best(myDex(m),f.dex,{...ctxFor("me"),aStat:st,aItem:m.item==="—"?null:m.item,aAb:m.abil,dHP:0,dSP:0},pool);
            const fromThem=best(f.dex,myDex(m),{...ctxFor("them"),aItem:f.item,aAb:f.abil,dStat:st,dAb:m.abil},foeMoves(f));
            const vTo=verdict(toThem,toThem?toThem.maxHP:0),vFrom=verdict(fromThem,fromThem?fromThem.maxHP:0);
            return `<td style="text-align:center;padding:3px"><div class="${vTo.cls}">→${vTo.txt}</div><div class="${vFrom.cls}">←${vFrom.txt}</div></td>`;
          }).join("")}</tr>`;
      }).join("")}
      </table></div>
      <div class="msg" style="margin-top:5px">→ lo que le hacés · ← lo que te hace</div></div>`;
  }
  const p=predict();
  if(p&&p.notes.length){
    h+=`<div class="card d"><span class="hd">Claves de este cruce</span>
      ${p.notes.map(n=>`<div class="note">${esc(n)}</div>`).join("")}</div>`;
  }
  return h;
}

function hpBar(id,label,val){
  const cls=val<=25?"crit":val<=50?"low":"";
  return `<div class="hpbox ${cls}"><div class="hplab"><b>${esc(label)}</b><u>${val}%</u></div>
    <div class="hpwrap"><div class="hpbg"><div class="hpfill" style="width:${val}%"></div></div>
      <div class="knob" style="left:${val}%"></div>
      <input type="range" min="1" max="100" step="1" value="${val}" data-hp="${id}"></div></div>`;
}

/* Modo compacto: tres bloques y nada más. Para los últimos 15 segundos. */
function vCompact(){
  const mine=(B.doubles?B.mine:[B.mine[0]]).filter(i=>MY[i]);
  const foes=(B.doubles?B.foe:[B.foe[0]]).filter(i=>B.team[i]?.dex);
  if(!mine.length||!foes.length)return `<div class="card"><div class="msg">Elegí quién está en campo desde la pestaña CAMPO.</div></div>`;
  const fi=Math.min(B.focus,mine.length-1);
  const m=MY[mine[fi]];
  const S1=suggest(mine[fi],fi,mine,foes);

  // orden de velocidad reducido a lo esencial
  const spd=[];
  mine.forEach((mi,i)=>{const a=B.act["m"+i]||actNew();
    spd.push({me:1,n:nm(myDex(MY[mi])),
      v:effSpd(Math.floor(myStat(MY[mi],5)*(MY[mi].item==="Pañuelo Elección"?1.5:1)*stg((a.bo||[0,0,0,0,0])[4],0,1)),"me",a.sta,MY[mi].abil)})});
  foes.forEach((x,i)=>{const f=B.team[x],a=B.act["f"+i]||actNew();
    spd.push({me:0,n:nm(f.dex),v:effSpd(Math.floor(spdRange(f).max*stg((a.bo||[0,0,0,0,0])[4],0,1)),"them",a.sta,f.abil)})});
  spd.sort((a,b)=>b.v-a.v);

  // la amenaza más grande sobre el Pokémon enfocado
  let worst=null;
  foes.forEach((x,i)=>{const f=B.team[x];
    const r=best(f.dex,myDex(m),{...ctxFor("them"),aItem:f.item,aAb:f.abil,
      dStat:statsOf(m),dAb:m.abil},foeMoves(f));
    if(r&&(!worst||r.R[15]>worst.r.R[15]))worst={r,f}});
  const myHp=Math.floor(myStat(m,0)*(B.hp["m"+fi]??100)/100);
  const wv=worst?verdict(worst.r,myHp):null;
  // Sprint 2.4: qué señal es más probable que cambie la decisión de este
  // turno, primero en Glance — no elige la jugada, ordena qué mirar.
  const alerta=priorityAlert(mine,foes,fi,S1,worst,wv,myHp);

  return `<div class="card d" style="padding:6px">
    <div class="pills">${mine.map((mi,i)=>
      `<button class="p" data-fc="${i}" data-on="${i===fi?1:0}">${esc(nm(myDex(MY[mi])))}</button>`).join("")}
      ${mine.map((mi,i)=>`<span class="p" style="background:none;padding:5px 4px">${B.hp["m"+i]??100}%</span>`).join("")}</div></div>
  ${alerta?`<div class="card f" style="padding:6px 8px"><div class="msg" style="color:var(--cream)">${alerta.texto}</div></div>`:""}
  <div class="card"><span class="hd">Tus ataques<em>qué hace cada uno</em></span>
    ${S1.length?S1.map(x=>{const vd=x.dmg?verdict(x.dmg,x.cur):null;return`<div class="pl"><i class="b">${x.slot+1}</i>
      <b>${esc(mvName(x.k))}${x.tgt?` <span style="color:var(--foe-row)">→ ${esc(x.tgt)}</span>`:""}<s>${esc(x.why)}</s></b>
      <u class="${vd?vd.cls:"no"}">${vd?vd.txt:"apoyo"}</u></div>`}).join("")
      :`<div class="msg">Cargá los movimientos de ${esc(nm(myDex(m)))} en MÍO.</div>`}</div>
  <div class="cols">
    <div class="card f" style="padding:8px"><span class="hd">Te hacen</span>
      ${worst?`<div class="row"><b>${esc(nm(worst.f.dex))}<s>${esc(mvName(worst.r.move))}</s></b>
        <u class="${wv.cls}">${wv.txt}<s>${wv.pct}</s></u></div>`:`<div class="msg">—</div>`}</div>
    <div class="card d" style="padding:8px"><span class="hd">Orden</span>
      ${spd.slice(0,4).map((x,i)=>`<div class="row" style="padding:4px 8px">
        <b style="color:${x.me?"var(--pick)":"var(--foe-row)"}">${i+1}. ${esc(x.n)}</b>
        <u>${Math.abs(x.v)}</u></div>`).join("")}</div></div>`;
}

/* Panel de "quién entra": qué 4 (o menos) propios se llevaron a la partida y
   qué rivales de los 6 de team preview están confirmados en ella (arranca
   en los que se ven activos, se puede sumar más a medida que el rival los
   revela). Grande y arriba de todo mientras no hay nada marcado; una vez que
   hay al menos uno de cada lado, se compacta y baja al final de Campo —
   sigue editable ahí, nunca desaparece del todo. */
function vBrought(){
  const empty=!B.myBrought.length&&!B.team.some(f=>f.brought);
  return `<div class="card d"><span class="hd">Quién entra${empty?"":"<em>tocá para corregir o sumar</em>"}</span>
    <div class="cap">Los que sacó el rival</div>
    <div class="pills">${B.team.map((f,i)=>f.dex?
      `<button class="p" data-brf="${i}" data-on="${f.brought?1:0}">${esc(nm(f.dex))}</button>`:"").join("")}</div>
    <div class="cap" style="margin-top:6px">Los que sacaste vos</div>
    <div class="pills">${MY.map((m,i)=>
      `<button class="p" data-brm="${i}" data-on="${B.myBrought.includes(i)?1:0}">${esc(nm(myDex(m)))}</button>`).join("")}</div>
    ${empty?`<div class="msg" style="margin-top:5px">Marcá quién entró de cada lado. Con eso solo, ya calculo velocidad, daño y amenazas.</div>`:""}</div>`;
}

function vField(){
  const mine=(B.doubles?B.mine:[B.mine[0]]).filter(i=>MY[i]);
  const foes=(B.doubles?B.foe:[B.foe[0]]).filter(i=>B.team[i]?.dex);
  const mineBrought=B.myBrought.length?B.myBrought:mine;
  const foesBrought=broughtFoes().length?broughtFoes():foes;
  const A=k=>B.act[k]||actNew();
  // Un benqueado no tiene "casilla activa" — y no la necesita: las etapas de
  // stat se resetean al cambiar de Pokémon en el juego real, así que
  // calcularlo sin modificadores es lo mecánicamente correcto, no un atajo.
  const actFor=(idx,arr,prefix)=>{const p=arr.indexOf(idx);return p>=0?A(prefix+p):actNew()};

  const brought=vBrought();
  // Se queda arriba hasta completar los 2 rivales (1 en individual) Y los 4
  // propios — no apenas se toca el primero. Angel lo pidió así después de
  // probarlo: bajarlo de golpe al primer toque interrumpe el flujo de
  // marcar los 6 seguidos.
  const needFoes=B.doubles?2:1;
  const showBroughtOnTop=broughtFoes().length<needFoes||B.myBrought.length<4;
  let h=showBroughtOnTop?brought:"";

  h+=`<div class="card d"><span class="hd">Turno ${B.turn}<em>${B.doubles?"dobles":"individual"}</em></span>
    <div class="cols"><div><div class="cap">Tus activos</div>
      ${(B.doubles?[0,1]:[0]).map(i=>`<div style="margin-bottom:3px">${
        sel(mineBrought,B.mine[i],j=>nm(myDex(MY[j])),v=>{B.mine[i]=+v;save()},"Tu activo")}</div>`).join("")}</div>
    <div><div class="cap">Rivales</div>
      ${(B.doubles?[0,1]:[0]).map(i=>`<div style="margin-bottom:3px">${
        sel(foesBrought,B.foe[i],j=>nm(B.team[j].dex)+(B.team[j].out?" ✕":""),
          v=>{B.foe[i]=+v;syncFoe();save()},"Rival en campo")}</div>`).join("")}</div></div></div>`;

  h+=`<div class="cols">
    <div class="card"><span class="hd">Tus PS</span>
      ${mine.map((mi,i)=>hpBar("m"+i,nm(myDex(MY[mi])),B.hp["m"+i]??100)).join("")}</div>
    <div class="card f"><span class="hd">PS rival</span>
      ${foes.map((fi,i)=>hpBar("f"+i,nm(B.team[fi].dex),B.hp["f"+i]??100)).join("")}</div></div>`;

  // estados y etapas del activo elegido
  const keys=[...mine.map((mi,i)=>["m"+i,nm(myDex(MY[mi]))]),...foes.map((fi,i)=>["f"+i,nm(B.team[fi].dex)])];
  const ak=keys.some(k=>k[0]===B.apick)?B.apick:(keys[0]?.[0]||"m0");
  const a=A(ak);
  h+=`<div class="card d"><span class="hd">Estado y etapas</span>
    <div class="pills" style="margin-bottom:5px">${keys.map(([k,n])=>
      `<button class="p" data-ap="${k}" data-on="${k===ak?1:0}">${esc(n)}</button>`).join("")}</div>
    <div class="pills" style="margin-bottom:6px">${STATUS.map(s=>
      `<button class="p" data-sta="${s}" data-on="${(a.sta||"—")===s?1:0}">${s}</button>`).join("")}</div>
    <div class="cols">${BON.map((n,i)=>`<div class="bo"><b>${n}</b><div class="st">
      <button data-bo="${i}" data-d="-1">−</button>
      <u class="${a.bo[i]>0?"up":a.bo[i]<0?"dn":""}">${a.bo[i]>0?"+":""}${a.bo[i]}</u>
      <button data-bo="${i}" data-d="1">+</button></div></div>`).join("")}</div>
    ${a.sta==="quemado"?`<div class="msg w" style="margin-top:4px">Quemado: su daño físico va a la mitad.</div>`:""}
    ${a.sta==="paralizado"?`<div class="msg w" style="margin-top:4px">Paralizado: velocidad a la mitad.</div>`:""}</div>`;

  h+=`<div class="card"><span class="hd">Daño de ida y vuelta<em>→ lo que le hacés · ← lo que te hace</em></span>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:9.5px">
    <tr><td></td>${foesBrought.map(fi=>`<td style="text-align:center;padding:3px;font-weight:800;color:var(--foe-row)">${esc(nm(B.team[fi].dex))}</td>`).join("")}</tr>
    ${mineBrought.map(mi=>{
      const m=MY[mi],am=actFor(mi,mine,"m");
      return `<tr><td style="font-weight:800;padding:3px;color:var(--pick)">${esc(nm(myDex(m)))}</td>${
        foesBrought.map(fi=>{
          const f=B.team[fi],df=actFor(fi,foes,"f");
          const toThem=best(myDex(m),f.dex,{...ctxFor("me"),aStat:statsOf(m),aItem:m.item==="—"?null:m.item,
            aAb:m.abil,aBo:am.bo,aSta:am.sta,dHP:0,dSP:0,dItem:f.item,dAb:f.abil,dBo:df.bo},myMoves(m));
          const fromThem=best(f.dex,myDex(m),{...ctxFor("them"),aItem:f.item,aAb:f.abil,aBo:df.bo,aSta:df.sta,
            dStat:statsOf(m),dAb:m.abil,dBo:am.bo},foeMoves(f));
          const vTo=verdict(toThem,toThem?toThem.maxHP:0),vFrom=verdict(fromThem,fromThem?fromThem.maxHP:0);
          return `<td style="text-align:center;padding:3px"><div class="${vTo.cls}">→${vTo.txt}</div><div class="${vFrom.cls}">←${vFrom.txt}</div></td>`;
        }).join("")}</tr>`;
    }).join("")}
    </table></div>
    ${mineBrought.length&&foesBrought.length?"":`<div class="msg" style="margin-top:5px">Marcá quién entró, más abajo, para ver esta tabla.</div>`}</div>`;

  h+=`<div class="cols">
    <div class="card d"><span class="hd">Velocidad</span>${vSpeed(mine,foes)}</div>
    <div class="card d"><span class="hd">Campo</span>${vChips()}</div></div>`;
  if(!showBroughtOnTop)h+=brought;
  return h;
}

function rowFx(who,sub,v,r,cur){
  let t="";
  if(r&&r.e>0&&cur>0)t=`<div class="track">${r.R.map(x=>
    `<div class="tick${x>=cur?" x":""}" style="left:${Math.min(99,x/cur*100)}%"></div>`).join("")}</div>`;
  return `<div class="row"><b>${esc(who)}<s>${esc(sub)}</s>${t}</b>
    <u class="${v.cls}">${v.txt}<s>${v.pct}</s></u></div>`;
}

function vSpeed(mine,foes){
  const L=[];
  mine.forEach((mi,i)=>{const m=MY[mi],a=B.act["m"+i]||actNew();
    let v=myStat(m,5)*(m.item==="Pañuelo Elección"?1.5:1);
    v=Math.floor(v*stg(a.bo[4],0,1));
    L.push({k:"me",n:nm(myDex(m)),v:effSpd(v,"me",a.sta,m.abil),sure:1,tag:a.sta==="paralizado"?"para":""})});
  foes.forEach((fi,i)=>{const f=B.team[fi],a=B.act["f"+i]||actNew(),r=spdRange(f);
    const lo=Math.floor(r.min*stg(a.bo[4],0,1)),hi=Math.floor(r.max*stg(a.bo[4],0,1));
    L.push({k:"them",n:nm(f.dex),v:effSpd(hi,"them",a.sta,f.abil),lo:effSpd(lo,"them",a.sta,f.abil),
      sure:f.spdSure||f.itemSure,tag:f.item==="Pañuelo Elección"?"Pañuelo":a.sta==="paralizado"?"para":""})});
  L.sort((a,b)=>b.v-a.v);
  return L.map((x,i)=>`<div class="row"><b style="flex:0 0 14px;color:var(--faint)">${i+1}</b>
    <b style="color:${x.k==="me"?"var(--pick)":"var(--foe-row)"}">${esc(x.n)}</b>
    <u class="${x.sure?"cf":""}">${x.lo!==undefined&&shown(x.lo)!==shown(x.v)?shown(x.lo)+"–"+shown(x.v):shown(x.v)}</u>
    ${x.tag?`<span class="p" data-on="1" style="padding:2px 7px">${x.tag}</span>`:""}</div>`).join("")
    +(B.tr>0?`<div class="msg w" style="margin-top:4px">Espacio Raro ${B.tr}: el lento va primero.</div>`:"");
}

function vChips(){
  const c=(k,v,on,l)=>`<button class="p" data-${k}="${v}" data-on="${on?1:0}">${l}</button>`;

    ${["sol","lluvia"].map(x=>c("w",x,B.weather===x,x+(B.weather===x?` <em>${B.wTurns}</em>`:""))).join("")}
    ${["eléctrico","hierba","psíquico"].map(x=>c("t",x,B.terrain===x,x.slice(0,4)+(B.terrain===x?` <em>${B.tTurns}</em>`:""))).join("")}
    ${c("tw","me",B.tw.me>0,"TW vos"+(B.tw.me>0?` <em>${B.tw.me}</em>`:""))}
    ${c("tw","them",B.tw.them>0,"TW rival"+(B.tw.them>0?` <em>${B.tw.them}</em>`:""))}
    ${c("tr","1",B.tr>0,"Esp. Raro"+(B.tr>0?` <em>${B.tr}</em>`:""))}
    ${c("sc","me",B.screen.me>0,"Pant. vos"+(B.screen.me>0?` <em>${B.screen.me}</em>`:""))}
    ${c("sc","them",B.screen.them>0,"Pant. rival"+(B.screen.them>0?` <em>${B.screen.them}</em>`:""))}</div>`;
}

function vFoe(){
  const f=B.team[B.pick],sp=f?S(f.dex):null,m=f?metaOf(f.dex):null;
  let h=`<div class="team">${B.team.map((x,i)=>
    `<button class="mon" data-pick="${i}" data-on="${i===B.pick?1:0}" data-out="${x.out?1:0}">
      <span class="fg">${x.shiny?"✦":(!x.dex||x.confidence<CONF_MIN)?"⚠":x.itemSure?"●":""}</span>
      <b>${esc(nm(x.dex))}</b><s>${S(x.dex)?S(x.dex).s[5]:"—"}</s></button>`).join("")}</div>`;
  if(!f||!sp)return h+`<div class="card f"><div class="msg">Escaneá la vista previa con ↻.</div></div>`;
  const r=spdRange(f),ruledOut=abilitiesRuledOut(B.pick);
  h+=`<div class="cols"><div class="card f"><span class="hd">${esc(sp.n)}<em>${m?m.usage+"%":"sin datos"}</em></span>

      const antes=f.dex;

      f.spdMin=0;f.spdMax=9999;f.spdSure=false;f.bulk=null;syncFoe();
      // Corregir la especie invalida todo lo deducido sobre ese rival. Queda
      // registrado como evento en vez de borrarse en silencio: es la
      // corrección de usuario que `inference.md` §2 llama userCorrection, y
      // es lo que hace que el resto del log siga siendo interpretable.
      logEvent("speciesCorrected",{foe:B.pick,dex:+v,was:antes});
      save()
    },"Corregir especie")}
    ${f.shiny?`<div class="row"><b>Variocolor</b><u class="cf">✦</u></div>`:""}
    ${whyRow("speed","Velocidad",`${r.min}–${r.max}${confTag(f.spdSure?"deducido":"probable")}`,
      f.spdSure?"cf":"",speedHypothesis(B.pick).byEvent)}
    ${whyRow("item","Objeto",f.item
      ?esc(itName(f.item))+confTag(f.itemSure?"visto":itemHypothesis(B.pick).level==="deduced"?"deducido":"probable")
      :"todavía no sabés",f.itemSure?"cf":"no",itemHypothesis(B.pick).byEvent)}
    ${whyRow("abil","Habilidad",f.abil?esc(abilName(f.abil))+confTag("visto"):"todavía no sabés",
      f.abil?"cf":"no",abilityHypothesis(B.pick).byEvent,f.abil&&ABIL_DESC[f.abil])}
    ${!f.abil&&ruledOut.value.length?whyRow("abilRuledOut","Ya sabés que no tiene",
      ruledOut.value.map(k=>esc(abilName(k))).join(", "),"",ruledOut.byEvent):""}

      `PS ${f.bulk.hp[0]}–${f.bulk.hp[1]} · Def ${f.bulk.df[0]}–${f.bulk.df[1]}${confTag("deducido")}`,"cf",f.bulk.byEvent):""}</div>
  <div class="card d"><span class="hd">Anotá lo que viste<em>cuanto más marques, mejor calcula</em></span><div class="pills">
      <button class="p" data-obs="fast">Se movió antes</button>

      ${MY.some(x=>x.abil==="intimidate")?`<button class="p" data-obs="intimidateHit">Le bajó el Ataque con Intimidación</button>`:""}</div>
    <div class="cap" style="margin-top:7px">Deducir lo que aguanta</div>
    <div class="f3">${sel(MY.map((m,j)=>j),B.obs.a,j=>nm(myDex(MY[j])),v=>{B.obs.a=+v;save()},"Con cuál")}
    ${sel(dmgPool(myDex(MY[B.obs.a]||MY[0])),B.obs.m,mvName,v=>{B.obs.m=v;save()},"Con qué movimiento",decoMove)}

  h+=`<div class="card"><span class="hd">Habilidad<em>tocá la que confirmes</em></span><div class="pills">${
    abilsOf(f.dex).map(ab=>{const out=ruledOut.value.includes(ab);
      return `<button class="p" data-fab="${esc(ab)}" data-on="${f.abil===ab?1:0}"${
        out?' style="opacity:.45;text-decoration:line-through"':""}>${esc(abilName(ab))}${
      (m?.abilities||[]).find(x=>x[0]===ab)?`<em>${(m.abilities.find(x=>x[0]===ab))[1]}%</em>`:""}</button>`}).join("")}</div>
    ${f.abil==="intimidate"?`<div class="msg w" style="margin-top:5px">Al entrar baja −1 el Ataque de tus dos activos. Marcalo en CAMPO → Estado y etapas.</div>`:""}</div>`;
  if(m){
    h+=`<div class="cols"><div class="card"><span class="hd">Objetos que suele llevar${confTag("probable")}</span><div class="pills">${
      m.items.map(([i,p])=>`<button class="p" data-item="${esc(i)}" data-on="${f.item===i?1:0}">${esc(i)}<em>${p}%</em></button>`).join("")}</div></div>
    <div class="card"><span class="hd">Ataques que suele llevar${confTag("probable")}</span><div class="pills">${
      m.moves.map(([i,p])=>`<button class="p" data-mvk="${esc(i)}" data-on="${f.moves.includes(i)?1:0}">${esc(i)}<em>${p}%</em></button>`).join("")}</div></div></div>`;
    if((m.topNatures||[]).length||(m.topEvSpreads||[]).length){
      // Sprint 2.7 (roadmap.md, cruce con Champions Battle Data): naturaleza
      // y reparto de EVs son dos rankings INDEPENDIENTES en la fuente real
      // -- nunca vienen como pares. Mostrarlos juntos en una fila (como
      // hacía el diseño viejo con m.spreads, nunca poblado de verdad)
      // inventaría una combinación que el dato no sostiene. Van separados,
      // con la marca "○" de prior de meta (product.md, sistema de
      // confianza) — nunca ◆ Deducido, architecture.md §10.1.1.
      h+=`<div class="card"><span class="hd">Cómo suele venir${confTag("probable")}</span>
        ${(m.topNatures||[]).slice(0,3).map(n=>`<div class="row"><b>${esc(n.name)}${
          n.statUp?`<s>↑${esc(n.statUp)} ↓${esc(n.statDown)}</s>`:""}</b><u>${n.pct}%</u></div>`).join("")}
        ${(m.topEvSpreads||[]).slice(0,3).map(s=>`<div class="row"><b>${s.sp.join("/")}<s>PS/Atq/Def/AtqEsp/DefEsp/Vel</s></b><u>${s.pct}%</u></div>`).join("")}
        <div class="msg" style="margin-top:5px">La naturaleza y el reparto se miden por separado: que los dos sean los más comunes no significa que vayan juntos.</div></div>`;
    }
    if(m.sets){
      const cs=compatibleSets(f);
      h+=`<div class="card"><span class="hd">Combinaciones completas<em>${
        f.moves.filter(x=>MV[x]).length?`quedan ${cs.length} de ${m.sets.length}`:"las que más se repiten en torneo"}</em>${confTag("probable")}</span>
        ${cs.map(s=>`<div class="row"><b>${s.moves.map(k=>esc(mvName(k))).join(" · ")}</b><u>${s.pct}%</u></div>`).join("")}
        ${!cs.length?`<div class="msg">Ninguna combinación conocida incluye todo lo que ya le viste. Debe estar usando algo fuera de lo común.</div>`:""}</div>`;
    }
  }
  h+=vMovesPP(f);
  h+=vEvidence(B.pick);
  return h;
}

/** PP y efecto de los movimientos ya vistos (Fase 2, sprint 2.5,
    `architecture.md` §11.2). Decidido por Angel el 2026-08-03: se muestra
    para TODOS los movimientos vistos, no solo los "clave" — el ruido en
    Glance lo resuelve el motor de prioridad (`decisions.md` #21), no
    recortar el dato acá. El PP es manual (no hay forma de leerlo de
    pantalla): un tap resta 1, mismo espíritu que "Se movió antes/después".
    Sin dex.json cargado no hay PP máximo — se muestra el efecto igual, sin
    el contador, en vez de fingir un número. */
function vMovesPP(f){
  if(!f.moves.length)return "";
  return `<div class="card"><span class="hd">Ataques que le viste<em>tocá uno para ver qué hace</em>${confTag("visto")}</span>
    ${f.moves.map(k=>{
      const d=mv(k);
      const openKey="mv_"+k;
      const open=WHY_OPEN[openKey];
      const used=f.ppUsed[k]||0;
      const max=d&&d.pp;
      const left=max?Math.max(0,max-used):null;
      return `<div class="row" data-why="${esc(openKey)}" style="cursor:pointer">
          <b>${esc(mvName(k))}${open?`<s>${esc(d&&d.note||"sin descripción cargada")}</s>`:""}</b>
          <u>${max?`${left}/${max}`:"PP ?"}</u></div>
        ${max?`<div class="pills" style="margin:-2px 0 6px">
          <button class="p" data-pp="${esc(k)}" data-d="-1">−1 usado</button>
          <button class="p" data-pp="${esc(k)}" data-d="1">+1</button></div>`:""}`;
    }).join("")}</div>`;
}

/* ── Registro de evidencia (Fase 2, sprint 2.1) ──
   Lo observado sobre un rival, en orden, tal como quedó en el event log.
   Son HECHOS, no deducciones: acá no se interpreta nada. La cadena
   "evento → hipótesis descartada" llega en el sprint 2.2 (`inference.md`). */
function vEvidence(i){
  const evs=visibleEvents(i);
  if(!evs.length)return `<div class="card d"><span class="hd">Qué observamos</span>
    <div class="msg">Todavía nada de este rival. Lo que marques acá arriba —
    movimientos, objeto, orden de velocidad, daño — queda acá para repasarlo.</div></div>`;
  return `<div class="card d"><span class="hd">Lo que viste<em>${evs.length} ${evs.length===1?"anotación":"anotaciones"}</em></span>
    ${evs.map(e=>`<div class="row"><b>T${e.turn}<s>${describeEvent(e)}</s></b>${
      UNDOABLE.has(e.kind)?`<button class="ico" data-undo="${e.id}" title="Deshacer">↺</button>`:""}</div>`).join("")}
    <div class="msg" style="margin-top:5px">Todo lo que marcaste, en orden. Si te equivocaste en algo, tocá ↺ y se corrige.</div></div>`;
}

/** Chips de los 12 de la partida (tus 6 + los 6 del rival) para elegir de un
    toque, en vez de tipear en la lista completa de la Pokédex — la lista
    completa sigue disponible debajo, como escape hatch. */
function quickPickChips(side,current){
  const chip=(d,cls)=>`<button class="qp ${cls}" data-cpick="${side}:${d}" data-on="${d===current?1:0}">${esc(nm(d))}</button>`;
  const mine=MY.filter(m=>m.dex&&S(myDex(m))).map(m=>chip(myDex(m),"")).join("");
  const foes=B.team.filter(f=>f.dex&&S(f.dex)).map(f=>chip(f.dex,"")).join("");
  // Las dos filas eran visualmente idénticas: sin etiqueta, no se sabía cuál
  // era tu equipo y cuál el del rival — sobre todo usando CALC fuera de
  // combate, donde el "rival" puede ser el equipo de ejemplo.
  return `<div class="cap" style="margin-top:3px">Tuyos</div><div class="qprow">${mine}</div>
    <div class="cap" style="margin-top:3px">Rivales</div><div class="qprow">${foes}</div>`;
}

    <div class="msg" style="margin-top:4px">${c.field==="neutral"
      ?"Cuenta limpia, sin clima ni pantallas — para armar equipo fuera de combate."
      :"Usa el clima, el terreno y las pantallas que marcaste en CAMPO."}</div>
    ${B.doubles&&mv(c.move)?.sp?`<div class="msg" style="margin-top:5px">Formato Dobles (Ajustes) y este movimiento pega a los dos rivales: el daño ya viene con el ×0.75 de repartirlo.</div>`:""}</div>
  ${CALC_HISTORY.length?`<div class="card d"><span class="hd">Comparar<em>se pierde al recargar la app</em></span>${
    CALC_HISTORY.map(h=>`<div class="row"><b>${esc(h.atk)} → ${esc(h.def)}<s>${esc(h.move)}</s></b>
      <u class="${h.v.cls}">${h.v.txt}<s>${h.v.pct}</s></u>
      <button class="p" data-cdel="${h.id}" style="margin-left:4px">✕</button></div>`).join("")}</div>`:""}`;
}

/* ═════ EVENTOS ═════ */
function wire(){
  const on=(s,f)=>document.querySelectorAll(s).forEach(e=>e.onclick=()=>{keep();buzz(1);f(e);save();render()});
  const ch=(s,f)=>document.querySelectorAll(s).forEach(e=>e.onchange=()=>{keep();f(e);save();render()});

  // abrir la hoja de opciones
  document.querySelectorAll("[data-sel]").forEach(e=>e.onclick=()=>{
    keep();buzz(1);PICK=REG[e.dataset.sel];render()});
  // elegir una opción
  document.querySelectorAll("[data-op]").forEach(e=>e.onclick=()=>{
    keep();buzz(1);
    const P=PICK; if(!P)return;
    const v=P.list[+e.dataset.op];
    PICK=null; P.apply(v); render()});
  document.querySelectorAll("[data-shx]").forEach(e=>e.onclick=()=>{
    buzz(1);PICK=null;render()});
  document.querySelectorAll("[data-jump]").forEach(e=>e.onclick=()=>{
    buzz(0);
    const t=document.querySelector(`[data-ini="${e.dataset.jump}"]`);
    if(t)t.scrollIntoView({block:"start",behavior:"smooth"})});
  on("[data-pick]",e=>B.pick=+e.dataset.pick);
  on("[data-mp]",e=>B.mpick=+e.dataset.mp);
  on("[data-mega]",()=>{const m=MY[B.mpick];m.mega=!m.mega;
    // Al cambiar de forma, la habilidad elegida puede dejar de existir para
    // esa forma (ej. Torrent no es una habilidad real de Mega Swampert) —
    // se recalcula sola en vez de dejar guardada una habilidad que ya no
    // corresponde.
    if(!abilsOf(myDex(m)).includes(m.abil))m.abil=abilsOf(myDex(m))[0];
    saveMy()});
  on("[data-fc]",e=>B.focus=+e.dataset.fc);
  on("[data-ap]",e=>B.apick=e.dataset.ap);
  on("[data-sta]",e=>{const k=B.apick;B.act[k]=B.act[k]||actNew();
    const v=e.dataset.sta;B.act[k].sta=v==="—"?null:v});
  on("[data-bo]",e=>{const k=B.apick;B.act[k]=B.act[k]||actNew();
    const i=+e.dataset.bo,d=+e.dataset.d;
    B.act[k].bo[i]=Math.max(-6,Math.min(6,B.act[k].bo[i]+d))});

  on("[data-w]",e=>{const v=e.dataset.w;B.weather=B.weather===v?null:v;B.wTurns=B.weather?5:0});
  on("[data-t]",e=>{const v=e.dataset.t;B.terrain=B.terrain===v?null:v;B.tTurns=B.terrain?5:0});
  on("[data-tw]",e=>{const s=e.dataset.tw;B.tw[s]=B.tw[s]>0?0:4});
  // "Qué pasaría si" de velocidad (Previa): SPD_WHATIF, no B/MY — nunca pasa
  // por logEvent ni saveMy(), es una prueba de esta pantalla, no un hecho.
  on("[data-wtw]",e=>{const[side,i]=e.dataset.wtw.split(":");
    const t=side==="m"?whatIfMine(+i):whatIfFoe(+i);t.tw=!t.tw});
  on("[data-wsc]",e=>{whatIfFoe(+e.dataset.wsc).scarf=!whatIfFoe(+e.dataset.wsc).scarf});
  on("[data-wst]",e=>{const[side,i,d]=e.dataset.wst.split(":");
    const t=side==="m"?whatIfMine(+i):whatIfFoe(+i);
    t.stage=Math.max(-6,Math.min(6,t.stage+(+d)))});
  on("[data-tr]",()=>B.tr=B.tr>0?0:5);
  on("[data-sc]",e=>{const s=e.dataset.sc;B.screen[s]=B.screen[s]>0?0:5});
  on("[data-fmt]",e=>{B.doubles=e.dataset.fmt==="1";syncFoe()});
  on("[data-lang]",e=>{LANG=e.dataset.lang;try{localStorage.setItem("hudLang",LANG)}catch(x){}});
  on("[data-ocrt]",e=>{OCR_TARGET=e.dataset.ocrt;
    try{localStorage.setItem("hudOcrTarget",OCR_TARGET)}catch(x){}});
  on("[data-spdview]",e=>{SPD_VIEW=e.dataset.spdview;
    try{localStorage.setItem("hudSpdView",SPD_VIEW)}catch(x){}});
  on("[data-why]",e=>{const k=e.dataset.why;WHY_OPEN[k]=!WHY_OPEN[k]});
  on("[data-undo]",e=>undoEvent(+e.dataset.undo));
  on("[data-pp]",e=>{const k=e.dataset.pp,d=+e.dataset.d,f=B.team[B.pick];if(!f)return;
    const max=(mv(k)||{}).pp||99;
    f.ppUsed[k]=Math.max(0,Math.min(max,(f.ppUsed[k]||0)+d))});
  on("[data-item]",e=>{const f=B.team[B.pick],v=e.dataset.item;
    f.item=f.item===v?null:v;f.itemSure=!!f.item;
    logEvent(f.item?"itemRevealed":"itemCleared",{foe:B.pick,dex:f.dex,item:v})});
  on("[data-fab]",e=>{const f=B.team[B.pick],v=e.dataset.fab;
    f.abil=f.abil===v?null:v;
    logEvent(f.abil?"abilityRevealed":"abilityCleared",{foe:B.pick,dex:f.dex,ability:v})});
  on("[data-brf]",e=>{const i=+e.dataset.brf,f=B.team[i];f.brought=!f.brought;syncActiveFoe();
    logEvent(f.brought?"brought":"broughtCleared",{foe:i,dex:f.dex})});
  on("[data-brm]",e=>{const i=+e.dataset.brm,p=B.myBrought.indexOf(i);
    if(p>=0)B.myBrought.splice(p,1);
    else if(B.myBrought.length<4)B.myBrought.push(i);
    syncActiveMine()});
  on("[data-mvk]",e=>{const f=B.team[B.pick],v=e.dataset.mvk,i=f.moves.indexOf(v);
    i<0?f.moves.push(v):f.moves.splice(i,1);
    logEvent(i<0?"moveSeen":"moveCleared",{foe:B.pick,dex:f.dex,move:v})});
  on("[data-obs]",e=>{const f=B.team[B.pick],k=e.dataset.obs;
    if(k==="out"){f.out=!f.out;syncFoe();
      logEvent(f.out?"ko":"revived",{foe:B.pick,dex:f.dex});return}
    if(k==="intimidateHit"){
      // R4 (inference.md §5): entró un propio con Intimidación y el Ataque
      // de ESTE rival SÍ bajó (el comportamiento normal, sin bloqueo) -- eso
      // descarta las habilidades que lo hubieran bloqueado en silencio (si
      // tuviera Cuerpo Puro, por ejemplo, la bajada no se habría visto). No
      // muta ningún campo del rival, ver abilitiesRuledOut().
      logEvent("abilityNoTrigger",{foe:B.pick,dex:f.dex,trigger:"intimidate"});return}
    const m=MY[B.mine[0]];if(!m)return;
    const a=B.act.m0||actNew();
    const eff=effSpd(myStat(m,5),"me",a.sta,m.abil);
    observeOrder(f,eff,k==="fast");
    // El "contra qué velocidad" es parte del hecho: sin él, "se movió antes"
    // no se puede volver a evaluar si después se corrige el equipo propio.
    logEvent("order",{foe:B.pick,dex:f.dex,faster:k==="fast",
      vs:{dex:myDex(m),eff:shown(eff)},
      spdMin:f.spdMin,spdMax:f.spdMax,item:f.itemSure?f.item:null})});


  document.querySelectorAll("input[type=range]").forEach(inp=>{
    let last=+inp.value;
    inp.oninput=()=>{
      let v=+inp.value;
      // Tope duro de 66 SP en total: la barra se frena sola en lo que quede
      // libre, así no hay que hacer la cuenta a mano.
      if(inp.dataset.sp!==undefined){
        const m=MY[B.mpick], i=+inp.dataset.sp;
        const otros=m.sp.reduce((a,b,j)=>a+(j===i?0:b),0);
        const techo=Math.min(SP_MAX,SP_POOL-otros);
        if(v>techo){v=techo;inp.value=techo;if(last===techo)return;buzz(1)}
      }
      if(v===last)return;last=v;buzz(0);keep();
      const box=inp.closest(".hpwrap"),spb=inp.closest(".bar");
      if(box){box.querySelector(".hpfill").style.width=v+"%";
        box.querySelector(".knob").style.left=v+"%";
        const w=box.closest(".hpbox");w.querySelector(".hplab u").textContent=v+"%";
        w.className="hpbox "+(v<=25?"crit":v<=50?"low":"")}
      // CALC (data-cev) reusa el mismo widget visual (.sp/.bar/.bg/.fl) que
      // "Reparto de puntos" en TUYO (data-sp) — mismo `.closest(".bar")`, así
      // que hay que distinguirlos explícitamente. Sin esto, mover un slider
      // de CALC pisaba el reparto real del Pokémon en pantalla (B.mpick).
      if(spb&&inp.dataset.sp!==undefined){
        spb.querySelector(".fl").style.width=(v/SP_MAX*100)+"%";
        MY[B.mpick].sp[+inp.dataset.sp]=v;
        const q=document.querySelector("#spLeft");
        if(q)q.textContent="quedan "+(SP_POOL-MY[B.mpick].sp.reduce((a,b)=>a+b,0));
        spb.parentElement.querySelector("u").innerHTML=
          v+' <s style="display:inline;text-decoration:none;color:var(--pick)">'+myStat(MY[B.mpick],+inp.dataset.sp)+"</s>"
      }else if(spb&&inp.dataset.cev){
        spb.querySelector(".fl").style.width=(v/SP_MAX*100)+"%";
        window.__c[inp.dataset.cev]=v;
        spb.parentElement.querySelector("u").textContent=v;
      }
    };
    inp.onchange=()=>{buzz(1);
      if(inp.dataset.hp){const k=inp.dataset.hp;
        if(k==="calc")window.__c.cur=+inp.value;else B.hp[k]=+inp.value;save();render()}
      if(inp.dataset.sp){saveMy();render()}
      if(inp.dataset.cev)render()};
  });

  const g=$("#oGo");if(g)g.onclick=()=>{keep();buzz(1);
    const f=B.team[B.pick],m=MY[B.obs.a]||MY[0];
    const res=solveBulk(myDex(m),f.dex,B.obs.m,B.obs.p,
      {...ctxFor("me"),doubles:B.doubles,aStat:statsOf(m),aItem:m.item==="—"?null:m.item,aAb:m.abil});
    // El daño observado es un hecho; lo que solveBulk() deduce de él es una
    // inferencia. Se registra el hecho SIEMPRE — también cuando no cierra
    // con ningún reparto, que es justamente el caso más informativo.
    const ev=logEvent("damage",{foe:B.pick,dex:f.dex,move:B.obs.m,pct:B.obs.p,
      by:{dex:myDex(m)},ok:!!res.ok,
      ...(res.ok?{n:res.n,hp:res.hp,df:res.df}:{})});
    if(!res.ok)$("#oOut").textContent="Ningún reparto normal da ese número: sospechá de baya de resistencia, pantalla o crítico.";
    else{ f.bulk={...res,byEvent:ev.id};   // queda anclado: el HUD lo recuerda el resto del combate
      $("#oOut").textContent=`${res.n} repartos posibles. PS ${res.hp[0]}–${res.hp[1]} SP, defensa ${res.df[0]}–${res.df[1]} SP. Anclado.`}
    save()};

  on("[data-c2]",e=>window.__c[e.dataset.c2]=window.__c[e.dataset.c2]?0:1);
  on("[data-cfield]",e=>{if(window.__c)window.__c.field=e.dataset.cfield});
  // "Duplicar" (docs/calc.md §5, pedido de Angel 2026-08-11): congela el
  // resultado actual como una fila de comparación. CALC_HISTORY es
  // deliberadamente temporal — nunca pasa por save(), así que sobrevive
  // cambiar de pestaña pero se pierde al recargar la app.
  on("#cDup",()=>{const c=window.__c;if(!c)return;
    const{r,cur}=calcResolve(c);
    CALC_HISTORY.push(calcSnapshot(nm(c.atk),nm(c.def),mvName(c.move),r,cur))});
  on("[data-cdel]",e=>{CALC_HISTORY=CALC_HISTORY.filter(h=>h.id!==+e.dataset.cdel)});
  // CALC (docs/calc.md): chip de uno de los 12 de la partida — un toque en
  // vez de tipear en la lista completa. Cambiar de Pokémon resetea el
  // override de objeto/habilidad: el que estaba tipeado a mano era para el
  // Pokémon anterior, no tiene sentido arrastrarlo al nuevo.
  on("[data-cpick]",e=>{const[side,d]=e.dataset.cpick.split(":"),c=window.__c;if(!c)return;
    if(side==="a"){c.atk=+d;c.aItemOv=null;c.aAbOv=null;c.aStaOv=null}
    else{c.def=+d;c.dItemOv=null;c.dAbOv=null}});
  on("[data-cswap]",()=>{const c=window.__c;if(!c)return;
    [c.atk,c.def]=[c.def,c.atk];
    [c.aSP,c.dSP]=[c.dSP,c.aSP]; // el HP del defensor no tiene equivalente del lado ofensivo, no se cruza
    [c.aNat,c.dNat]=[c.dNat,c.aNat];
    [c.aItemOv,c.dItemOv]=[c.dItemOv,c.aItemOv];
    [c.aAbOv,c.dAbOv]=[c.dAbOv,c.aAbOv];
    // El estado alterado no tiene campo del lado defensor (no hay mecánica de
    // "dSta" — quemadura/parálisis no cambian el daño RECIBIDO). Al invertir,
    // no hay con qué cruzarlo: vuelve a auto-detectar para el nuevo atacante.
    c.aStaOv=null;
    if(!dmgPool(c.atk).includes(c.move))c.move=dmgPool(c.atk)[0]||c.move});

  const to=$("#tOcr");if(to)to.onclick=()=>{keep();buzz(1);
    if(has)Android.scanOwnTeam();
    else $("#body").insertAdjacentHTML("afterbegin",
      `<div class="card f"><div class="msg w">Solo funciona dentro de la app.</div></div>`)};
  const tg=$("#tGo");if(tg)tg.onclick=()=>{keep();buzz(1);
    const raw=$("#tPaste").value;
    if(!raw.trim()){$("#tOut").textContent="Pegá un equipo primero.";return}
    const {team,errors}=parseTeamText(raw);
    if(!team.length){$("#tOut").innerHTML=`<span style="color:var(--warn)">No pude leer ningún Pokémon.<br>${errors.map(esc).join("<br>")}</span>`;return}
    MY=team.concat(MY.slice(team.length));
    activeTeam().team=MY; // el paste reasigna MY entero: hay que re-enlazarlo al equipo activo
    B.mpick=0; saveMy();
    // render() reconstruye #body entero (limpia el textarea a propósito) —
    // el mensaje de resultado hay que escribirlo DESPUÉS, sobre el DOM nuevo.
    render();
    const out=$("#tOut");
    if(out)out.innerHTML=(errors.length
      ?`<span style="color:var(--warn)">Cargué ${team.length}, con avisos:<br>${errors.map(esc).join("<br>")}</span>`
      :`<span style="color:var(--pick)">Cargué ${team.length} Pokémon sin problemas.</span>`);
    return};

  const tn=$("#tNew");if(tn)tn.onclick=()=>{keep();buzz(1);
    const id=newTeamId(),team=defaultTeam();
    TEAMS.push({id,name:"Equipo "+(TEAMS.length+1),team});
    ACTIVE_ID=id;MY=team;B.mpick=0;saveMy();render()};
  const td=$("#tDup");if(td)td.onclick=()=>{keep();buzz(1);
    const at=activeTeam(),id=newTeamId(),team=JSON.parse(JSON.stringify(at.team));
    TEAMS.push({id,name:at.name+" (copia)",team});
    ACTIVE_ID=id;MY=team;B.mpick=0;saveMy();render()};
  // Borrar es destructivo y no hay diálogo de confirmación en esta app (no
  // funcionan bien con el panel FLAG_NOT_FOCUSABLE) — mismo patrón que ya
  // usa el botón de turno: mantener apretado, no un solo toque.
  const tdel=$("#tDel");if(tdel){let hold=0;
    tdel.onpointerdown=()=>{hold=setTimeout(()=>{hold=0;buzz(1);
      if(TEAMS.length<=1)return;
      TEAMS=TEAMS.filter(t=>t.id!==ACTIVE_ID);
      ACTIVE_ID=TEAMS[0].id;MY=TEAMS[0].team;B.mpick=0;saveMy();render()},900)};
    tdel.onpointerup=tdel.onpointercancel=()=>{if(hold)clearTimeout(hold)}}
  const tren=$("#tRen");if(tren)tren.onclick=()=>{keep();buzz(1);
    const v=$("#tName").value.trim();
    if(v)activeTeam().name=v;
    saveMy();render()};
  /* Una sola función para los dos botones: el automático usa DATA_URL, el
     manual usa lo que haya en el campo. El puente de Android es el mismo —
     `updateMeta` distingue solo por el contenido de lo que baja (un
     manifest.json actualiza los tres archivos, un meta.json suelto sigue
     funcionando como antes). */
  const actualizarDatos=u=>{
    if(!u){$("#mOut").textContent="Pegá una URL primero.";return}
    $("#mOut").textContent="Buscando…";
    has?Android.updateMeta(u):$("#mOut").textContent="Solo dentro de la app.";
  };
  const mg=$("#mGo");if(mg)mg.onclick=()=>{keep();buzz(1);
    actualizarDatos($("#mU").value.trim())};
  const ma=$("#mAuto");if(ma)ma.onclick=()=>{keep();buzz(1);actualizarDatos(DATA_URL)};
  const rt=$("#rt");if(rt)rt.onclick=()=>{keep();buzz(1);resetTurns()};
  const rs=$("#rs");if(rs)rs.onclick=()=>{keep();buzz(1);
    const t=B.team,newTeam=t.map(f=>mkFoe(f.dex,f.confidence,f.shiny));
    // Combate nuevo, mismo rival (Bo3, inference.md §9): antes de pisar B
    // se rescata lo confirmado del juego que termina.
    const carried=carryToNextGame(t,newTeam);
    B=NEW();B.team=newTeam;syncFoe();
    carried.forEach(ev=>logEvent(ev.kind,ev));
    resetSpdWhatIf();
    if(has)try{Android.clearBattle()}catch(e){} save();render()};
}

document.querySelectorAll(".rail .tab").forEach(b=>b.onclick=()=>{
  keep();buzz(1);B.tab=b.dataset.tab;save();render()});
$("#bTurn").onclick=()=>{keep();buzz(1);B.turn++;
  const d=x=>Math.max(0,x-1);
  B.wTurns=d(B.wTurns);if(!B.wTurns)B.weather=null;
  B.tTurns=d(B.tTurns);if(!B.tTurns)B.terrain=null;
  B.tw.me=d(B.tw.me);B.tw.them=d(B.tw.them);B.tr=d(B.tr);
  B.screen.me=d(B.screen.me);B.screen.them=d(B.screen.them);
  save();render()};
$("#bZip").onclick=()=>{keep();buzz(1);B.compact=!B.compact;save();render()};
$("#bPin").onclick=()=>{buzz(1);B.pinned=!B.pinned;
  if(has)try{Android.pin(B.pinned)}catch(e){} save();render()};
$("#bScan").onclick=()=>{keep();buzz(1);if(has)Android.rescan()};
$("#bShut").onclick=()=>{buzz(1);if(has)try{Android.close()}catch(e){}};

window.onScan=function(json){
  let d;try{d=JSON.parse(json)}catch(e){return}
  if(d.error){$("#body").insertAdjacentHTML("afterbegin",
    `<div class="card f"><div class="msg w">${esc(d.error)}</div></div>`);return}
  if(!d.team?.length)return;
  B.team=d.team.map(x=>mkFoe(x.dex,x.confidence,x.shiny));
  resetSpdWhatIf();
  // Un team preview nuevo es una partida nueva: los índices `foe` del log
  // anterior apuntarían a otros Pokémon. Se reinicia y el primer evento es
  // la lectura misma — reinterpretar evidencia vieja contra un equipo
  // distinto sería peor que no tenerla.
  B.log=[];
  logEvent("teamPreview",{team:B.team.map(f=>f.dex),quality:d.quality??null});
  B.pick=0;B.foe=[0,1];syncFoe();buzz(1);save();
  // Son DOS preguntas distintas y antes se mezclaban en un solo "calidad 98%":
  //   1. ¿Encontré el panel?      → d.quality, geometría de la pila de tarjetas
  //   2. ¿Reconocí cada especie?  → f.confidence, una por tarjeta
  // La calidad da alto casi siempre que el panel esté a la vista, así que
  // mostrarla como si hablara del reconocimiento hacía que un acierto y un
  // error se leyeran igual — que es justo lo que reportó Angel: "calidad 98%"
  // con dos especies equivocadas de seis. Ahora cada pregunta se responde por
  // separado y, cuando hay dudas, se dice CUÁLES (decisión #24).
  const q=d.quality||0;
  const panelOk=q>=0.7&&B.team.length>=5;
  // Sin `dex` = SpriteMatcher descartó el recorte por implausible; con dex pero
  // poca confianza = otra especie encajaba casi igual de bien. Las dos piden lo
  // mismo del jugador (mirar y corregir), así que van juntas.
  const dudosos=B.team.map((f,i)=>({f,i})).filter(x=>!x.f.dex||x.f.confidence<CONF_MIN);
  const ok=panelOk&&!dudosos.length;
  B.tab=ok?"pre":"foe";
  render();
  if(!ok){
    const detalle=B.team.map((f,i)=>`${i+1}:${f.dex||"—"}/${Math.round((f.confidence||0)*100)}%`).join(" ");
    $("#body").insertAdjacentHTML("afterbegin", !panelOk
      ?`<div class="card f"><span class="hd">No encontré el panel del rival</span>
        <div class="msg w">Escaneá en la pantalla de elegir 4, con la burbuja del HUD fuera de la franja derecha.</div>
        ${dbg("OCR-05",`calidad de panel ${Math.round(q*100)}% (mínimo 70%) · ${B.team.length} tarjetas`)}</div>`
      :`<div class="card f"><span class="hd">Revisá ${dudosos.length} de ${B.team.length}<em>al resto lo leí bien</em></span>
        <div class="msg w">${esc(dudosos.map(x=>x.f.dex?`${x.i+1}. ${nm(x.f.dex)}`:`${x.i+1}. sin leer`).join(" · "))}
        — tocá cada uno acá abajo y corregí la especie.</div>
        ${dbg("OCR-06",detalle)}</div>`);
  }
};
window.onOwnScan=function(json){
  buzz(1);
  let d;try{d=JSON.parse(json)}catch(e){
    render();$("#body").insertAdjacentHTML("afterbegin",
      `<div class="card f"><span class="hd">No pude leer la pantalla</span>
       <div class="msg w">Probá de nuevo. Si sigue igual, cerrá y volvé a abrir el HUD.</div>
       ${dbg("OCR-02",(e&&e.message||e)+" · respuesta: "+String(json).slice(0,180))}</div>`);
    return}
  if(d.error){render();$("#body").insertAdjacentHTML("afterbegin",
    `<div class="card f"><span class="hd">No pude leer la pantalla</span>
     <div class="msg w">Probá de nuevo con el HUD corrido de las tarjetas.</div>
     ${dbg("OCR-03",d.error)}</div>`);return}
  const nlines=(d.lines||[]).length;
  if(!nlines){
    render();$("#body").insertAdjacentHTML("afterbegin",
      `<div class="card f"><span class="hd">No encontré texto</span>
       <div class="msg w">Movete el HUD para que no tape las tarjetas y subí el brillo de la pantalla.</div>
       ${dbg("OCR-01","0 líneas reconocidas · imagen "+(d.w||"?")+"×"+(d.h||"?"))}</div>`);
    return;
  }
  const cards=clusterCards(d.lines,d.w,d.h);
  if(OCR_PHASE===0){
    OCR_DRAFT[0]=cards.map(parseMovesCard);
    // Sprites por línea (SpriteMatcher.readOwnTeamIcons, ver el comentario
    // grande ahí) — solo interesan en esta pasada, es donde vive el nombre de
    // la especie. Un dispositivo sin este campo (versión vieja del APK antes
    // de recompilar) simplemente da OCR_ICONS=[] y todo sigue como antes.
    OCR_ICONS=d.icons||[];
    OCR_PHASE=1; render();
    // Diagnóstico del paso 1: muestra los campos YA PARSEADOS por tarjeta,
    // no las líneas crudas. Así se ve de una si cada texto cayó en el campo
    // que le toca (que es donde estuvo el bug las tres primeras veces) sin
    // tener que esperar al paso 2 para enterarse.
    const marca=(t,fn)=>t?(fn(t)?esc(t):`<span style="color:var(--warn)">${esc(t)}?</span>`):"—";
    const sample=OCR_DRAFT[0].map((d,i)=>{
      if(!d||!d.dexName)return `${i+1}: <span style="color:var(--warn)">(vacía)</span>`;
      const mv=(d.moveNames||[]).map(n=>marca(n,findMove)).join(", ")||"—";
      return `${i+1}: ${marca(d.dexName,findSpecies)} · ${marca(d.abilName,findAbility)}
        · ${marca(d.itemName,findItem)}<br><s style="opacity:.75">${mv}</s>`;
    }).join("<br>");
    $("#body").insertAdjacentHTML("afterbegin",
      `<div class="card"><span class="hd">Esto leí<em>ahora cambiá a Stats y tocá otra vez</em></span>
       <div class="msg">${sample}</div>
       <div class="msg" style="margin-top:5px;opacity:.7">Lo que tiene «?» no lo pude reconocer — lo podés corregir a mano después.</div>
       ${dbg("OCR-DIAG-1",nlines+" líneas · "+cards.length+" tarjetas detectadas")}</div>`);
  }else{
    OCR_DRAFT[1]=cards.map(parseStatsCard);
    OCR_PHASE=0;
    // Diagnóstico del paso 2, con el mismo criterio que el del paso 1: si
    // alguna tarjeta no dio reparto, mostrar las líneas NUMÉRICAS que sí se
    // leyeron de ella. Sin esto, "no pude leer el reparto" no dice si el
    // problema fue el OCR, el recorte de la tarjeta o el parseo.
    const falladas=OCR_DRAFT[1].map((s,i)=>s?null:i).filter(i=>i!==null);
    let diag="";
    if(falladas.length){
      diag=`<div class="card f"><span class="hd">No saqué el reparto de ${falladas.length}<em>los podés cargar a mano</em></span>
        <div class="msg">${falladas.map(i=>{
          // Todas las líneas, no solo las numéricas: las no numéricas son las
          // etiquetas y —si ML Kit llega a devolverlas— las flechas de
          // naturaleza, que es justo lo que hace falta saber.
          const todas=(cards[i]||[]).map(l=>esc(l.t));
          const muestra=todas.slice(0,12).join(" | ")||"(sin texto)";
          return `${i+1}: ${muestra}${todas.length>12?` …+${todas.length-12}`:""}`;
        }).join("<br>")}</div>
        <div class="msg" style="margin-top:5px;opacity:.7">Arriba está el texto crudo que leí de cada tarjeta, por si el reparto sigue sin salir.</div></div>`;
    }
    // finishOwnScan() ya dejó el equipo guardado y activo — render() primero
    // (reconstruye #body entero), el resumen se inserta después.
    const summary=finishOwnScan();
    render();
    $("#body").insertAdjacentHTML("afterbegin",summary+diag);
  }
};
window.onMetaUpdate=function(json){
  let d;try{d=JSON.parse(json)}catch(e){return}
  const o=$("#mOut");
  if(d.ok){
    try{META=JSON.parse(IO.loadMeta())}catch(e){}
    // Se dice QUÉ se actualizó y qué ya estaba al día, no solo "listo": con
    // tres archivos que se bajan por separado, "listo" no distingue entre
    // "se actualizó el meta" y "no hacía falta bajar nada".
    if(o)o.textContent = d.actualizados
      ? `Listo: ${d.detalle}.` + (d.alDia?` (${d.alDia} ya estaban al día)`:"")
      : "Ya tenías todo al día.";
    // dex.json y sprite_index.json solo se releen al reiniciar la app: el dex
    // se carga una vez en boot() y el índice de sprites vive en Kotlin. Decirlo
    // en vez de dejar al usuario preguntándose por qué no ve nada distinto.
    if(d.detalle&&/dex\.json|sprite_index\.json/.test(d.detalle))
      if(o)o.textContent+=" Reiniciá la app para que tomen efecto.";
    render();
  }
  else if(o)o.textContent="No se pudo: "+(d.error||"error");
};
document.body.addEventListener("touchstart",keep,{passive:true});
/* El panel no roba foco por diseño (FLAG_NOT_FOCUSABLE), así que un campo de
   texto real no dispara el teclado si no le pedimos a Android que lo permita
   mientras dura el foco — ver OverlayService.Bridge.needsKeyboard(). */
document.body.addEventListener("focusin",e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)&&has)try{Android.needsKeyboard(true)}catch(x){}});
document.body.addEventListener("focusout",e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)&&has)try{Android.needsKeyboard(false)}catch(x){}});
boot();
</script>
