/* ═════ EVENTOS ═════ */
function wire(){
  const on=(s,f)=>document.querySelectorAll(s).forEach(e=>e.onclick=()=>{keep();buzz(1);f(e);save();render()});
  const ch=(s,f)=>document.querySelectorAll(s).forEach(e=>e.onchange=()=>{keep();f(e);save();render()});

  // abrir la hoja de opciones
  document.querySelectorAll("[data-sel]").forEach(e=>e.onclick=()=>{
    keep();buzz(1);PICK=REG[e.dataset.sel];render()});
  // elegir una opción
  document.querySelectorAll("[data-op]").forEach(e=>e.onclick=()=>{
    keep();buzz(1);
    const P=PICK; if(!P)return;
    const v=P.list[+e.dataset.op];
    PICK=null; P.apply(v); render()});
  document.querySelectorAll("[data-shx]").forEach(e=>e.onclick=()=>{
    buzz(1);PICK=null;render()});
  document.querySelectorAll("[data-jump]").forEach(e=>e.onclick=()=>{
    buzz(0);
    const t=document.querySelector(`[data-ini="${e.dataset.jump}"]`);
    if(t)t.scrollIntoView({block:"start",behavior:"smooth"})});
  on("[data-pick]",e=>B.pick=+e.dataset.pick);
  on("[data-mp]",e=>B.mpick=+e.dataset.mp);
  on("[data-mega]",()=>{MY[B.mpick].mega=!MY[B.mpick].mega;saveMy()});
  on("[data-fc]",e=>B.focus=+e.dataset.fc);
  on("[data-ap]",e=>B.apick=e.dataset.ap);
  on("[data-sta]",e=>{const k=B.apick;B.act[k]=B.act[k]||actNew();
    const v=e.dataset.sta;B.act[k].sta=v==="—"?null:v});
  on("[data-bo]",e=>{const k=B.apick;B.act[k]=B.act[k]||actNew();
    const i=+e.dataset.bo,d=+e.dataset.d;
    B.act[k].bo[i]=Math.max(-6,Math.min(6,B.act[k].bo[i]+d))});

  on("[data-w]",e=>{const v=e.dataset.w;B.weather=B.weather===v?null:v;B.wTurns=B.weather?5:0});
  on("[data-t]",e=>{const v=e.dataset.t;B.terrain=B.terrain===v?null:v;B.tTurns=B.terrain?5:0});
  on("[data-tw]",e=>{const s=e.dataset.tw;B.tw[s]=B.tw[s]>0?0:4});
  on("[data-tr]",()=>B.tr=B.tr>0?0:5);
  on("[data-sc]",e=>{const s=e.dataset.sc;B.screen[s]=B.screen[s]>0?0:5});
  on("[data-fmt]",e=>{B.doubles=e.dataset.fmt==="1";syncFoe()});
  on("[data-lang]",e=>{LANG=e.dataset.lang;try{localStorage.setItem("hudLang",LANG)}catch(x){}});
  on("[data-ocrt]",e=>{OCR_TARGET=e.dataset.ocrt;
    try{localStorage.setItem("hudOcrTarget",OCR_TARGET)}catch(x){}});
  on("[data-why]",e=>{const k=e.dataset.why;WHY_OPEN[k]=!WHY_OPEN[k]});
  on("[data-undo]",e=>undoEvent(+e.dataset.undo));
  on("[data-pp]",e=>{const k=e.dataset.pp,d=+e.dataset.d,f=B.team[B.pick];if(!f)return;
    const max=(mv(k)||{}).pp||99;
    f.ppUsed[k]=Math.max(0,Math.min(max,(f.ppUsed[k]||0)+d))});
  on("[data-item]",e=>{const f=B.team[B.pick],v=e.dataset.item;
    f.item=f.item===v?null:v;f.itemSure=!!f.item;
    logEvent(f.item?"itemRevealed":"itemCleared",{foe:B.pick,dex:f.dex,item:v})});
  on("[data-fab]",e=>{const f=B.team[B.pick],v=e.dataset.fab;
    f.abil=f.abil===v?null:v;
    logEvent(f.abil?"abilityRevealed":"abilityCleared",{foe:B.pick,dex:f.dex,ability:v})});
  on("[data-brf]",e=>{const i=+e.dataset.brf,f=B.team[i];f.brought=!f.brought;syncActiveFoe();
    logEvent(f.brought?"brought":"broughtCleared",{foe:i,dex:f.dex})});
  on("[data-brm]",e=>{const i=+e.dataset.brm,p=B.myBrought.indexOf(i);
    if(p>=0)B.myBrought.splice(p,1);
    else if(B.myBrought.length<4)B.myBrought.push(i);
    syncActiveMine()});
  on("[data-mvk]",e=>{const f=B.team[B.pick],v=e.dataset.mvk,i=f.moves.indexOf(v);
    i<0?f.moves.push(v):f.moves.splice(i,1);
    logEvent(i<0?"moveSeen":"moveCleared",{foe:B.pick,dex:f.dex,move:v})});
  on("[data-obs]",e=>{const f=B.team[B.pick],k=e.dataset.obs;
    if(k==="out"){f.out=!f.out;syncFoe();
      logEvent(f.out?"ko":"revived",{foe:B.pick,dex:f.dex});return}
    const m=MY[B.mine[0]];if(!m)return;
    const a=B.act.m0||actNew();
    const eff=effSpd(myStat(m,5),"me",a.sta);
    observeOrder(f,eff,k==="fast");
    // El "contra qué velocidad" es parte del hecho: sin él, "se movió antes"
    // no se puede volver a evaluar si después se corrige el equipo propio.
    logEvent("order",{foe:B.pick,dex:f.dex,faster:k==="fast",
      vs:{dex:myDex(m),eff:shown(eff)},
      spdMin:f.spdMin,spdMax:f.spdMax,item:f.itemSure?f.item:null})});


  document.querySelectorAll("input[type=range]").forEach(inp=>{
    let last=+inp.value;
    inp.oninput=()=>{
      let v=+inp.value;
      // Tope duro de 66 SP en total: la barra se frena sola en lo que quede
      // libre, así no hay que hacer la cuenta a mano.
      if(inp.dataset.sp!==undefined){
        const m=MY[B.mpick], i=+inp.dataset.sp;
        const otros=m.sp.reduce((a,b,j)=>a+(j===i?0:b),0);
        const techo=Math.min(SP_MAX,SP_POOL-otros);
        if(v>techo){v=techo;inp.value=techo;if(last===techo)return;buzz(1)}
      }
      if(v===last)return;last=v;buzz(0);keep();
      const box=inp.closest(".hpwrap"),spb=inp.closest(".bar");
      if(box){box.querySelector(".hpfill").style.width=v+"%";
        box.querySelector(".knob").style.left=v+"%";
        const w=box.closest(".hpbox");w.querySelector(".hplab u").textContent=v+"%";
        w.className="hpbox "+(v<=25?"crit":v<=50?"low":"")}
      if(spb){spb.querySelector(".fl").style.width=(v/SP_MAX*100)+"%";
        MY[B.mpick].sp[+inp.dataset.sp]=v;
        const q=document.querySelector("#spLeft");
        if(q)q.textContent="quedan "+(SP_POOL-MY[B.mpick].sp.reduce((a,b)=>a+b,0));
        spb.parentElement.querySelector("u").innerHTML=
          v+' <s style="display:inline;text-decoration:none;color:var(--pick)">'+myStat(MY[B.mpick],+inp.dataset.sp)+"</s>"}
    };
    inp.onchange=()=>{buzz(1);
      if(inp.dataset.hp){const k=inp.dataset.hp;
        if(k==="calc")window.__c.cur=+inp.value;else B.hp[k]=+inp.value;save();render()}
      if(inp.dataset.sp){saveMy();render()}};
  });

  const g=$("#oGo");if(g)g.onclick=()=>{keep();buzz(1);
    const f=B.team[B.pick],m=MY[B.obs.a]||MY[0];
    const res=solveBulk(myDex(m),f.dex,B.obs.m,B.obs.p,
      {...ctxFor("me"),doubles:B.doubles,aStat:statsOf(m),aItem:m.item==="—"?null:m.item,aAb:m.abil});
    // El daño observado es un hecho; lo que solveBulk() deduce de él es una
    // inferencia. Se registra el hecho SIEMPRE — también cuando no cierra
    // con ningún reparto, que es justamente el caso más informativo.
    const ev=logEvent("damage",{foe:B.pick,dex:f.dex,move:B.obs.m,pct:B.obs.p,
      by:{dex:myDex(m)},ok:!!res.ok,
      ...(res.ok?{n:res.n,hp:res.hp,df:res.df}:{})});
    if(!res.ok)$("#oOut").textContent="Ningún reparto normal da ese número: sospechá de baya de resistencia, pantalla o crítico.";
    else{ f.bulk={...res,byEvent:ev.id};   // queda anclado: el HUD lo recuerda el resto del combate
      $("#oOut").textContent=`${res.n} repartos posibles. PS ${res.hp[0]}–${res.hp[1]} SP, defensa ${res.df[0]}–${res.df[1]} SP. Anclado.`}
    save()};

  on("[data-c2]",e=>window.__c[e.dataset.c2]=window.__c[e.dataset.c2]?0:1);

  const to=$("#tOcr");if(to)to.onclick=()=>{keep();buzz(1);
    if(has)Android.scanOwnTeam();
    else $("#body").insertAdjacentHTML("afterbegin",
      `<div class="card f"><div class="msg w">Solo funciona dentro de la app.</div></div>`)};
  const tg=$("#tGo");if(tg)tg.onclick=()=>{keep();buzz(1);
    const raw=$("#tPaste").value;
    if(!raw.trim()){$("#tOut").textContent="Pegá un equipo primero.";return}
    const {team,errors}=parseTeamText(raw);
    if(!team.length){$("#tOut").innerHTML=`<span style="color:var(--warn)">No pude leer ningún Pokémon.<br>${errors.map(esc).join("<br>")}</span>`;return}
    MY=team.concat(MY.slice(team.length));
    activeTeam().team=MY; // el paste reasigna MY entero: hay que re-enlazarlo al equipo activo
    B.mpick=0; saveMy();
    // render() reconstruye #body entero (limpia el textarea a propósito) —
    // el mensaje de resultado hay que escribirlo DESPUÉS, sobre el DOM nuevo.
    render();
    const out=$("#tOut");
    if(out)out.innerHTML=(errors.length
      ?`<span style="color:var(--warn)">Cargué ${team.length}, con avisos:<br>${errors.map(esc).join("<br>")}</span>`
      :`<span style="color:var(--pick)">Cargué ${team.length} Pokémon sin problemas.</span>`);
    return};

  const tn=$("#tNew");if(tn)tn.onclick=()=>{keep();buzz(1);
    const id=newTeamId(),team=defaultTeam();
    TEAMS.push({id,name:"Equipo "+(TEAMS.length+1),team});
    ACTIVE_ID=id;MY=team;B.mpick=0;saveMy();render()};
  const td=$("#tDup");if(td)td.onclick=()=>{keep();buzz(1);
    const at=activeTeam(),id=newTeamId(),team=JSON.parse(JSON.stringify(at.team));
    TEAMS.push({id,name:at.name+" (copia)",team});
    ACTIVE_ID=id;MY=team;B.mpick=0;saveMy();render()};
  // Borrar es destructivo y no hay diálogo de confirmación en esta app (no
  // funcionan bien con el panel FLAG_NOT_FOCUSABLE) — mismo patrón que ya
  // usa el botón de turno: mantener apretado, no un solo toque.
  const tdel=$("#tDel");if(tdel){let hold=0;
    tdel.onpointerdown=()=>{hold=setTimeout(()=>{hold=0;buzz(1);
      if(TEAMS.length<=1)return;
      TEAMS=TEAMS.filter(t=>t.id!==ACTIVE_ID);
      ACTIVE_ID=TEAMS[0].id;MY=TEAMS[0].team;B.mpick=0;saveMy();render()},900)};
    tdel.onpointerup=tdel.onpointercancel=()=>{if(hold)clearTimeout(hold)}}
  const tren=$("#tRen");if(tren)tren.onclick=()=>{keep();buzz(1);
    const v=$("#tName").value.trim();
    if(v)activeTeam().name=v;
    saveMy();render()};
  const mg=$("#mGo");if(mg)mg.onclick=()=>{keep();buzz(1);
    const u=$("#mU").value.trim();
    if(!u){$("#mOut").textContent="Pegá una URL primero.";return}
    $("#mOut").textContent="Descargando…";
    has?Android.updateMeta(u):$("#mOut").textContent="Solo dentro de la app."};
  const rt=$("#rt");if(rt)rt.onclick=()=>{keep();buzz(1);resetTurns()};
  const rs=$("#rs");if(rs)rs.onclick=()=>{keep();buzz(1);
    const t=B.team;B=NEW();B.team=t.map(f=>mkFoe(f.dex,f.confidence,f.shiny));syncFoe();
    if(has)try{Android.clearBattle()}catch(e){} save();render()};
}

document.querySelectorAll(".rail .tab").forEach(b=>b.onclick=()=>{
  keep();buzz(1);B.tab=b.dataset.tab;save();render()});
$("#bTurn").onclick=()=>{keep();buzz(1);B.turn++;
  const d=x=>Math.max(0,x-1);
  B.wTurns=d(B.wTurns);if(!B.wTurns)B.weather=null;
  B.tTurns=d(B.tTurns);if(!B.tTurns)B.terrain=null;
  B.tw.me=d(B.tw.me);B.tw.them=d(B.tw.them);B.tr=d(B.tr);
  B.screen.me=d(B.screen.me);B.screen.them=d(B.screen.them);
  save();render()};
$("#bZip").onclick=()=>{keep();buzz(1);B.compact=!B.compact;save();render()};
$("#bPin").onclick=()=>{buzz(1);B.pinned=!B.pinned;
  if(has)try{Android.pin(B.pinned)}catch(e){} save();render()};
$("#bScan").onclick=()=>{keep();buzz(1);if(has)Android.rescan()};
$("#bShut").onclick=()=>{buzz(1);if(has)try{Android.close()}catch(e){}};

window.onScan=function(json){
  let d;try{d=JSON.parse(json)}catch(e){return}
  if(d.error){$("#body").insertAdjacentHTML("afterbegin",
    `<div class="card f"><div class="msg w">${esc(d.error)}</div></div>`);return}
  if(!d.team?.length)return;
  B.team=d.team.map(x=>mkFoe(x.dex,x.confidence,x.shiny));
  // Un team preview nuevo es una partida nueva: los índices `foe` del log
  // anterior apuntarían a otros Pokémon. Se reinicia y el primer evento es
  // la lectura misma — reinterpretar evidencia vieja contra un equipo
  // distinto sería peor que no tenerla.
  B.log=[];
  logEvent("teamPreview",{team:B.team.map(f=>f.dex),quality:d.quality??null});
  B.pick=0;B.foe=[0,1];syncFoe();buzz(1);save();
  // Solo saltamos a PREVIA si la lectura vale la pena. Antes saltaba siempre,
  // y parecía que había funcionado aunque hubiera leído tres borrones.
  const flojos=B.team.filter(f=>f.confidence<0.15).length;
  const q=d.quality||0;
  const ok = B.team.length>=5 && flojos<=1 && q>=0.7;
  B.tab = ok ? "pre" : "foe";
  render();
  if(!ok){$("#body").insertAdjacentHTML("afterbegin",
    `<div class="card f"><span class="hd">Lectura dudosa</span><div class="msg w">
     Leí ${B.team.length} de 6${flojos?`, ${flojos} con poca confianza`:""}${
       q?` (calidad ${Math.round(q*100)}%)`:""}.
     ${q<0.7?"No reconocí bien el panel: movés la burbuja fuera de la franja derecha."
       :"Corregí a mano los que estén mal tocando cada uno."}
     </div></div>`)}
};
window.onOwnScan=function(json){
  buzz(1);
  let d;try{d=JSON.parse(json)}catch(e){
    render();$("#body").insertAdjacentHTML("afterbegin",
      `<div class="card f"><div class="msg w">La captura no devolvió datos legibles (JSON inválido).</div></div>`);
    return}
  if(d.error){render();$("#body").insertAdjacentHTML("afterbegin",
    `<div class="card f"><div class="msg w">${esc(d.error)}</div></div>`);return}
  const nlines=(d.lines||[]).length;
  if(!nlines){
    render();$("#body").insertAdjacentHTML("afterbegin",
      `<div class="card f"><span class="hd">Captura de equipo</span>
       <div class="msg w">No reconocí ningún texto en la captura (0 líneas). Probá con el HUD bien afuera de las tarjetas y buena luz de pantalla.</div></div>`);
    return;
  }
  const cards=clusterCards(d.lines,d.w,d.h);
  if(OCR_PHASE===0){
    OCR_DRAFT[0]=cards.map(parseMovesCard);
    OCR_PHASE=1; render();
    // Diagnóstico del paso 1: muestra los campos YA PARSEADOS por tarjeta,
    // no las líneas crudas. Así se ve de una si cada texto cayó en el campo
    // que le toca (que es donde estuvo el bug las tres primeras veces) sin
    // tener que esperar al paso 2 para enterarse.
    const marca=(t,fn)=>t?(fn(t)?esc(t):`<span style="color:var(--warn)">${esc(t)}?</span>`):"—";
    const sample=OCR_DRAFT[0].map((d,i)=>{
      if(!d||!d.dexName)return `${i+1}: <span style="color:var(--warn)">(vacía)</span>`;
      const mv=(d.moveNames||[]).map(n=>marca(n,findMove)).join(", ")||"—";
      return `${i+1}: ${marca(d.dexName,findSpecies)} · ${marca(d.abilName,findAbility)}
        · ${marca(d.itemName,findItem)}<br><s style="opacity:.75">${mv}</s>`;
    }).join("<br>");
    $("#body").insertAdjacentHTML("afterbegin",
      `<div class="card"><span class="hd">Paso 1 leído<em>${nlines} líneas</em></span>
       <div class="msg">${sample}</div>
       <div class="msg" style="margin-top:5px;opacity:.7">Lo marcado con "?" no lo reconocí. Si el orden de los campos está mal, mandame esta pantalla.</div></div>`);
  }else{
    OCR_DRAFT[1]=cards.map(parseStatsCard);
    OCR_PHASE=0;
    // Diagnóstico del paso 2, con el mismo criterio que el del paso 1: si
    // alguna tarjeta no dio reparto, mostrar las líneas NUMÉRICAS que sí se
    // leyeron de ella. Sin esto, "no pude leer el reparto" no dice si el
    // problema fue el OCR, el recorte de la tarjeta o el parseo.
    const falladas=OCR_DRAFT[1].map((s,i)=>s?null:i).filter(i=>i!==null);
    let diag="";
    if(falladas.length){
      diag=`<div class="card f"><span class="hd">Qué leí en Stats<em>${falladas.length} sin reparto</em></span>
        <div class="msg">${falladas.map(i=>{
          // Todas las líneas, no solo las numéricas: las no numéricas son las
          // etiquetas y —si ML Kit llega a devolverlas— las flechas de
          // naturaleza, que es justo lo que hace falta saber.
          const todas=(cards[i]||[]).map(l=>esc(l.t));
          const muestra=todas.slice(0,12).join(" | ")||"(sin texto)";
          return `${i+1}: ${muestra}${todas.length>12?` …+${todas.length-12}`:""}`;
        }).join("<br>")}</div>
        <div class="msg" style="margin-top:5px;opacity:.7">Mandame esta pantalla si el reparto sigue sin salir.</div></div>`;
    }
    // finishOwnScan() ya dejó el equipo guardado y activo — render() primero
    // (reconstruye #body entero), el resumen se inserta después.
    const summary=finishOwnScan();
    render();
    $("#body").insertAdjacentHTML("afterbegin",summary+diag);
  }
};
window.onMetaUpdate=function(json){
  let d;try{d=JSON.parse(json)}catch(e){return}
  const o=$("#mOut");
  if(d.ok){try{META=JSON.parse(Android.loadMeta())}catch(e){}
    if(o)o.textContent=`Listo: ${d.count} especies, ${d.regulation}.`;render()}
  else if(o)o.textContent="No se pudo: "+(d.error||"error");
};
document.body.addEventListener("touchstart",keep,{passive:true});
/* El panel no roba foco por diseño (FLAG_NOT_FOCUSABLE), así que un campo de
   texto real no dispara el teclado si no le pedimos a Android que lo permita
   mientras dura el foco — ver OverlayService.Bridge.needsKeyboard(). */
document.body.addEventListener("focusin",e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)&&has)try{Android.needsKeyboard(true)}catch(x){}});
document.body.addEventListener("focusout",e=>{
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)&&has)try{Android.needsKeyboard(false)}catch(x){}});
boot();
</script>
</body>
