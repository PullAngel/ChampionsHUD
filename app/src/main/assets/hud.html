}
const myStat=(m,i)=> i===0?hpOf(S(myDex(m)).s[0],m.sp[0]):stOf(S(myDex(m)).s[i],m.sp[i],natMul(i,m.up,m.dn));
const statsOf=m=>[0,1,2,3,4,5].map(i=>myStat(m,i));
const ctxFor=side=>({doubles:B.doubles,weather:B.weather,terrain:B.terrain,
  screen:(side==="them"?B.screen.me:B.screen.them)>0});
const metaOf=d=>META.species?.[String(d)]||null;
const myMoves=m=>(m.moves||[]).filter(x=>MV[x]);
/** Qué movimientos considerarle al rival, en orden de confianza decreciente
    — y con qué etiqueta, para no presentar los tres niveles como si fueran
    lo mismo (`product.md`, sistema de confianza):
      1. `visto`   — se lo vimos usar. Hecho observado.
      2. `meta`    — lo común en esa especie según los datos de uso. Prior.
      3. `posible` — su learnset completo. Solo dice qué NO puede tener.
    Nunca la lista global de movimientos del juego: que un movimiento exista
    no significa que esa especie pueda llevarlo. Si no hay ni learnset (sin
    dex.json cargado) se devuelve vacío y quien llama lo reporta como "sin
    datos" — fallo ruidoso, no una amenaza inventada. */
const foeMovePool=f=>{
  const seen=(f.moves||[]).filter(x=>MV[x]);
  if(seen.length)return {moves:seen,src:"visto"};
  const meta=(metaOf(f.dex)?.moves||[]).map(x=>x[0]).filter(x=>MV[x]);
  if(meta.length)return {moves:meta,src:"meta"};
  const L=(typeof learnable==="function")&&learnable(f.dex);
  if(L&&L.length)return {moves:L.filter(k=>MV[k]&&MV[k][2]!=="E"&&MV[k][0]>0),src:"posible"};
  return {moves:[],src:"sin datos"};
};
const foeMoves=f=>foeMovePool(f).moves;
/** R3, segunda mitad (roadmap Sprint 2.5, `inference.md` §5): "descartar
    sets incompatibles". `meta.json[].sets` (sprint 2.5, `build_meta.py`) trae
    los combos de 4 movimientos completos que de verdad aparecieron juntos en
    torneos reales — de esos, cuáles siguen siendo compatibles con lo que YA
    se le vio usar a este rival. No dice qué trae seguro, solo angosta el
    espacio de hipótesis con evidencia (mismo patrón que `itemHypothesis()`
    del sprint 2.2): un set que no incluye un movimiento ya confirmado no
    puede ser el suyo. Sin nada visto todavía, o sin sets conocidos para la
    especie, no hay nada que descartar — se devuelve la lista tal cual. */
const compatibleSets=f=>{
  const seen=(f.moves||[]).filter(x=>MV[x]);
  const sets=metaOf(f.dex)?.sets||[];
  if(!seen.length||!sets.length)return sets;
  return sets.filter(s=>seen.every(mv=>s.moves.includes(mv)));
};

/* ═════ IMPORTACIÓN DE EQUIPO POR TEXTO ═════
   decisión #15 (decisions.md): pegar un teamlist es una funcionalidad de
   primera clase, no una alternativa menor a la lectura automática. Formato
   cercano al de Showdown, pero "Spread" en vez de "EVs": Champions reparte
   0–32 por stat con un pool de 66 (confirmado contra capturas reales de la
   pantalla de Stats del juego), no el 0–252/508 de los juegos principales
   — usar la palabra "EVs" hubiera sido confuso. Nombres de especie/ítem/
   habilidad/movimiento se resuelven en cualquiera de los dos idiomas del
   selector, no solo el que esté activo en ese momento. */
const TEAM_PASTE_PLACEHOLDER=`Sinistcha @ Colbur Berry
Ability: Hospitality
Nature: Calm
Spread: 31/0/7/0/28/0
- Rage Powder
- Matcha Gotcha
- Life Dew
- Trick Room

(línea en blanco entre cada Pokémon, hasta 6)`;
const NATURES={hardy:[0,0],lonely:[1,2],brave:[1,5],adamant:[1,3],naughty:[1,4],
  bold:[2,1],docile:[0,0],relaxed:[2,5],impish:[2,3],lax:[2,4],
  timid:[5,1],hasty:[5,2],serious:[0,0],jolly:[5,3],naive:[5,4],
  modest:[3,1],mild:[3,2],quiet:[3,5],bashful:[0,0],rash:[3,4],
  calm:[4,1],gentle:[4,2],sassy:[4,5],careful:[4,3],quirky:[0,0]};
const NAT_IDX={atk:1,def:2,spa:3,spd:4,spe:5};

/** Distancia de edición (Levenshtein) — último recurso cuando el match
    exacto/normalizado falla. OCR contra fuentes chicas del juego real
    (habilidades, movimientos) va a tener typos ocasionales que un match
    exacto nunca va a resolver; esto no reemplaza la corrección manual,
    solo evita que UN carácter mal leído tire toda la lectura a la basura. */
function editDistance(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
/** entries: [{key,label}]. Tolera ~1 error cada 6 caracteres (piso 1, techo
    3) — bastante ajustado para no matchear cualquier cosa con nombres
    cortos tipo "Alivio" o "Trueno". */
function closestMatch(text,entries){
  const t=(text||"").trim().toLowerCase();
  if(!t||!entries.length)return null;
  let best=null,bestD=Infinity;
  for(const e of entries){
    const d=editDistance(t,e.label.toLowerCase());
    if(d<bestD){bestD=d;best=e}
  }
  const tol=Math.max(1,Math.min(3,Math.floor(t.length/6)));
  return best&&bestD<=tol?best.key:null;
}

function findSpeciesRaw(name){
  const t=name.toLowerCase();
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
  return DEXN.find(d=>S(d).n.toLowerCase()===t) ??
    DEXN.find(d=>norm(S(d).n)===norm(t)) ??
    closestMatch(name,DEXN.map(d=>({key:d,label:S(d).n})));
}
function findSpecies(name){
  for(const v of ocrVariants(name)){const r=findSpeciesRaw(v);if(r)return r}
  return null;
}
/** El ícono de tipo/objeto que el juego dibuja pegado al texto, y el número
    grande de orden de la tarjeta (1–6), a veces se leen como un carácter
    suelto delante de la palabra real: "O Protect" (ícono de tipo Normal, un
    círculo liso), "T Choice Scarf" (ícono de objeto), "9 Iron Head" y
    "5 Spell Tag" (número de tarjeta pegado a la línea) — todos casos reales
    de capturas de Angel. Se prueba recién como último recurso, si nada más
    matcheó: ningún movimiento, objeto, habilidad ni especie real empieza con
    un carácter suelto seguido de espacio. */
const stripIconPrefix=s=>{
  // Hasta 2 caracteres: el ícono solo daba 1 ("O Protect"), pero el número
  // de tarjeta pegado al ícono da 2 ("W2 Sludge Bomb", caso real de Angel).
  const m=/^[A-Za-z0-9]{1,2}\s+(\S.*)$/.exec((s||"").trim());
  return m?m[1]:null;
};
/** Las claves de MEGA son nombres en español ("Blastoisita", "Gengarita"),
    con alguna suelta en inglés ("Swampertite") — inconsistencia vieja de la
    tabla. El OCR lee lo que muestra el juego, que en inglés termina en
    "-ite". Convertir entre las dos formas evita que la piedra no se
    reconozca solo por el idioma de la clave. */
const megaAlias=s=>{
  const t=String(s||"").trim();
  let r=t.replace(/ite\b/i,"ita");
  if(r!==t)return r;
  r=t.replace(/ita\b/i,"ite");
  return r!==t?r:null;
};
/** Variantes a probar de un texto leído por OCR, de la más literal a la más
    tolerante. Se resuelven en orden y gana la primera que matchea, así una
    lectura limpia nunca queda pisada por una interpretación forzada. */
function ocrVariants(name,extra){
  const out=[],push=v=>{v=String(v||"").trim();if(v&&!out.includes(v))out.push(v)};
  push(name);
  push(stripIconPrefix(name));
  if(extra)for(const v of out.slice())push(extra(v));
  return out;
}
function findItemRaw(name){
  const t=name.toLowerCase();
  const hit=IT.find(x=>x[0].toLowerCase()===t||x[1].toLowerCase()===t);
  if(hit)return hit[0];
  const meg=Object.keys(MEGA).find(k=>k.toLowerCase()===t);
  if(meg)return meg;
  const entries=IT.flatMap(x=>[{key:x[0],label:x[0]},{key:x[0],label:x[1]}])
    .concat(Object.keys(MEGA).map(k=>({key:k,label:k})));
  return closestMatch(name,entries);
}
function findItem(name){
  for(const v of ocrVariants(name,megaAlias)){const r=findItemRaw(v);if(r)return r}
  return null;
}
function findAbilityRaw(name){
  const t=name.toLowerCase();
  for(const slug in ABIL_I18N){
    const r=ABIL_I18N[slug];
    if(r.en.toLowerCase()===t||r.es.toLowerCase()===t)return slug;
  }
  const s=slugify(name);
  if(ABIL_I18N[s])return s;
  const entries=Object.keys(ABIL_I18N).flatMap(slug=>
    [{key:slug,label:ABIL_I18N[slug].en},{key:slug,label:ABIL_I18N[slug].es}]);
  return closestMatch(name,entries);
}
function findAbility(name){
  for(const v of ocrVariants(name)){const r=findAbilityRaw(v);if(r)return r}
  return null;
}
function findMoveRaw(name){
  const t=name.toLowerCase();
  if(MV[name])return name;
  const byKey=Object.keys(MV).find(k=>k.toLowerCase()===t);
  if(byKey)return byKey;
  const byEn=Object.keys(MV).find(k=>(MV[k][7]||"").toLowerCase()===t);
  if(byEn)return byEn;
  const esKey=Object.keys(ES_ALT).find(k=>ES_ALT[k].toLowerCase()===t);
  if(esKey)return esKey;
  const entries=Object.keys(MV).flatMap(k=>{
    const en=MV[k][7];
    return en?[{key:k,label:k},{key:k,label:en}]:[{key:k,label:k}];
  });
  return closestMatch(name,entries);
}
function findMove(name){
  for(const v of ocrVariants(name)){const r=findMoveRaw(v);if(r)return r}
  return null;
}

/** Parsea el texto pegado. Devuelve {team:[...hasta 6 slots], errors:[...]}
    — nunca tira una excepción: un Pokémon que no se pudo leer se salta y
    queda en errors, no rompe el resto (fallo ruidoso, nunca silencioso). */
function parseTeamText(text){
  const blocks=String(text||"").split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const team=[],errors=[];
  blocks.slice(0,6).forEach(block=>{
    const lines=block.split("\n").map(l=>l.trim()).filter(Boolean);
    if(!lines.length)return;
    const head=lines[0].match(/^(.+?)(?:\s*@\s*(.+))?$/);
    const speciesName=(head?head[1]:lines[0]).trim();
    const dex=findSpecies(speciesName);
    if(!dex){errors.push(`No reconozco el Pokémon "${speciesName}".`);return}
    const s=slot(dex);
    const label=S(dex).n;
    if(head&&head[2]){
      const it=findItem(head[2]);
      if(it)s.item=it; else errors.push(`${label}: no reconozco el ítem "${head[2]}".`);
    }
    const learn=learnable(dex);
    for(const line of lines.slice(1)){
      let m;
      if((m=line.match(/^Ability:\s*(.+)$/i))){
        const ab=findAbility(m[1]);
        if(ab)s.abil=ab; else errors.push(`${label}: no reconozco la habilidad "${m[1]}".`);
      }else if((m=line.match(/^Nature:\s*(.+)$/i))){
        const nt=m[1].trim().toLowerCase();
        if(NATURES[nt]){[s.up,s.dn]=NATURES[nt]}
        else{
          const pm=m[1].match(/\+\s*(\w+)\s*-\s*(\w+)/);
          if(pm&&NAT_IDX[pm[1].toLowerCase()]&&NAT_IDX[pm[2].toLowerCase()]){
            s.up=NAT_IDX[pm[1].toLowerCase()];s.dn=NAT_IDX[pm[2].toLowerCase()];
          }else if(nt!=="neutral"){errors.push(`${label}: no reconozco la naturaleza "${m[1]}".`)}
        }
      }else if((m=line.match(/^Spread:\s*([\d/\s]+)$/i))){
        const nums=m[1].split("/").map(x=>+x.trim());
        const sum=nums.reduce((a,b)=>a+(b||0),0);
        if(nums.length!==6||nums.some(n=>isNaN(n)||n<0||n>SP_MAX))
          errors.push(`${label}: el reparto tiene que ser 6 números 0–${SP_MAX} separados por "/" (PS/Atq/Def/AtqEsp/DefEsp/Vel).`);
        else if(sum>SP_POOL)
          errors.push(`${label}: el reparto suma ${sum}, el máximo es ${SP_POOL}.`);
        else s.sp=nums;
      }else if((m=line.match(/^-\s*(.+)$/))){
        if(s.moves.filter(Boolean).length>=4){errors.push(`${label}: ya tiene 4 movimientos, ignoro "${m[1]}".`);continue}
        const k=findMove(m[1]);
        if(!k){errors.push(`${label}: no reconozco el movimiento "${m[1]}".`);continue}
        if(learn&&!learn.includes(k))errors.push(`${label}: "${mvName(k)}" no está en su learnset según dex.json — lo cargué igual, revisalo.`);
        const free=s.moves.indexOf("");
        if(free>=0)s.moves[free]=k;
      }
    }
    if(!canMega(s))s.mega=false;
    team.push(s);
  });
  return {team,errors};
}

/* ═════ CAPTURA OCR DEL EQUIPO PROPIO ═════
   Dos pasadas sobre "View Details" del juego: Moves & More (especie,
   habilidad, ítem, movimientos) y Stats (reparto). TeamOCR.kt en Kotlin no
   interpreta nada — solo corre ML Kit y devuelve líneas de texto con
   posición. Toda la lógica de "a qué Pokémon pertenece esta línea" y "qué
   campo es" vive acá, a propósito: si el layout real del juego no coincide
   con lo asumido mirando un par de capturas, esto se corrige editando el
   HTML, no recompilando Kotlin (decisions.md, misma lógica que ya aplica a
   toda la separación motor/cliente del proyecto).
   Primer intento, sin verificar contra el juego real — ver roadmap.md. */
let OCR_PHASE=0, OCR_DRAFT=[null,null];
/** Dónde guarda la captura: "new" crea un equipo, "active" pisa el activo.
    Persistido porque es una preferencia de uso, no un estado del combate:
    quien reescanea para corregir una lectura fallida quiere "active" varias
    veces seguidas, y que se lo pregunte cada vez sería fricción pura. */
let OCR_TARGET=(()=>{try{return localStorage.getItem("hudOcrTarget")||"new"}catch(e){return "new"}})();

/** Agrupa líneas de OCR en 6 "cards" por posición (grilla de 2 columnas × 3
    filas, la que se ve en las capturas de referencia de Angel). Usa
    posición relativa al ancho/alto de la captura, no coordenadas fijas, así
    tolera que cambie la resolución del dispositivo. Cada card queda
    ordenada por Y — el orden de lectura natural de arriba a abajo.

    El nombre de equipo/entrenador y las pestañas "Moves & More"/"Stats"
    viven arriba de la grilla — asumir que la grilla ocupa toda la altura
    de la captura (0..h) hacía que ese header cayera en el primer tercio y
    se leyera como si fuera la especie de la tarjeta 1/2 (bug real: "Team 9"
    y el nombre de entrenador de Angel se leyeron como especies). Las
    pestañas son texto fijo del juego, siempre presente en esta pantalla —
    se usan como ancla real de dónde empieza la grilla en vez de una
    fracción fija de la imagen completa. Si no se reconocen (ML Kit no las
    leyó), se cae al comportamiento anterior en vez de romper todo. */
/** Parte un conjunto de líneas en `n` bandas horizontales cortando por los
    n-1 saltos verticales más grandes. Las tarjetas están separadas por un
    hueco visible bastante mayor que el interlineado de adentro de cada una,
    así que los saltos más grandes son siempre los bordes entre filas. */
function splitRows(items,n){
  const sorted=items.slice().sort((a,b)=>a.y-b.y);
  if(sorted.length<n)return null;
  const gaps=[];
  for(let i=1;i<sorted.length;i++)gaps.push({i,d:sorted[i].y-sorted[i-1].y});
  if(gaps.length<n-1)return null;
  const cuts=gaps.slice().sort((a,b)=>b.d-a.d).slice(0,n-1).map(g=>g.i).sort((a,b)=>a-b);
  const bands=[];let prev=0;
  for(const c of cuts){bands.push(sorted.slice(prev,c));prev=c}
  bands.push(sorted.slice(prev));
  return bands;
}
function clusterCards(lines,w,h){
  const cards=Array.from({length:6},()=>[]);
  const tabRe=/^(moves\s*&?\s*more|stats)$/i;
  const src=(lines||[]).filter(l=>l&&l.t&&typeof l.x==="number"&&typeof l.y==="number");
  const tabs=src.filter(l=>tabRe.test(l.t.trim()));
  const body=src.filter(l=>!tabRe.test(l.t.trim()));
  const topCut=tabs.length?Math.max(...tabs.map(l=>l.y+(l.h||0))):0;
  const below=topCut?body.filter(l=>(l.y+(l.h||0)/2)>topCut):[];
  const use=below.length>=6?below:body;
  if(!use.length||!w)return cards;

  // Las filas se detectan por los saltos reales entre tarjetas, NO por
  // tercios de la altura de la imagen. Ese era el bug: la grilla no ocupa
  // la pantalla entera (hay padding arriba y abajo), así que con tercios
  // fijos la fila de abajo se corría a la del medio — la especie de la
  // tarjeta 5 (Archaludon) caía en la banda equivocada y esa tarjeta
  // terminaba tomando su propio ítem ("Leftovers") como especie.
  let bands=splitRows(use,3);
  if(!bands||bands.some(b=>b.length<2)){
    // Si el corte por saltos no da tres bandas razonables, se reparte en
    // tercios del CONTENIDO real (primera a última línea), que sigue siendo
    // muy superior a tercios de la imagen completa.
    const ys=use.map(l=>l.y+(l.h||0)/2);
    const y0=Math.min(...ys), span=(Math.max(...ys)-y0)||1;
    bands=[[],[],[]];
    for(const ln of use){
      const t=((ln.y+(ln.h||0)/2)-y0)/span;
      bands[t<1/3?0:t<2/3?1:2].push(ln);
    }
  }
  bands.slice(0,3).forEach((band,row)=>{
    for(const ln of band)cards[row*2+((ln.x+(ln.w||0)/2)<w/2?0:1)].push(ln);
  });
  return cards.map(c=>c.slice().sort((a,b)=>a.y-b.y));
}

/** Fase 1 (Moves & More): especie, habilidad, ítem, hasta 4 movimientos, en
    ese orden — el que se ve en la captura de referencia. Ignora líneas de
    una sola letra/dígito (el numerito de orden "1"-"6" que trae cada
    tarjeta, ruido típico de OCR). No resuelve nombres acá — eso es trabajo
    de finishOwnScan(), reusando findSpecies()/findAbility()/etc. */
/** Corta un conjunto de líneas en dos columnas por el mayor salto entre
    valores de X consecutivos. El hueco entre columnas es siempre el salto
    más grande, sin importar cuántas líneas caigan de cada lado — por eso se
    usa esto y no la mediana, que se corre al lado equivocado cuando una
    columna tiene más líneas que la otra. Devuelve null si no hay un hueco
    claro (una sola columna), para que quien llama decida qué hacer en vez
    de partir a ciegas por la mitad. */
function splitColumns(items,minGap){
  if(items.length<2)return null;
  const xs=items.map(l=>l.x).sort((a,b)=>a-b);
  let gap=0,midX=null;
  for(let i=1;i<xs.length;i++){const d=xs[i]-xs[i-1];
    if(d>gap){gap=d;midX=(xs[i]+xs[i-1])/2}}
  if(midX===null||gap<(minGap||0))return null;
  return {midX,gap,
    left:items.filter(l=>l.x<midX),
    right:items.filter(l=>l.x>=midX)};
}

/** Fase 1 (Moves & More). Cada tarjeta tiene DOS columnas, no una:

      Venusaur          | Sludge Bomb
      Chlorophyll       | Protect
      Venusaurite       | Earth Power
                        | Giga Drain

    La versión anterior ordenaba todas las líneas por Y y asumía lectura
    secuencial (especie, habilidad, ítem, después 4 movimientos). Como las
    dos columnas comparten las mismas alturas, eso las intercalaba y corría
    todos los campos un lugar. Se detectó con el diagnóstico real de Angel:
    Aegislash salió con habilidad "9 Iron Head" (un movimiento), ítem
    "Stance Change" (la habilidad) y movimiento "5 Spell Tag" (el ítem) —
    exactamente el patrón de dos columnas intercaladas por Y.

    Ahora se separa por X primero: izquierda = especie/habilidad/ítem de
    arriba a abajo, derecha = hasta 4 movimientos. Si no hay dos columnas
    distinguibles se cae al comportamiento secuencial anterior, que para una
    tarjeta sin movimientos legibles sigue siendo lo mejor disponible. */
function parseMovesCard(lines){
  // >1 carácter Y al menos una letra: saca ruido típico de OCR (el numerito
  // de orden "1"-"6" de la tarjeta, símbolos de género/tipo sueltos que a
  // veces se leen como texto) sin arriesgarse a sacar un nombre real.
  const clean=(lines||[]).filter(l=>l.t&&l.t.trim().length>1&&/[a-zA-Z]/.test(l.t));
  const byY=a=>a.slice().sort((x,y)=>x.y-y.y).map(l=>l.t);
  // El hueco entre columnas tiene que ser grande de verdad. Sin este piso,
  // una indentación chica (el ícono del ítem corre su línea unos píxeles)
  // se tomaba como separación de columnas y partía la columna izquierda al
  // medio. Se escala con la altura del texto para no depender de la
  // resolución de la captura.
  const alto=Math.max(14,...clean.map(l=>l.h||0));
  const cols=splitColumns(clean,alto*2.5);
  if(cols&&cols.left.length&&cols.right.length){
    const L=byY(cols.left), R=byY(cols.right);
    return {dexName:L[0]||null, abilName:L[1]||null, itemName:L[2]||null,
      moveNames:R.slice(0,4)};
  }
  const seq=byY(clean);
  return {dexName:seq[0]||null, abilName:seq[1]||null, itemName:seq[2]||null,
    moveNames:seq.slice(3,7)};
}

/** Fase 2 (Stats): separa las líneas con números en dos sub-columnas por X
    (PS/Ataque/Defensa a la izquierda, AtqEsp/DefEsp/Velocidad a la derecha
    — el orden de la captura de referencia) y de cada línea extrae el
    ÚLTIMO número como la inversión (ej. "177 — 31" → 31; el primer número
    es el stat ya calculado, no la inversión, y no nos sirve). Si no hay
    al menos 6 líneas numéricas o algún valor queda fuera de 0–SP_MAX,
    devuelve null en vez de arriesgar una lectura a medias — fallo ruidoso,
    lo termina completando la corrección manual. */
/** Agrupa líneas de una misma sub-columna por Y — tolera que ML Kit devuelva
    "155 — 0" como una sola línea O la parta en dos ("155" y "— 0") si hay
    espacio de sobra entre el valor y la inversión. Solo se llama DESPUÉS de
    separar por sub-columna (izq/der): agrupar por Y antes de eso juntaría
    líneas de columnas distintas que caen a la misma altura por casualidad
    (HP y AtqEsp son la fila 1 de cada columna, mismo Y, texto distinto). */
function groupRows(items){
  const sorted=items.slice().sort((a,b)=>a.y-b.y);
  const rows=[];
  for(const ln of sorted){
    const last=rows[rows.length-1];
    if(last&&Math.abs(ln.y-last.y0)<(ln.h||14)*0.6)last.items.push(ln);
    else rows.push({y0:ln.y,items:[ln]});
  }
  return rows;
}
/** Etiquetas de cada stat, en el orden del array `sp` [PS,Atq,Def,AtqEsp,
    DefEsp,Vel]. Las variantes "Sp. Atk"/"Sp. Def" van primero para que
    "Ataque Esp." no se confunda con "Ataque". Se cubre inglés y español
    porque el selector de idioma del juego lo elige el usuario (decisión
    #17) y el OCR lee lo que el juego muestre. */
const STAT_LABEL_KEYS=[
  [3,["spatk","spa","atqesp","ataqueesp","atesp"]],
  [4,["spdef","spd","defesp","defensaesp"]],
  [0,["hp","ps"]],
  [1,["attack","atk","ataque"]],
  [2,["defense","def","defensa"]],
  [5,["speed","spe","velocidad"]],
];
const normStat=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
/** Qué stat es esta línea, o -1. Acepta que el número venga pegado a la
    etiqueta ("HP 202 32") pero NO que siga otra letra: así "def" no se come
    "defense" ni "ataque" se come "ataqueesp". */
function statIndexRaw(text){
  const nt=normStat(text);
  if(!nt)return -1;
  for(const [i,keys] of STAT_LABEL_KEYS)
    for(const k of keys)
      if(nt===k||(nt.startsWith(k)&&!/^[a-z]/.test(nt.slice(k.length))))return i;
  return -1;
}
function statIndexOf(text){
  const i=statIndexRaw(text);
  if(i>=0)return i;
  // El juego dibuja un ícono (corazón, espada, escudo…) delante de cada
  // etiqueta. Si ML Kit lo lee como una letra suelta, "HP" llega como
  // "V HP 178 32" y el match directo falla. Mismo recurso que ya usan
  // findMove()/findItem() para "O Protect".
  const st=stripIconPrefix(text);
  return st?statIndexRaw(st):-1;
}
const lastNum=t=>{const m=String(t||"").match(/\d+/g);return m&&m.length?+m[m.length-1]:null};

/** Fase 2 (Stats). Se ancla en las ETIQUETAS de cada stat, no en la posición.
    La versión anterior era puramente posicional (dos sub-columnas × tres
    filas) y fallaba entera si el OCR fragmentaba distinto de lo asumido —
    en la prueba real de Angel no pudo leer el reparto de ninguna de las 6
    tarjetas. Las etiquetas, en cambio, son texto fijo del juego: se busca
    "HP"/"Attack"/"Sp. Atk"/…, y de su fila se toma el ÚLTIMO número, que es
    la inversión (en "177 — 31", el 177 es el stat ya calculado y no sirve).
    Si las etiquetas no se reconocen, cae al método posicional anterior.
    Devuelve null si no puede leer los 6 — fallo ruidoso, lo completa la
    corrección manual, nunca un reparto a medias presentado como bueno. */
/** La naturaleza NO viene escrita: el juego dibuja una flecha roja hacia
    arriba en la stat que sube y una azul hacia abajo en la que baja (nada si
    es neutra). ML Kit reconoce texto, no formas ni colores, así que lo más
    probable es que no devuelva nada por esas flechas. Se intenta igual —
    sale gratis y algunos motores sí emiten un carácter — pero **no se
    inventa**: si no aparece ninguna marca, la naturaleza queda sin definir
    (0/0) y el resumen avisa que hay que ponerla a mano.
    Detectarla de verdad exige mirar color y forma en el bitmap, como ya hace
    SpriteMatcher con los sprites — es trabajo de Kotlin, ver `audit.md`. */
const FLECHA_UP=/[▲△↑⬆⇧]/, FLECHA_DN=/[▼▽↓⬇⇩]/;
/** Ubica cada flecha en su celda: la fila la da el Y (cuál de las tres
    bandas) y la sub-columna el X (izquierda = PS/Atq/Def, derecha =
    AtqEsp/DefEsp/Vel), o sea el mismo orden que el array `sp`.
    Devuelve {up:0,dn:0} si no hay nada que interpretar — que es el caso
    esperado mientras la detección dependa de texto. */
function naturalezaDeTarjeta(L){
  const marca=l=>String(l.t).replace(/\d+/g,"").trim();
  const conFlecha=L.filter(l=>{const r=marca(l);return r&&(FLECHA_UP.test(r)||FLECHA_DN.test(r))});
  if(!conFlecha.length)return {up:0,dn:0};
  const num=L.filter(l=>/\d/.test(l.t));
  const bandas=splitRows(num,3), cols=splitColumns(num);
  if(!bandas||!cols)return {up:0,dn:0};
  const centro=b=>b.reduce((a,l)=>a+(l.y||0),0)/b.length;
  const ys=bandas.map(centro);
  let up=0,dn=0;
  for(const l of conFlecha){
    let fila=0,mejor=Infinity;
    ys.forEach((c,i)=>{const d=Math.abs((l.y||0)-c);if(d<mejor){mejor=d;fila=i}});
    const idx=((l.x||0)<cols.midX?0:3)+fila;
    if(!idx)continue;                       // PS no puede subir ni bajar
    const r=marca(l);
    if(!up&&FLECHA_UP.test(r))up=idx;
    else if(!dn&&FLECHA_DN.test(r))dn=idx;
  }
  return (up&&dn)?{up,dn}:{up:0,dn:0};      // o las dos, o ninguna
}
/** Devuelve `{sp:[6 inversiones], up, dn}` o null si no pudo leer el reparto
    completo. `up`/`dn` en 0 significa "naturaleza no determinada", no
    "neutra" — quien llama lo reporta para que se corrija a mano. */
function parseStatsCard(lines){
  const L=(lines||[]).filter(l=>l&&l.t);
  if(!L.length)return null;
  const con=sp=>({sp,...naturalezaDeTarjeta(L)});
  const sp=[null,null,null,null,null,null];
  for(const ln of L){
    const i=statIndexOf(ln.t);
    if(i<0||sp[i]!==null)continue;
    // La fila entera: la etiqueta más lo que haya a su derecha a la misma
    // altura. Cubre tanto "HP 202 32" en una línea como "HP" + "202" + "32"
    // en tres, sin tratarlos como casos distintos.
    // El barrido CORTA al llegar a la siguiente etiqueta de stat: las dos
    // sub-columnas comparten altura (HP y Sp. Atk son la misma fila), así
    // que sin ese corte los valores de la izquierda se llevaban los de la
    // derecha y las 6 inversiones salían duplicadas.
    // 0.9 de la altura del texto: tolera que la etiqueta y su número tengan
    // el baseline apenas corrido (pasa cuando el ícono es más alto que la
    // letra), sin llegar a la fila de abajo, que está a ~1.4 alturas.
    const hh=ln.h||14;
    const row=L.filter(o=>o!==ln&&Math.abs((o.y||0)-(ln.y||0))<hh*0.9&&(o.x||0)>=(ln.x||0))
      .sort((a,b)=>(a.x||0)-(b.x||0));
    const propios=[];
    for(const o of row){if(statIndexOf(o.t)>=0)break;propios.push(o)}
    const v=lastNum([ln.t,...propios.map(o=>o.t)].join(" "));
    if(v!==null)sp[i]=v;
  }
  if(sp.every(n=>n!==null&&n>=0&&n<=SP_MAX))return con(sp);

  const num=L.filter(l=>/\d/.test(l.t));
  if(num.length<6)return null;

  // Método 2, por forma de las filas. El más robusto de los tres, porque no
  // necesita ni reconocer etiquetas ni acertar dónde separar las columnas:
  // cada fila de la tarjeta contiene los dos stats de esa altura, y leída de
  // izquierda a derecha da SIEMPRE cuatro números —
  //     [stat izq, inversión izq, stat der, inversión der]
  // (ej. "HP 202 32   Sp. Atk 105 0" → 202, 32, 105, 0).
  // Así que las inversiones son el 2º y el 4º, sin importar dónde caiga el
  // hueco entre columnas ni si el juego dibujó las etiquetas legibles.
  const filas=splitRows(num,3);
  if(filas&&filas.length===3&&filas.every(f=>f.length)){
    const porFila=filas.map(f=>{
      const n=(f.slice().sort((a,b)=>(a.x||0)-(b.x||0)).map(l=>l.t).join(" ").match(/\d+/g)||[]).map(Number);
      return n.length===4?[n[1],n[3]]:null;
    });
    if(porFila.every(Boolean)){
      const sp2=[porFila[0][0],porFila[1][0],porFila[2][0],
                 porFila[0][1],porFila[1][1],porFila[2][1]];
      if(sp2.every(n=>n>=0&&n<=SP_MAX))return con(sp2);
    }
  }

  // Método 3, por sub-columnas: se separa por el mayor salto en X y, dentro
  // de cada una, se fuerzan 3 bandas por los mayores saltos en Y. La versión
  // vieja usaba groupRows()+slice(0,3), que agrupaba por una tolerancia fija
  // de altura: si el valor y la inversión quedaban a alturas apenas
  // distintas salían 6 medias filas en vez de 3. splitRows no depende de eso.
  const cols=splitColumns(num);
  if(!cols||cols.left.length<3||cols.right.length<3)return null;
  const tresDe=lado=>{
    const bandas=splitRows(lado,3);
    if(!bandas||bandas.some(b=>!b.length))return null;
    return bandas.map(b=>lastNum(b.slice().sort((a,c)=>(a.x||0)-(c.x||0)).map(l=>l.t).join(" ")));
  };
  const izq=tresDe(cols.left), der=tresDe(cols.right);
  if(!izq||!der)return null;
  const pos=[...izq,...der];
  return pos.every(n=>n!==null&&n>=0&&n<=SP_MAX)?con(pos):null;
}

/** Mergea las dos fases por posición de card (asume la misma grilla de 6 en
    las dos pantallas — es la misma lista de Pokémon, dos tabs distintas del
    mismo "View Details"), arma hasta 6 slot(), y lo guarda según OCR_TARGET:
    equipo nuevo o pisando el activo. Devuelve el HTML del resumen — quien
    llama lo inserta DESPUÉS de render(), nunca antes (render() reconstruye
    #body entero y se llevaría puesto cualquier inserción previa). */
function finishOwnScan(){
  const moves=OCR_DRAFT[0]||[], stats=OCR_DRAFT[1]||[];
  // Los slots que ya había, para no perderlos si una tarjeta no se pudo leer.
  const prev=(activeTeam()&&activeTeam().team)||[];
  const errors=[],team=[],sinNaturaleza=[];
  let leidos=0;
  for(let i=0;i<6;i++){
    const mv=moves[i]||{}, st=stats[i];
    const dex=mv.dexName?findSpecies(mv.dexName):null;
    if(!dex){
      errors.push(`Tarjeta ${i+1}: no reconozco la especie "${mv.dexName||"?"}".`);
      // El equipo SIEMPRE queda con 6 slots. Antes se salteaba la tarjeta
      // ilegible y el equipo quedaba con 4, sin forma de completar los otros
      // dos a mano — el slot que falla se deja como estaba (o uno vacío) y
      // se corrige con los selectores de siempre.
      team.push(prev[i]||slot(DEXN[0]));
      continue;
    }
    leidos++;
    const s=slot(dex),label=S(dex).n;
    if(mv.itemName){const it=findItem(mv.itemName);
      if(it)s.item=it; else errors.push(`${label}: no reconozco el ítem "${mv.itemName}".`)}
    if(mv.abilName){const ab=findAbility(mv.abilName);
      if(ab)s.abil=ab; else errors.push(`${label}: no reconozco la habilidad "${mv.abilName}".`)}
    (mv.moveNames||[]).forEach(name=>{
      if(s.moves.filter(Boolean).length>=4)return;
      const k=findMove(name);
      if(!k){errors.push(`${label}: no reconozco el movimiento "${name}".`);return}
      const free=s.moves.indexOf(""); if(free>=0)s.moves[free]=k;
    });
    if(st){
      s.sp=st.sp;
      // La naturaleza el juego la muestra con flechas de color, no con
      // texto. Si no se pudo determinar queda sin definir (neutra, ×1) en
      // vez de heredar el default del slot: inventarla sesgaría en silencio
      // todos los cálculos de daño y velocidad.
      s.up=st.up||0; s.dn=st.dn||0;
      if(!st.up||!st.dn)sinNaturaleza.push(label);
    }else errors.push(`${label}: no pude leer el reparto de stats — corregilo a mano.`);
    if(!canMega(s))s.mega=false;
    team.push(s);
  }
  if(!leidos)
    return `<div class="card f"><span class="hd">Captura de equipo</span>
      <div class="msg w">No pude leer ningún Pokémon. Probá de nuevo, con el HUD fuera de las tarjetas.</div></div>`;
  // Dónde va lo leído. Antes siempre creaba un equipo nuevo, y reescanear
  // para corregir una lectura fallida dejaba la lista llena de "Equipo
  // escaneado 2/3/4..." (Angel llegó a 5 guardados probando). Ahora se elige.
  let destino;
  if(OCR_TARGET==="active"&&activeTeam()){
    const at=activeTeam();
    at.team=team; MY=team; destino=`Actualicé "${at.name}"`;
  }else{
    const id=newTeamId();
    let name="Equipo escaneado",n=1;
    while(TEAMS.some(t=>t.name===name)){n++;name="Equipo escaneado "+n}
    TEAMS.push({id,name,team});
    ACTIVE_ID=id; MY=team; destino=`Creé "${name}"`;
  }
  B.mpick=0;saveMy();
  return `<div class="card${errors.length?" f":""}"><span class="hd">Captura de equipo<em>${esc(destino)}</em></span>
    <div class="msg${errors.length?" w":""}">${errors.length
      ?`Cargué ${leidos} de 6, con avisos:<br>${errors.map(esc).join("<br>")}`
      :`Cargué los ${leidos} sin problemas.`} Revisá y corregí en MÍO si hace falta.</div>
    ${sinNaturaleza.length?`<div class="msg w" style="margin-top:5px">
      <b>Naturaleza sin determinar</b> en ${esc(sinNaturaleza.join(", "))}. El juego la marca
      con flechas de color, no con texto, así que la captura no la puede leer todavía: quedaron
      en neutra (sin ±10%). Ponela a mano en MÍO → <em>Sube</em> / <em>Baja</em> — cambia daño
      y velocidad, conviene hacerlo antes de calcular nada.</div>`:""}</div>`;
}

/* ═════ VISTAS ═════ */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nm=d=>S(d)?S(d).n:"—";
const opt=(l,v,f)=>l.map(x=>`<option value="${esc(x)}"${x==v?" selected":""}>${esc(f(x))}</option>`).join("");

/* Registro de selectores del render actual. Se reconstruye en cada render, así
   que los closures de apply() siempre ven el estado fresco. */
let REG={}, PICK=null, tHold=0;
/* Volver al turno 1 sin tocar el equipo ni lo que ya dedujiste del rival. */
function resetTurns(){
  B.turn=1;B.weather=null;B.wTurns=0;B.terrain=null;B.tTurns=0;
  B.tw={me:0,them:0};B.tr=0;B.screen={me:0,them:0};
  B.hp={m0:100,m1:100,f0:100,f1:100};
  B.act={m0:actNew(),m1:actNew(),f0:actNew(),f1:actNew()};
  save();render();
}
function sel(list,val,lab,apply,title,deco){
  const id="s"+Object.keys(REG).length;
  REG[id]={list,val,lab,apply,title:title||"",deco};
  return `<button class="sel" data-sel="${id}"><b>${esc(lab(val))}</b><i>▼</i></button>`;
}
/* Pintor para listas de movimientos: banda del color del tipo y, debajo,
   categoría y potencia. Sin esto era imposible encontrar nada. */
const decoMove=k=>{const m=MV[k];
  if(!m)return{c:"transparent",sub:""};
  return {c:T[m[1]]||"transparent",
    sub: m[2]==="E"?"estado":`${m[2]==="F"?"físico":"especial"} · ${m[0]}`};
};
const decoItem=it=>{const r=IT.find(x=>x[0]===it);
  const cat={dmg:"potencia",def:"defensa",spd:"velocidad",sup:"apoyo",res:"resiste",
    typ:"potencia de tipo",x:""}[r?r[2]:"x"]||"";
  const ty=TYPE_ITEM[it]||RES_BERRY[it];
  return {c:ty?T[ty]:"transparent",sub:cat};
};
function vSheet(){
  const P=PICK; if(!P)return "";
  // Con listas largas y sin teclado, saltar por inicial es la única forma
  // razonable de encontrar algo. Solo aparece si de verdad hace falta.
  let jump="";
  if(P.list.length>26){
    const letras=[...new Set(P.list.map(x=>{const l=P.lab(x);
      return (l&&l[0]||"").toUpperCase()}).filter(c=>/[A-Z]/.test(c)))].sort();
    jump=`<div class="abc">${letras.map(c=>
      `<button data-jump="${c}">${c}</button>`).join("")}</div>`;
  }
  return `<div class="sheet" id="sheet"><div class="sh"><b>${esc(P.title)}</b>
    <span style="font-size:9px;color:var(--faint)">${P.list.length}</span>
    <button class="ico" data-shx="1">×</button></div>${jump}
    <div class="list">${P.list.map((x,i)=>{
      const d=P.deco?P.deco(x):null;
      const ini=((P.lab(x)||"")[0]||"").toUpperCase();
      return `<button class="op" data-op="${i}" data-ini="${esc(ini)}" data-on="${String(x)===String(P.val)?1:0}">
        ${d?`<q style="background:${d.c}"></q>`:""}
        <n>${esc(P.lab(x))}${d&&d.sub?`<em>${esc(d.sub)}</em>`:""}</n></button>`}).join("")}</div></div>`;
}

function render(){
  REG={};
  try{ renderInner() }catch(e){
    // Nunca dejar la interfaz muerta: si una vista falla, se muestra el error
    // y los eventos se enganchan igual para poder seguir navegando.
    $("#body").innerHTML=`<div class="card f"><span class="hd">Error en la vista</span>
      <div class="msg w">${esc(e&&e.message||e)}</div>
      <div class="msg" style="margin-top:5px">Probá otra pestaña. Si se repite, mandame
      este texto.</div></div>`;
  }
  try{ wire() }catch(e){}
  $("#bPin").dataset.on=B.pinned?"1":"0";
  $("#bZip").dataset.on=B.compact?"1":"0";
  $("#bTurn").innerHTML=`<span style="font-size:10px;font-weight:800">T${B.turn}</span>`;
  $("#bTurn").onpointerdown=()=>{tHold=setTimeout(()=>{tHold=0;buzz(1);resetTurns()},600)};
  $("#bTurn").onpointerup=$("#bTurn").onpointercancel=()=>{if(tHold)clearTimeout(tHold)};
  document.querySelectorAll(".rail .tab").forEach(x=>x.dataset.on=x.dataset.tab===B.tab?"1":"0");
}
function renderInner(){
  $("#body").innerHTML=(B.compact?vCompact()
    :{pre:vPre,field:vField,foe:vFoe,mine:vMine,calc:vCalc,set:vSet}[B.tab]())+vSheet();
}

/* ── PREVIA: qué va a sacar y qué sacar vos ── */
/* 12 Pokémon (6 propios + 6 rivales) por velocidad base, sin modificadores de
   turno (Tailwind/Espacio Raro todavía no están activos antes del turno 1).
   Los propios tienen velocidad exacta; los rivales, un rango — nunca se
   muestra un solo número para el rival, sería fingir una precisión que no
   hay (vision.md, "confianza calibrada"). Se ordena por el máximo del rango:
   la lectura conservadora es asumir que puede ser tan rápido como el rango
   permite. */
/** Velocidad que tendría m si mega-evolucionara, aunque todavía no lo haya
    hecho (m.mega en false) — null si no lleva piedra o ya está megaevolucionado
    (ahí myStat() ya refleja el cambio solo, vía myDex()). */
const megaSpeed=m=>{
  if(m.mega)return null;
  const md=canMega(m); if(!md)return null;
  return stOf(S(md).s[5],m.sp[5],natMul(5,m.up,m.dn));
};
function fullSpeedOrder(){
  const mine=MY.filter(m=>m.dex&&S(m.dex)).map(m=>
    ({me:1,n:nm(myDex(m)),v:myStat(m,5),lo:null,hi:null,megaV:megaSpeed(m)}));
  const foes=B.team.filter(f=>f.dex&&S(f.dex)).map(f=>{const r=spdRange(f);
    return {me:0,n:nm(f.dex),v:r.max,lo:r.min,hi:r.max,megaV:null}});
  return [...mine,...foes].sort((a,b)=>b.v-a.v);
}

/* Para cada rival (los 6, no solo los que se estima que va a sacar), su
   mejor golpe posible contra el propio que peor lo resiste. Es información
   sobre el rival — qué tan peligroso es cada uno — no una recomendación de
   qué hacer con esa información: no viola decisions.md #1/#19, mismo
   principio que ya usa "Te hacen" en Glance. */
function topThreats(){
  const mine=MY.filter(m=>m.dex&&S(m.dex));
  const foes=B.team.filter(f=>f.dex&&S(f.dex));
  if(!mine.length||!foes.length)return [];
  return foes.map(f=>{
    const pool=foeMovePool(f);
    let worst=null;
    for(const m of mine){
      const r=best(f.dex,myDex(m),{doubles:B.doubles,aItem:f.item,aAb:f.abil,
        dStat:statsOf(m),dAb:m.abil},pool.moves);
      if(r&&r.e>0&&(!worst||r.R[15]/r.maxHP>worst.r.R[15]/worst.r.maxHP))worst={r,m};
    }
    return worst&&{f,m:worst.m,r:worst.r,src:pool.src};
  }).filter(Boolean).sort((a,b)=>(b.r.R[15]/b.r.maxHP)-(a.r.R[15]/a.r.maxHP)).slice(0,4);
}

/** Sprint 2.6 (`inference.md` §10, `decisions.md` #21 parte 2): "si cambia a
    X, tu Y queda expuesto". Entre los rivales que NO están en campo ahora
    mismo (banca — no confirmados afuera, no el activo actual) cuál pegaría
    más fuerte contra el propio enfocado si el rival lo manda. No predice que
    vaya a pasar — describe la peor consecuencia posible de un cambio, con la
    misma marca de fuente (visto/meta/posible) que ya usa "Mayores amenazas"
    en Previa, para que sea inspeccionable igual que el resto. */
function benchThreat(mine,foes,fi){
  const mi=mine[fi]; if(mi===undefined)return null;
  const m=MY[mi]; if(!m)return null;
  const activeSet=new Set(foes);
  let worst=null;
  B.team.forEach((f,fIdx)=>{
    if(!f||!f.dex||!S(f.dex)||activeSet.has(fIdx)||f.out)return;
    const pool=foeMovePool(f);
    const r=best(f.dex,myDex(m),{doubles:B.doubles,aItem:f.item,aAb:f.abil,
      dStat:statsOf(m),dAb:m.abil},pool.moves);
    if(r&&r.e>0&&(!worst||r.R[15]/r.maxHP>worst.r.R[15]/worst.r.maxHP))
      worst={f,r,src:pool.src};
  });
  return worst;
}
/* ── Motor de prioridad (Fase 2, sprint 2.4, `inference.md` §10) ──
   Qué información es más probable que cambie la decisión de ESTE turno.
   relevancia = pesoBase(tipo) × multiplicadorDeUmbral. Deliberadamente dos
   factores simples e inspeccionables, sin pesos finos ajustados a mano —
   ese error ya se cometió con `predict()` (ver `future.md`).
   Jerarquiza SEÑALES para decidir qué sube a Glance, nunca opciones de
   ataque: `decisions.md` #19 sigue vigente, cero ranking de movimientos
   propios. El orden de peso base salió de la sesión de asesoría VGC
   (`decisions.md` #20): velocidad crítica > rango de KO > amenaza entrante >
   amenaza de banca (sprint 2.6). */
const PRIORITY_WEIGHTS={speed:100,ko:90,threat:80,back:70};
/** ¿La velocidad exacta del propio enfocado cae DENTRO del rango incierto
    de algún rival activo? Si sí, todavía no se sabe quién pega primero —
    cruza la frontera de decisión más básica de todas.
    Simplificación deliberada y documentada: compara el stat base sin
    etapas/estado/Tailwind — esos modifican ambos lados por igual, así que
    si hay incertidumbre a nivel de reparto, en general sigue habiéndola con
    los modificadores puestos. No es una prueba exacta, es la señal barata
    que alcanza para decidir si vale la pena mostrarla en Glance. */
function speedCriticalPair(mine,foes,fi){
  const mi=mine[fi]; if(mi===undefined)return null;
  const m=MY[mi]; if(!m)return null;
  const myV=myStat(m,5);
  for(const fIdx of foes){
    const f=B.team[fIdx]; if(!f)continue;
    const r=spdRange(f);
    if(myV>=r.min&&myV<=r.max)return f;
  }
  return null;
}
/** `S1` (de `suggest()`), `worst`/`wv` (la amenaza calculada) ya vienen
    computados por quien llama — esta función no recalcula daño, solo
    decide cuál de las señales ya disponibles vale más la pena mostrar
    primero. Devuelve `null` si ninguna cruza una frontera real. */
function priorityAlert(mine,foes,fi,S1,worst,wv){
  const candidatos=[];
  const spdFoe=speedCriticalPair(mine,foes,fi);
  if(spdFoe)candidatos.push({tipo:"speed",peso:PRIORITY_WEIGHTS.speed,
    texto:`Velocidad sin definir contra ${esc(nm(spdFoe.dex))}: según su reparto, puede ir antes o después.`});
  // x.dmg es el resultado crudo de calc() (trae R/maxHP/e, no .ko todavía) —
  // .ko lo calcula verdict(), como ya hace el resto del HUD para mostrar el
  // resultado. Mismo dato, no una segunda fuente de verdad.
  for(const x of (S1||[])){
    if(!x.dmg)continue;
    const vd=verdict(x.dmg,x.cur);
    if(typeof vd.ko==="number"&&vd.ko>0&&vd.ko<16){
      candidatos.push({tipo:"ko",peso:PRIORITY_WEIGHTS.ko,
        texto:`${esc(mvName(x.k))}: no todas las tiradas matan (${esc(vd.txt)}).`});
      break;
    }
  }
  if(worst&&wv&&typeof wv.ko==="number"&&wv.ko>0&&wv.ko<16)
    candidatos.push({tipo:"threat",peso:PRIORITY_WEIGHTS.threat,
      texto:`${esc(nm(worst.f.dex))} con ${esc(mvName(worst.r.move))}: no todas las tiradas te matan (${esc(wv.txt)}).`});
  // Sprint 2.6 (`decisions.md` #21 parte 2): "si cambia a X, tu Y queda
  // expuesto" — describe la consecuencia de un cambio posible, no lo elige
  // ni predice que vaya a pasar. Cualquier chance real de KO (mixto o
  // garantizado) es información nueva que el resto de las señales de arriba
  // no cubre, porque esas solo miran el matchup activo ahora mismo.
  const mi=mine[fi],m=mi!==undefined?MY[mi]:null;
  const bench=m?benchThreat(mine,foes,fi):null;
  if(bench){
    const vdBench=verdict(bench.r,bench.r.maxHP);
    if(typeof vdBench.ko==="number"&&vdBench.ko>0){
      const marca={visto:"ya se lo vimos usar",meta:"común en el meta",posible:"solo por learnset"}[bench.src]||"";
      candidatos.push({tipo:"back",peso:PRIORITY_WEIGHTS.back,
        texto:`Si el rival cambia a ${esc(nm(bench.f.dex))}, ${esc(nm(myDex(m)))} queda expuesto a ${esc(mvName(bench.r.move))} (${esc(vdBench.txt)}${marca?`, ${marca}`:""}).`});
    }
  }
  if(!candidatos.length)return null;
  candidatos.sort((a,b)=>b.peso-a.peso);
  return candidatos[0];
}

function vPre(){
  const so=fullSpeedOrder(), th=topThreats();
  if(!so.length&&!th.length)
    return `<div class="card"><div class="msg">Escaneá al rival con ↻ y cargá tu equipo en MÍO.</div></div>`;

  let h=`<div class="card"><span class="hd">Orden de velocidad<em>los 12, sin modificadores de turno</em></span>
    ${so.map((x,i)=>`<div class="row" style="padding:4px 8px">
      <b style="color:${x.me?"var(--pick)":"var(--foe-row)"}">${i+1}. ${esc(x.n)}${
        x.megaV?`<s>si megaevoluciona: ${x.megaV}</s>`:""}</b>
      <u>${x.me?x.v:x.lo+"–"+x.hi}</u></div>`).join("")}</div>
  <div class="card f"><span class="hd">Mayores amenazas<em>su mejor golpe, contra tu peor respuesta</em></span>
    ${th.length?th.map(t=>{const vd=verdict(t.r,t.r.maxHP);
      // De dónde salió el movimiento: visto en partida (hecho), común en el
      // meta (prior), o solo posible por learnset. Sin esta marca los tres
      // se leían igual y "posible" parecía una amenaza confirmada.
      const marca={visto:"✔ visto",meta:"○ común en meta",posible:"◇ solo posible"}[t.src]||"";
      return `<div class="row"><b>${esc(nm(t.f.dex))}<s>a ${esc(nm(myDex(t.m)))} · ${esc(mvName(t.r.move))}${
        marca?` · ${marca}`:""}</s></b>
        <u class="${vd.cls}">${vd.txt}</u></div>`}).join("")
      :`<div class="msg">Sin datos suficientes todavía — escaneá al rival y cargá tu equipo.</div>`}</div>`;

  // Predicción de team preview (quién va a sacar cada uno): por ahora el
  // algoritmo no acierta lo suficiente como para ser útil (feedback real de
  // Angel) — queda al fondo, sin estorbar, hasta un rediseño (future.md).
  const p=predict();
  if(p){
    const line=(x,tag,cls)=>`<div class="pl"><i class="${cls}">${tag}</i>
      <b>${esc(nm(x.f?x.f.dex:myDex(x.m)))}<s>${x.role>=20?"control de ritmo":x.off>=95?"amenaza directa":x.surv>=55||x.def>=55?"aguanta":"apoyo"}</s></b>
      <u>${Math.round(x.score)}</u></div>`;
    h+=`<div class="cols" style="margin-top:10px">
      <div class="card f"><span class="hd">Va a sacar<em>predicción, poco fiable todavía</em></span>
        ${p.theirLeads.map(x=>line(x,"LEAD","")).join("")}
        ${p.theirBack.map(x=>line(x,"BACK","b")).join("")}
        <div class="msg" style="margin-top:5px">Orden por probabilidad, no certeza.</div></div>
      <div class="card"><span class="hd">Sacá vos</span>
        ${p.leads.map(x=>line(x,"LEAD","")).join("")}
        ${p.back.map(x=>line(x,"BACK","b")).join("")}</div></div>
    <div class="card d"><span class="hd">Por qué</span>
      ${p.notes.length?p.notes.map(n=>`<div class="note">${esc(n)}</div>`).join("")
        :`<div class="msg">Sin ejes marcados: es un cambio de golpes directo, priorizá daño y resistencia.</div>`}</div>`;
  }
  return h;
}

function hpBar(id,label,val){
  const cls=val<=25?"crit":val<=50?"low":"";
  return `<div class="hpbox ${cls}"><div class="hplab"><b>${esc(label)}</b><u>${val}%</u></div>
    <div class="hpwrap"><div class="hpbg"><div class="hpfill" style="width:${val}%"></div></div>
      <div class="knob" style="left:${val}%"></div>
      <input type="range" min="1" max="100" step="1" value="${val}" data-hp="${id}"></div></div>`;
}

/* Modo compacto: tres bloques y nada más. Para los últimos 15 segundos. */
function vCompact(){
  const mine=(B.doubles?B.mine:[B.mine[0]]).filter(i=>MY[i]);
  const foes=(B.doubles?B.foe:[B.foe[0]]).filter(i=>B.team[i]?.dex);
  if(!mine.length||!foes.length)return `<div class="card"><div class="msg">Elegí los activos en CAMPO.</div></div>`;
  const fi=Math.min(B.focus,mine.length-1);
  const m=MY[mine[fi]];
  const S1=suggest(mine[fi],fi,mine,foes);

  // orden de velocidad reducido a lo esencial
  const spd=[];
  mine.forEach((mi,i)=>{const a=B.act["m"+i]||actNew();
    spd.push({me:1,n:nm(myDex(MY[mi])),
      v:effSpd(Math.floor(myStat(MY[mi],5)*(MY[mi].item==="Pañuelo Elección"?1.5:1)*stg((a.bo||[0,0,0,0,0])[4],0,1)),"me",a.sta)})});
  foes.forEach((x,i)=>{const f=B.team[x],a=B.act["f"+i]||actNew();
    spd.push({me:0,n:nm(f.dex),v:effSpd(Math.floor(spdRange(f).max*stg((a.bo||[0,0,0,0,0])[4],0,1)),"them",a.sta)})});
  spd.sort((a,b)=>b.v-a.v);

  // la amenaza más grande sobre el Pokémon enfocado
  let worst=null;
  foes.forEach((x,i)=>{const f=B.team[x];
    const r=best(f.dex,myDex(m),{...ctxFor("them"),aItem:f.item,aAb:f.abil,
      dStat:statsOf(m),dAb:m.abil},foeMoves(f));
    if(r&&(!worst||r.R[15]>worst.r.R[15]))worst={r,f}});
  const myHp=Math.floor(myStat(m,0)*(B.hp["m"+fi]??100)/100);
  const wv=worst?verdict(worst.r,myHp):null;
  // Sprint 2.4: qué señal es más probable que cambie la decisión de este
  // turno, primero en Glance — no elige la jugada, ordena qué mirar.
  const alerta=priorityAlert(mine,foes,fi,S1,worst,wv);

  return `<div class="card d" style="padding:6px">
    <div class="pills">${mine.map((mi,i)=>
      `<button class="p" data-fc="${i}" data-on="${i===fi?1:0}">${esc(nm(myDex(MY[mi])))}</button>`).join("")}
      ${mine.map((mi,i)=>`<span class="p" style="background:none;padding:5px 4px">${B.hp["m"+i]??100}%</span>`).join("")}</div></div>
  ${alerta?`<div class="card f" style="padding:6px 8px"><div class="msg" style="color:var(--cream)">${alerta.texto}</div></div>`:""}
  <div class="card"><span class="hd">Tus movimientos<em>por resultado, no por orden</em></span>
    ${S1.length?S1.map(x=>{const vd=x.dmg?verdict(x.dmg,x.cur):null;return`<div class="pl"><i class="b">${x.slot+1}</i>
      <b>${esc(mvName(x.k))}${x.tgt?` <span style="color:var(--foe-row)">→ ${esc(x.tgt)}</span>`:""}<s>${esc(x.why)}</s></b>
      <u class="${vd?vd.cls:"no"}">${vd?vd.txt:"apoyo"}</u></div>`}).join("")
      :`<div class="msg">Cargá los movimientos de ${esc(nm(myDex(m)))} en MÍO.</div>`}</div>
  <div class="cols">
    <div class="card f" style="padding:8px"><span class="hd">Te hacen</span>
      ${worst?`<div class="row"><b>${esc(nm(worst.f.dex))}<s>${esc(mvName(worst.r.move))}</s></b>
        <u class="${wv.cls}">${wv.txt}<s>${wv.pct}</s></u></div>`:`<div class="msg">—</div>`}</div>
    <div class="card d" style="padding:8px"><span class="hd">Orden</span>
      ${spd.slice(0,4).map((x,i)=>`<div class="row" style="padding:4px 8px">
        <b style="color:${x.me?"var(--pick)":"var(--foe-row)"}">${i+1}. ${esc(x.n)}</b>
        <u>${Math.abs(x.v)}</u></div>`).join("")}</div></div>`;
}

/* Panel de "quién entra": qué 4 (o menos) propios se llevaron a la partida y
   qué rivales de los 6 de team preview están confirmados en ella (arranca
   en los que se ven activos, se puede sumar más a medida que el rival los
   revela). Grande y arriba de todo mientras no hay nada marcado; una vez que
   hay al menos uno de cada lado, se compacta y baja al final de Campo —
   sigue editable ahí, nunca desaparece del todo. */
function vBrought(){
  const empty=!B.myBrought.length&&!B.team.some(f=>f.brought);
  return `<div class="card d"><span class="hd">Quién entra${empty?"":"<em>tocá para corregir o sumar</em>"}</span>
    <div class="cap">Rivales confirmados en la partida</div>
    <div class="pills">${B.team.map((f,i)=>f.dex?
      `<button class="p" data-brf="${i}" data-on="${f.brought?1:0}">${esc(nm(f.dex))}</button>`:"").join("")}</div>
    <div class="cap" style="margin-top:6px">Tus 4 elegidos</div>
    <div class="pills">${MY.map((m,i)=>
      `<button class="p" data-brm="${i}" data-on="${B.myBrought.includes(i)?1:0}">${esc(nm(myDex(m)))}</button>`).join("")}</div>
    ${empty?`<div class="msg" style="margin-top:5px">Marcá quién entró de cada lado — con eso alcanza para calcular todo lo demás solo.</div>`:""}</div>`;
}

function vField(){
  const mine=(B.doubles?B.mine:[B.mine[0]]).filter(i=>MY[i]);
  const foes=(B.doubles?B.foe:[B.foe[0]]).filter(i=>B.team[i]?.dex);
  const mineBrought=B.myBrought.length?B.myBrought:mine;
  const foesBrought=broughtFoes().length?broughtFoes():foes;
  const A=k=>B.act[k]||actNew();
  // Un benqueado no tiene "casilla activa" — y no la necesita: las etapas de
  // stat se resetean al cambiar de Pokémon en el juego real, así que
  // calcularlo sin modificadores es lo mecánicamente correcto, no un atajo.
  const actFor=(idx,arr,prefix)=>{const p=arr.indexOf(idx);return p>=0?A(prefix+p):actNew()};

  const brought=vBrought();
  // Se queda arriba hasta completar los 2 rivales (1 en individual) Y los 4
  // propios — no apenas se toca el primero. Angel lo pidió así después de
  // probarlo: bajarlo de golpe al primer toque interrumpe el flujo de
  // marcar los 6 seguidos.
  const needFoes=B.doubles?2:1;
  const showBroughtOnTop=broughtFoes().length<needFoes||B.myBrought.length<4;
  let h=showBroughtOnTop?brought:"";

  h+=`<div class="card d"><span class="hd">Turno ${B.turn}<em>${B.doubles?"dobles":"individual"}</em></span>
    <div class="cols"><div><div class="cap">Tus activos</div>
      ${(B.doubles?[0,1]:[0]).map(i=>`<div style="margin-bottom:3px">${
        sel(mineBrought,B.mine[i],j=>nm(myDex(MY[j])),v=>{B.mine[i]=+v;save()},"Tu activo")}</div>`).join("")}</div>
    <div><div class="cap">Rivales</div>
      ${(B.doubles?[0,1]:[0]).map(i=>`<div style="margin-bottom:3px">${
        sel(foesBrought,B.foe[i],j=>nm(B.team[j].dex)+(B.team[j].out?" ✕":""),
          v=>{B.foe[i]=+v;syncFoe();save()},"Rival en campo")}</div>`).join("")}</div></div></div>`;

  h+=`<div class="cols">
    <div class="card"><span class="hd">Tus PS</span>
      ${mine.map((mi,i)=>hpBar("m"+i,nm(myDex(MY[mi])),B.hp["m"+i]??100)).join("")}</div>
    <div class="card f"><span class="hd">PS rival</span>
      ${foes.map((fi,i)=>hpBar("f"+i,nm(B.team[fi].dex),B.hp["f"+i]??100)).join("")}</div></div>`;

  // estados y etapas del activo elegido
  const keys=[...mine.map((mi,i)=>["m"+i,nm(myDex(MY[mi]))]),...foes.map((fi,i)=>["f"+i,nm(B.team[fi].dex)])];
  const ak=keys.some(k=>k[0]===B.apick)?B.apick:(keys[0]?.[0]||"m0");
  const a=A(ak);
  h+=`<div class="card d"><span class="hd">Estado y etapas</span>
    <div class="pills" style="margin-bottom:5px">${keys.map(([k,n])=>
      `<button class="p" data-ap="${k}" data-on="${k===ak?1:0}">${esc(n)}</button>`).join("")}</div>
    <div class="pills" style="margin-bottom:6px">${STATUS.map(s=>
      `<button class="p" data-sta="${s}" data-on="${(a.sta||"—")===s?1:0}">${s}</button>`).join("")}</div>
    <div class="cols">${BON.map((n,i)=>`<div class="bo"><b>${n}</b><div class="st">
      <button data-bo="${i}" data-d="-1">−</button>
      <u class="${a.bo[i]>0?"up":a.bo[i]<0?"dn":""}">${a.bo[i]>0?"+":""}${a.bo[i]}</u>
      <button data-bo="${i}" data-d="1">+</button></div></div>`).join("")}</div>
    ${a.sta==="quemado"?`<div class="msg w" style="margin-top:4px">Quemado: su daño físico va a la mitad.</div>`:""}
    ${a.sta==="paralizado"?`<div class="msg w" style="margin-top:4px">Paralizado: velocidad a la mitad.</div>`:""}</div>`;

  h+=`<div class="card"><span class="hd">Matriz de daño<em>${mineBrought.length}×${foesBrought.length}, activos y banca</em></span>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:9.5px">
    <tr><td></td>${foesBrought.map(fi=>`<td style="text-align:center;padding:3px;font-weight:800;color:var(--foe-row)">${esc(nm(B.team[fi].dex))}</td>`).join("")}</tr>
    ${mineBrought.map(mi=>{
      const m=MY[mi],am=actFor(mi,mine,"m");
      return `<tr><td style="font-weight:800;padding:3px;color:var(--pick)">${esc(nm(myDex(m)))}</td>${
        foesBrought.map(fi=>{
          const f=B.team[fi],df=actFor(fi,foes,"f");
          const toThem=best(myDex(m),f.dex,{...ctxFor("me"),aStat:statsOf(m),aItem:m.item==="—"?null:m.item,
            aAb:m.abil,aBo:am.bo,aSta:am.sta,dHP:0,dSP:0,dItem:f.item,dAb:f.abil,dBo:df.bo},myMoves(m));
          const fromThem=best(f.dex,myDex(m),{...ctxFor("them"),aItem:f.item,aAb:f.abil,aBo:df.bo,aSta:df.sta,
            dStat:statsOf(m),dAb:m.abil,dBo:am.bo},foeMoves(f));
          const vTo=verdict(toThem,toThem?toThem.maxHP:0),vFrom=verdict(fromThem,fromThem?fromThem.maxHP:0);
          return `<td style="text-align:center;padding:3px"><div class="${vTo.cls}">→${vTo.txt}</div><div class="${vFrom.cls}">←${vFrom.txt}</div></td>`;
        }).join("")}</tr>`;
    }).join("")}
    </table></div>
    ${mineBrought.length&&foesBrought.length?"":`<div class="msg" style="margin-top:5px">Marcá quién entra más abajo para ver la matriz.</div>`}</div>`;

  h+=`<div class="cols">
    <div class="card d"><span class="hd">Velocidad</span>${vSpeed(mine,foes)}</div>
    <div class="card d"><span class="hd">Campo</span>${vChips()}</div></div>`;
  if(!showBroughtOnTop)h+=brought;
  return h;
}

function rowFx(who,sub,v,r,cur){
  let t="";
  if(r&&r.e>0&&cur>0)t=`<div class="track">${r.R.map(x=>
    `<div class="tick${x>=cur?" x":""}" style="left:${Math.min(99,x/cur*100)}%"></div>`).join("")}</div>`;
  return `<div class="row"><b>${esc(who)}<s>${esc(sub)}</s>${t}</b>
    <u class="${v.cls}">${v.txt}<s>${v.pct}</s></u></div>`;
}

function vSpeed(mine,foes){
  const L=[];
  mine.forEach((mi,i)=>{const m=MY[mi],a=B.act["m"+i]||actNew();
    let v=myStat(m,5)*(m.item==="Pañuelo Elección"?1.5:1);
    v=Math.floor(v*stg(a.bo[4],0,1));
    L.push({k:"me",n:nm(myDex(m)),v:effSpd(v,"me",a.sta),sure:1,tag:a.sta==="paralizado"?"para":""})});
  foes.forEach((fi,i)=>{const f=B.team[fi],a=B.act["f"+i]||actNew(),r=spdRange(f);
    const lo=Math.floor(r.min*stg(a.bo[4],0,1)),hi=Math.floor(r.max*stg(a.bo[4],0,1));
    L.push({k:"them",n:nm(f.dex),v:effSpd(hi,"them",a.sta),lo:effSpd(lo,"them",a.sta),
      sure:f.spdSure||f.itemSure,tag:f.item==="Pañuelo Elección"?"Pañuelo":a.sta==="paralizado"?"para":""})});
  L.sort((a,b)=>b.v-a.v);
  return L.map((x,i)=>`<div class="row"><b style="flex:0 0 14px;color:var(--faint)">${i+1}</b>
    <b style="color:${x.k==="me"?"var(--pick)":"var(--foe-row)"}">${esc(x.n)}</b>
    <u class="${x.sure?"cf":""}">${x.lo!==undefined&&shown(x.lo)!==shown(x.v)?shown(x.lo)+"–"+shown(x.v):shown(x.v)}</u>
    ${x.tag?`<span class="p" data-on="1" style="padding:2px 7px">${x.tag}</span>`:""}</div>`).join("")
    +(B.tr>0?`<div class="msg w" style="margin-top:4px">Espacio Raro ${B.tr}: el lento va primero.</div>`:"");
}

function vChips(){
  const c=(k,v,on,l)=>`<button class="p" data-${k}="${v}" data-on="${on?1:0}">${l}</button>`;
  return `<div class="pills">
    ${["sol","lluvia"].map(x=>c("w",x,B.weather===x,x+(B.weather===x?` <em>${B.wTurns}</em>`:""))).join("")}
    ${["eléctrico","hierba","psíquico"].map(x=>c("t",x,B.terrain===x,x.slice(0,4)+(B.terrain===x?` <em>${B.tTurns}</em>`:""))).join("")}
    ${c("tw","me",B.tw.me>0,"TW vos"+(B.tw.me>0?` <em>${B.tw.me}</em>`:""))}
    ${c("tw","them",B.tw.them>0,"TW rival"+(B.tw.them>0?` <em>${B.tw.them}</em>`:""))}
    ${c("tr","1",B.tr>0,"Esp. Raro"+(B.tr>0?` <em>${B.tr}</em>`:""))}
    ${c("sc","me",B.screen.me>0,"Pant. vos"+(B.screen.me>0?` <em>${B.screen.me}</em>`:""))}
    ${c("sc","them",B.screen.them>0,"Pant. rival"+(B.screen.them>0?` <em>${B.screen.them}</em>`:""))}</div>`;

function vFoe(){
  const f=B.team[B.pick],sp=f?S(f.dex):null,m=f?metaOf(f.dex):null;
  let h=`<div class="team">${B.team.map((x,i)=>
    `<button class="mon" data-pick="${i}" data-on="${i===B.pick?1:0}" data-out="${x.out?1:0}">
      <span class="fg">${x.shiny?"✦":x.confidence<.12?"⚠":x.itemSure?"●":""}</span>
      <b>${esc(nm(x.dex))}</b><s>${S(x.dex)?S(x.dex).s[5]:"—"}</s></button>`).join("")}</div>`;
  if(!f||!sp)return h+`<div class="card f"><div class="msg">Escaneá la vista previa con ↻.</div></div>`;
  const r=spdRange(f);
  h+=`<div class="cols"><div class="card f"><span class="hd">${esc(sp.n)}<em>${m?m.usage+"%":"sin datos"}</em></span>
    <div class="cap" style="margin-top:2px">${f.confidence<.5?"¿Mal leído? Corregí acá":"Especie"}</div>
    ${sel(DEXN,f.dex,x=>S(x).n,v=>{
      const antes=f.dex;
      f.dex=+v;f.confidence=1;f.item=null;f.itemSure=false;f.abil=null;f.moves=[];
      f.spdMin=0;f.spdMax=9999;f.spdSure=false;f.bulk=null;syncFoe();
      // Corregir la especie invalida todo lo deducido sobre ese rival. Queda
      // registrado como evento en vez de borrarse en silencio: es la
      // corrección de usuario que `inference.md` §2 llama userCorrection, y
      // es lo que hace que el resto del log siga siendo interpretable.
      logEvent("speciesCorrected",{foe:B.pick,dex:+v,was:antes});
      save()
    },"Corregir especie")}
    ${f.shiny?`<div class="row"><b>Variocolor</b><u class="cf">✦</u></div>`:""}
    ${whyRow("speed","Velocidad",`${r.min}–${r.max}`,f.spdSure?"cf":"",speedHypothesis(B.pick).byEvent)}
    ${whyRow("item","Objeto",f.item?esc(itName(f.item))+(itemHypothesis(B.pick).level==="deduced"?" (deducido)":""):"?",
      f.itemSure?"cf":"",itemHypothesis(B.pick).byEvent)}
    ${whyRow("abil","Habilidad",f.abil?esc(abilName(f.abil)):"?",f.abil?"cf":"",
      abilityHypothesis(B.pick).byEvent,f.abil&&ABIL_DESC[f.abil])}
    ${f.bulk?whyRow("bulk","Resistencia deducida",
      `PS ${f.bulk.hp[0]}–${f.bulk.hp[1]} · Def ${f.bulk.df[0]}–${f.bulk.df[1]}`,"cf",f.bulk.byEvent):""}</div>
  <div class="card d"><span class="hd">Observar</span><div class="pills">
      <button class="p" data-obs="fast">Se movió antes</button>
      <button class="p" data-obs="slow">Se movió después</button>
      <button class="p" data-obs="out">${f.out?"Revivir":"Debilitado"}</button></div>
    <div class="cap" style="margin-top:7px">Confirmar por daño</div>
    <div class="f3">${sel(MY.map((m,j)=>j),B.obs.a,j=>nm(myDex(MY[j])),v=>{B.obs.a=+v;save()},"Con cuál")}
    ${sel(dmgPool(myDex(MY[B.obs.a]||MY[0])),B.obs.m,mvName,v=>{B.obs.m=v;save()},"Con qué movimiento",decoMove)}
    ${sel([...Array(20).keys()].map(i=>(i+1)*5),B.obs.p,x=>x+"%",v=>{B.obs.p=+v;save()},"Cuánto le bajó")}</div>
    <button class="btn" id="oGo" style="margin-top:5px">Deducir resistencia</button>
    <div class="msg" id="oOut" style="margin-top:5px">El % real que le bajaste descarta repartos.</div></div></div>`;
  h+=`<div class="card"><span class="hd">Habilidad<em>tocá la que confirmes</em></span><div class="pills">${
    abilsOf(f.dex).map(ab=>`<button class="p" data-fab="${esc(ab)}" data-on="${f.abil===ab?1:0}">${esc(abilName(ab))}${
      (m?.abilities||[]).find(x=>x[0]===ab)?`<em>${(m.abilities.find(x=>x[0]===ab))[1]}%</em>`:""}</button>`).join("")}</div>
    ${f.abil==="intimidate"?`<div class="msg w" style="margin-top:5px">Al entrar baja −1 el Ataque de tus dos activos. Marcalo en CAMPO → Estado y etapas.</div>`:""}</div>`;
  if(m){
    h+=`<div class="cols"><div class="card"><span class="hd">Objetos</span><div class="pills">${
      m.items.map(([i,p])=>`<button class="p" data-item="${esc(i)}" data-on="${f.item===i?1:0}">${esc(i)}<em>${p}%</em></button>`).join("")}</div></div>
    <div class="card"><span class="hd">Movimientos</span><div class="pills">${
      m.moves.map(([i,p])=>`<button class="p" data-mvk="${esc(i)}" data-on="${f.moves.includes(i)?1:0}">${esc(i)}<em>${p}%</em></button>`).join("")}</div></div></div>
    <div class="card"><span class="hd">Repartos habituales</span>${
      m.spreads.map(s=>`<div class="row"><b>${esc(s.label)}<s>${esc(s.nat)}</s></b><u>${s.sp.join("/")}<s>${s.pct}%</s></u></div>`).join("")}</div>`;
    if(m.sets){
      const cs=compatibleSets(f);
      h+=`<div class="card"><span class="hd">Sets conocidos<em>${
        f.moves.filter(x=>MV[x]).length?`${cs.length} de ${m.sets.length} siguen siendo compatibles`:"combos completos vistos en torneos reales"}</em></span>
        ${cs.map(s=>`<div class="row"><b>${s.moves.map(k=>esc(mvName(k))).join(" · ")}</b><u>${s.pct}%</u></div>`).join("")}
        ${!cs.length?`<div class="msg">Ningún set conocido incluye todo lo que ya viste — puede traer un set fuera de los ${m.setsSample||0} más comunes.</div>`:""}</div>`;
    }
  }
  h+=vMovesPP(f);
  h+=vEvidence(B.pick);
  return h;
}

/** PP y efecto de los movimientos ya vistos (Fase 2, sprint 2.5,
    `architecture.md` §11.2). Decidido por Angel el 2026-08-03: se muestra
    para TODOS los movimientos vistos, no solo los "clave" — el ruido en
    Glance lo resuelve el motor de prioridad (`decisions.md` #21), no
    recortar el dato acá. El PP es manual (no hay forma de leerlo de
    pantalla): un tap resta 1, mismo espíritu que "Se movió antes/después".
    Sin dex.json cargado no hay PP máximo — se muestra el efecto igual, sin
    el contador, en vez de fingir un número. */
function vMovesPP(f){
  if(!f.moves.length)return "";
  return `<div class="card"><span class="hd">PP y efecto<em>tocá el nombre para el efecto</em></span>
    ${f.moves.map(k=>{
      const d=mv(k);
      const openKey="mv_"+k;
      const open=WHY_OPEN[openKey];
      const used=f.ppUsed[k]||0;
      const max=d&&d.pp;
      const left=max?Math.max(0,max-used):null;
      return `<div class="row" data-why="${esc(openKey)}" style="cursor:pointer">
          <b>${esc(mvName(k))}${open?`<s>${esc(d&&d.note||"sin descripción cargada")}</s>`:""}</b>
          <u>${max?`${left}/${max}`:"PP ?"}</u></div>
        ${max?`<div class="pills" style="margin:-2px 0 6px">
          <button class="p" data-pp="${esc(k)}" data-d="-1">−1 usado</button>
          <button class="p" data-pp="${esc(k)}" data-d="1">+1</button></div>`:""}`;
    }).join("")}</div>`;
}

/* ── Registro de evidencia (Fase 2, sprint 2.1) ──
   Lo observado sobre un rival, en orden, tal como quedó en el event log.
   Son HECHOS, no deducciones: acá no se interpreta nada. La cadena
   "evento → hipótesis descartada" llega en el sprint 2.2 (`inference.md`). */
function vEvidence(i){
  const evs=visibleEvents(i);
  if(!evs.length)return `<div class="card d"><span class="hd">Qué observamos</span>
    <div class="msg">Todavía nada de este rival. Lo que marques acá arriba —
    movimientos, objeto, orden de velocidad, daño — queda registrado y se puede repasar.</div></div>`;
  return `<div class="card d"><span class="hd">Qué observamos<em>${evs.length} en el registro</em></span>
    ${evs.map(e=>`<div class="row"><b>T${e.turn}<s>${describeEvent(e)}</s></b>${
      UNDOABLE.has(e.kind)?`<button class="ico" data-undo="${e.id}" title="Deshacer">↺</button>`:""}</div>`).join("")}
    <div class="msg" style="margin-top:5px">Hechos observados, sin interpretar. Deshacer no borra el
    registro: agrega una corrección, igual que cualquier otro cambio de opinión.</div></div>`;
}
